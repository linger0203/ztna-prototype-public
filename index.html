/* ---------- 原型导航桥（导航面板 / 直链用，2026-11-19 v2.34） ----------
   1) navGo(route,name)：由 route 反查所属模块 → 切模块 → 开页面（不闪一次模块首页）
   2) 直链：index.html?demo=1#/resource/publish/profile 直接落在该页，跳过登录
   PS：右下角那个导航面板在 nav_panel.js 里，这里只提供「按 route 跳转」这一件事 */
(function(){
  if(typeof MODULES==='undefined') return;   /* 自检桩环境没有菜单数据，直接跳过 */

  var LEAVES=[];
  MODULES.forEach(function(m){
    m.menus.forEach(function(nd){
      var items=nd.items||(nd.route?[nd]:[]);
      items.forEach(function(it){
        LEAVES.push({mod:m.key, name:it.name, route:it.route});
      });
    });
  });
  function leafOf(route){
    for(var i=0;i<LEAVES.length;i++) if(LEAVES[i].route===route) return LEAVES[i];
    return null;
  }

  /* 进应用：登录页 / 选择角色页只在第一次路过 */
  function navEnter(){
    var app=document.getElementById('app');
    if(app && app.style.display!=='block'){
      var lg=document.getElementById('login'), rl=document.getElementById('role');
      if(lg) lg.classList.add('hide');
      if(rl) rl.classList.add('hide');
      try{ enterApp(); }catch(e){}
    }
  }

  /* 项目定制（navOnly）不切顶栏与左侧菜单：跳进去只换内容区 */
  function isNavOnly(key){
    for(var i=0;i<MODULES.length;i++) if(MODULES[i].key===key) return !!MODULES[i].navOnly;
    return false;
  }

  function navGo(route,name,opt){
    opt=opt||{};
    if(!route) return false;
    var lf=leafOf(route);
    if(!lf) return false;
    name=name||lf.name;
    navEnter();
    if(curModule!==lf.mod && !isNavOnly(lf.mod)){
      curModule=lf.mod;
      var links=document.querySelectorAll('#topnav a');
      for(var i=0;i<links.length;i++) links[i].classList.toggle('on', links[i].getAttribute('data-k')===lf.mod);
      try{ renderSidebar(); }catch(e){}
    }
    /* replace=true 只留这一个页签；默认像点菜单一样把页签留着 */
    if(opt.replace===true) tabs=[{name:name,route:route}];
    openPage(name,route);
    try{ if(typeof window.npSyncEntry==='function') window.npSyncEntry(); }catch(e){}
    return true;
  }

  /* 直链：#/route 或 ?page=/route */
  function hashRoute(){
    var h=String((typeof location!=='undefined'&&location.hash)||'');
    var m=/^#\/?([^?]*)/.exec(h);
    var r=m&&m[1]?'/'+m[1].replace(/\/+$/,''):'';
    if(!r){
      var q=String((typeof location!=='undefined'&&location.search)||'');
      var p=/[?&]page=([^&]+)/.exec(q);
      if(p) r=decodeURIComponent(p[1]);
    }
    return r && leafOf(r) ? r : '';
  }
  function bootNav(){
    var r=hashRoute();
    if(!r) return;
    var lf=leafOf(r);
    navGo(r, lf?lf.name:'', {replace:true});
  }
  if(typeof document!=='undefined' && document.addEventListener){
    if(document.readyState==='loading') document.addEventListener('DOMContentLoaded',bootNav);
    else bootNav();
    if(typeof window!=='undefined' && window && window.addEventListener){
      window.addEventListener('hashchange',function(){
        var r=hashRoute();
        if(r){ var lf=leafOf(r); navGo(r, lf?lf.name:'', {replace:true}); }
      });
    }
  }

  window.navGo=navGo;
  window.navLeaves=function(){ return LEAVES; };
})();

/* ---------- 原型页面导航 · 左侧常驻栏（index 内嵌，2026-11-19 v2.36） ----------
   左右布局：左栏 264px 常驻，右侧原型整体右移；收起后 52px 竖条；全屏整栏隐藏。
   点一条 = 直接跳过去，栏不收起，可以连着点着看。 */
(function(){
  if(typeof MODULES==='undefined' || typeof document==='undefined') return;

  var W_OPEN=264, W_COL=52;
  var NP={inApp:false, col:false, pages:[], dock:null, btn:null, cur:''};

  /* ---------- 数据：摊平菜单 ---------- */
  function collect(){
    var out=[];
    MODULES.forEach(function(m){
      m.menus.forEach(function(nd){
        var items=nd.items||(nd.route?[nd]:[]);
        items.forEach(function(it){
          /* 菜单项可以只给 fn（定制功能直接落到某个页面的某个状态），没有 route 时用 fn: 前缀占位 */
          out.push({mod:m.key, modName:m.name, group:nd.group||(nd.center?'资源中心':''),
                    name:it.name, route:it.route||('fn:'+it.fn), fn:it.fn||''});
        });
      });
    });
    return out;
  }
  function esc(s){
    return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  }

  /* ---------- 树 ---------- */
  function treeHtml(){
    var h='', lastMod='', lastGrp=null, grpOpen=false;
    NP.pages.forEach(function(p){
      if(p.mod!==lastMod){
        if(grpOpen){ h+='</div></div>'; grpOpen=false; }
        if(lastMod) h+='</div></div>';
        var n=NP.pages.filter(function(x){ return x.mod===p.mod; }).length;
        h+='<div class="np-mod open"><div class="np-mh"><i class="ar"></i><span class="t">'+esc(p.modName)+'</span>'
          +'<span class="c">'+n+'</span></div><div class="np-mb">';
        lastMod=p.mod; lastGrp=null;
      }
      var g=p.group||'';
      if(g!==lastGrp){
        if(grpOpen){ h+='</div></div>'; grpOpen=false; }
        if(g){ h+='<div class="np-grp open"><div class="np-gh"><i class="ar"></i><span>'+esc(g)+'</span></div><div class="np-gb">'; grpOpen=true; }
        lastGrp=g;
      }
      h+='<div class="np-it" data-r="'+esc(p.route)+'" data-fn="'+esc(p.fn||'')+'" data-s="'
        +esc((p.name+' '+p.route+' '+p.modName+' '+(p.group||'')).toLowerCase())+'"'
        +' title="'+esc(p.name+'　'+p.route)+'"><span>'+esc(p.name)+'</span></div>';
    });
    if(grpOpen) h+='</div></div>';
    if(lastMod) h+='</div></div>';
    return h;
  }

  /* ---------- 建栏 ---------- */
  function build(){
    if(NP.dock) return;
    NP.pages=collect();

    var d=document.createElement('aside');
    d.className='np-dock';
    d.id='npDock';
    d.innerHTML=
        '<div class="np-hd"><b>页面导航</b><span class="n">'+NP.pages.length+'</span>'
      + '<span class="col" data-act="col" title="收起（⌘K）">&#10094;</span></div>'
      + '<div class="np-q"><div class="box"><i class="i"></i>'
      + '<input id="npQ" placeholder="搜页面 / 路由" autocomplete="off" spellcheck="false"></div></div>'
      + '<div class="np-loginrow" data-act="login">登录页</div>'
      + '<div class="np-tree" id="npTree">'+treeHtml()+'</div>'
      + '<div class="np-ft"><span class="fs" data-act="fs" title="全屏查看（只剩原型本身，Esc 退出）"><i></i>全屏</span>'
      + '<span>⌘K 收起</span></div>'
      + '<div class="np-rail" data-act="col" title="展开页面导航（⌘K）"><i></i><span class="vt">页面导航</span></div>';
    document.body.appendChild(d);

    /* 登录页胶囊（登录页没有侧栏，用这个进） */
    var btn=document.createElement('button');
    btn.className='np-btn'; btn.id='npBtn'; btn.type='button';
    btn.innerHTML='<i></i>页面导航<kbd>⌘K</kbd>';
    btn.title='进入原型，左侧常驻页面导航';
    document.body.appendChild(btn);
    NP.dock=d; NP.btn=btn;

    btn.addEventListener('click',function(e){
      e.stopPropagation();
      var first=NP.pages[0];
      if(first) go(first.route); else toLogin();
    });

    d.addEventListener('click',function(e){
      var act=e.target.closest('[data-act]');
      if(act){
        var a=act.getAttribute('data-act');
        if(a==='col') return toggleCol();
        if(a==='login') return toLogin();
        if(a==='fs') return enterFull();
        return;
      }
      var mh=e.target.closest('.np-mh');
      if(mh){ mh.parentNode.classList.toggle('open'); return; }
      var gh=e.target.closest('.np-gh');
      if(gh){ gh.parentNode.classList.toggle('open'); return; }
      var it=e.target.closest('.np-it');
      if(it){
        var fn=it.getAttribute('data-fn');
        if(fn && typeof window[fn]==='function'){ window[fn](); if(NP.col) toggleCol(); return; }
        if(it.getAttribute('data-r')) go(it.getAttribute('data-r'));
      }
    });

    var q=document.getElementById('npQ');
    q.addEventListener('input',function(){ filter(q.value); });
    q.addEventListener('keydown',function(e){
      if(e.key==='Enter'){
        var first=NP.dock.querySelector('#npTree .np-it[data-r]:not([style*="display: none"])');
        if(first) go(first.getAttribute('data-r'));
      }else if(e.key==='Escape'){ q.value=''; filter(''); q.blur(); }
      e.stopPropagation();
    });

    document.addEventListener('keydown',function(e){
      if((e.metaKey||e.ctrlKey) && (e.key==='k'||e.key==='K')){
        e.preventDefault();
        if(NP.inApp) toggleCol();
        return;
      }
      var tag=((e.target&&e.target.tagName)||'').toLowerCase();
      var typing=(tag==='input'||tag==='textarea'||tag==='select');
      if(!typing && (e.key==='f'||e.key==='F') && !e.metaKey && !e.ctrlKey && !e.altKey && NP.inApp){
        e.preventDefault(); enterFull();
      }
    });
    ['fullscreenchange','webkitfullscreenchange'].forEach(function(ev){
      document.addEventListener(ev,onFsChange);
    });

    /* 页面切换后高亮跟着走 */
    var _open=openPage;
    openPage=function(n,r){ _open(n,r); mark(r); };

    syncEntry();
    (function(){
      var app=document.getElementById('app');
      if(app && window.MutationObserver) new MutationObserver(syncEntry).observe(app,{attributes:true,attributeFilter:['style']});
    })();
  }

  /* ---------- 宽度：顶栏 / 侧栏 / 主区三处让位靠这个变量 ---------- */
  function applyW(){
    var w='0px';
    if(NP.inApp && !document.body.classList.contains('np-fs')) w=(NP.col?W_COL:W_OPEN)+'px';
    document.body.style.setProperty('--npw',w);
  }
  function syncEntry(){
    var app=document.getElementById('app');
    var inApp=!!(app && app.style.display==='block');
    NP.inApp=inApp;
    document.body.classList.toggle('np-in',inApp);
    if(!inApp) document.body.classList.remove('np-fs');
    applyW();
    if(inApp) mark(currentRoute||'');
  }
  function toggleCol(){
    NP.col=!NP.col;
    document.body.classList.toggle('np-col',NP.col);
    applyW();
    if(!NP.col){
      var q=document.getElementById('npQ');
      if(q) setTimeout(function(){ try{ q.focus(); }catch(e){} },70);
    }
  }

  /* ---------- 跳转 ---------- */
  function pageOf(route){
    for(var i=0;i<NP.pages.length;i++) if(NP.pages[i].route===route) return NP.pages[i];
    return null;
  }
  function go(route){
    var p=pageOf(route); if(!p) return;
    if(typeof navGo==='function') navGo(route,p.name,{replace:false});
    else openPage(p.name,route);
    if(NP.col) toggleCol();       /* 收起态点了页面就展开，接着连着看 */
  }
  function toLogin(){
    var app=document.getElementById('app'); if(app) app.style.display='none';
    var role=document.getElementById('role'); if(role) role.classList.add('hide');
    var lg=document.getElementById('login'); if(lg) lg.classList.remove('hide');
    try{ if(typeof makeCap==='function') makeCap(); }catch(e){}
    syncEntry();
  }

  /* ---------- 全屏：只剩 index 本身 ---------- */
  function fsEl(){ return document.fullscreenElement||document.webkitFullscreenElement||null; }
  function toast(msg){
    var t=document.getElementById('npToast');
    if(!t){ t=document.createElement('div'); t.id='npToast'; t.className='np-toast'; document.body.appendChild(t); }
    t.textContent=msg; t.classList.add('on');
    clearTimeout(t.__tm);
    t.__tm=setTimeout(function(){ t.classList.remove('on'); },2200);
  }
  function onFsChange(){
    var on=!!fsEl();
    document.body.classList.toggle('np-fs',on);
    applyW();
    if(on) toast('全屏中 · 按 Esc 退出');
  }
  function enterFull(){
    var el=document.documentElement;
    var fn=el.requestFullscreen||el.webkitRequestFullscreen;
    if(!fn){ toast('当前浏览器不支持全屏，按 F11'); return; }
    var p;
    try{ p=fn.call(el); }catch(e){ toast('全屏被拦截，按 F11'); return; }
    if(p&&p.then) p.then(function(){ onFsChange(); },function(){ toast('全屏被拦截，按 F11'); });
    else setTimeout(onFsChange,120);
  }

  /* ---------- 高亮 / 搜索 ---------- */
  function mark(route){
    NP.cur=route||'';
    if(!NP.dock) return;
    var items=NP.dock.querySelectorAll('.np-it[data-r]');
    for(var i=0;i<items.length;i++) items[i].classList.toggle('on', items[i].getAttribute('data-r')===NP.cur);
    var cur=NP.dock.querySelector('.np-it.on');
    if(!cur || NP.col) return;
    var gb=cur.parentNode; if(gb && gb.classList.contains('np-gb')) gb.parentNode.classList.add('open');
    var mb=cur.closest('.np-mb'); if(mb) mb.parentNode.classList.add('open');
    try{
      var mod=cur.closest('.np-mod');
      var mh=mod&&mod.querySelector('.np-mh');
      if(mh) mh.scrollIntoView({block:'start'});
      var tree=document.getElementById('npTree');
      if(tree){
        var a=cur.getBoundingClientRect(), b=tree.getBoundingClientRect();
        if(a.top<b.top || a.bottom>b.bottom) cur.scrollIntoView({block:'nearest'});
      }
    }catch(e){}
  }
  function filter(v){
    if(!NP.dock) return;
    v=String(v||'').trim().toLowerCase();
    var hit=0;
    var mods=NP.dock.querySelectorAll('.np-mod');
    for(var i=0;i<mods.length;i++){
      var mod=mods[i], mHit=0;
      var its=mod.querySelectorAll('.np-it');
      for(var j=0;j<its.length;j++){
        var ok=!v || (its[j].getAttribute('data-s')||'').indexOf(v)>=0;
        its[j].style.display=ok?'':'none';
        if(ok) mHit++;
      }
      var grps=mod.querySelectorAll('.np-grp');
      for(var k=0;k<grps.length;k++){
        var gIts=grps[k].querySelectorAll('.np-it'), gHit=0;
        for(var m=0;m<gIts.length;m++) if(gIts[m].style.display!=='none') gHit++;
        grps[k].style.display=gHit?'':'none';
        if(gHit) grps[k].classList.add('open');
      }
      mod.style.display=mHit?'':'none';
      if(v&&mHit) mod.classList.add('open');
      hit+=mHit;
    }
    var none=NP.dock.querySelector('.np-empty');
    if(!hit){
      if(!none){
        none=document.createElement('div'); none.className='np-empty';
        document.getElementById('npTree').appendChild(none);
      }
      none.textContent='没有匹配的页面';
    }else if(none){ none.remove(); }
  }

  /* ---------- 对外 ---------- */
  window.npToggleCol=toggleCol;
  window.npSyncEntry=syncEntry;
  window.npGo=go;
  window.npIsInApp=function(){ return NP.inApp; };

  if(document.readyState==='loading') document.addEventListener('DOMContentLoaded',build);
  else build();

/* ---------- ③ 可授权菜单（权限树叶子） ---------- */
function rbacTree(){
  var out=[];
  MODULES.forEach(function(m){
    if(m.navOnly) return;
    var leaves=[];
    (m.menus||[]).forEach(function(nd){
      if(nd.items) nd.items.forEach(function(it){ leaves.push({n:it.name, r:it.route}); });
      else if(nd.route) leaves.push({n:nd.name, r:nd.route});
    });
    out.push({key:m.key, n:m.name, leaves:leaves});
  });
  return out;
}
var RBAC_TREE=null, RBAC_ALL_ROUTES={};
(function(){
  RBAC_TREE=rbacTree();
  RBAC_TREE.forEach(function(m){ m.leaves.forEach(function(l){ RBAC_ALL_ROUTES[l.r]=1; }); });
  function pick(keys){
    var o={};
    RBAC_TREE.forEach(function(m){
      if(keys.indexOf(m.key)<0) return;
      m.leaves.forEach(function(l){ o[l.r]=1; });
    });
    return o;
  }
  rbacRole('系统管理员').perms=pick(['home','terminal','network','resource','security','system']);
  rbacRole('审计管理员').perms=pick(['home','audit']);
  rbacRole('只读用户').perms=pick(['home','terminal']);
})();

function lpRowAt(r,gi){

function lpSelRows(r){
  var s=lst(r), q=(lpRows(r).rows||[]), out=[];
  Object.keys(s.sel||{}).forEach(function(k){ if(s.sel[k] && q[+k]) out.push(q[+k]); });
  return out;
}
function opAccAt(r,gi){
  var row=lpRowAt(r,gi); if(!row) return null;
  return rbacFind(strip(row[0]));

function rlRoleAt(r,gi){

  for(var i=0;i<RBAC_ROLES.length;i++) if(RBAC_ROLES[i].n===n) return RBAC_ROLES[i];

function permRedraw(){
  var box=document.querySelector('#fdDrawer .perm');

function permMod(mi){
  var m=RBAC_TREE[mi], all=m.leaves.every(function(l){ return PERM.pick[l.r] });
  m.leaves.forEach(function(l){ if(all) delete PERM.pick[l.r]; else PERM.pick[l.r]=1; });
  permRedraw();
}
function permLeaf(route){
  if(PERM.pick[route]) delete PERM.pick[route]; else PERM.pick[route]=1;
  permRedraw();
}
function permAll(on){
  PERM.pick={};
  if(on) Object.keys(RBAC_ALL_ROUTES).forEach(function(k){ PERM.pick[k]=1; });

/* 读当前表单（lpFormDrawer 里 .frow 结构） */
function lpFormValues(){
  var out=[], rows=document.querySelectorAll('#fdDrawer .frow');
  for(var i=0;i<rows.length;i++){
    var lb=rows[i].querySelector('label');
    var req=!!(lb&&lb.querySelector('em'));
    var name=lb? lb.textContent.replace(/[*\s]/g,'') : '';
    var sw=rows[i].querySelector('.ctl .sw');
    var el=rows[i].querySelector('.ctl input,.ctl select,.ctl textarea');
    var v;
    if(sw) v=sw.classList.contains('on')?'启用':'停用';
    else v=el? String(el.value).trim() : '';
    out.push({name:name, req:req, val:v});
  }
  return out;
}

/* 重写表单：支持回填 + 真保存 */
function lpForm(c,title,gi){
  var fs=c.form||[], route=c.route;
  var row=(gi!=null && gi>=0)? lpRowAt(route,gi) : null;
  var body=fs.map(function(f,i){
    var v = row? strip(String(row[i]==null?'':row[i])) : (f.v||'');
    var ctl;
    if(f.t==='sel'){
      var opts=f.opts||[];
      ctl='<select>'+(v&&opts.indexOf(v)<0? '<option selected>'+v+'</option>':'')
        +opts.map(function(o){ return '<option'+(o===v?' selected':'')+'>'+o+'</option>' }).join('')+'</select>';
    } else if(f.t==='area'){
      ctl='<textarea rows="3" placeholder="'+(f.ph||'')+'">'+v+'</textarea>';
    } else if(f.t==='sw'){
      ctl='<span class="sw'+((v==='启用'||f.on)?' on':'')+'" onclick="this.classList.toggle(\'on\')"><i></i></span>';
    } else {
      ctl='<input placeholder="'+(f.ph||'')+'" value="'+v+'">';
    }
    return '<div class="frow"><label>'+(f.req?'<em>*</em>':'')+esc0(f.lb)+'</label><div class="ctl">'+ctl
      +(f.hint?'<div class="hint">'+f.hint+'</div>':'')+'</div></div>';
  }).join('');
  lpFormDrawer(title, '<div class="fm-bd">'+body+'</div>',
    '<button class="btn-plain" onclick="lpCloseFormDrawer()">取消</button>'
    +'<button class="btn-pri" onclick="lpFormSave(\''+route+'\','+(row?gi:-1)+')">保存</button>', 520);
}
function esc0(s){ return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

function lpFormSave(route,gi){
  var c=LISTS[route]; if(!c){ lpCloseFormDrawer(); return; }
  var vals=lpFormValues();
  for(var i=0;i<vals.length;i++){
    if(vals[i].req && !vals[i].val){ lpTip('请填写「'+vals[i].name+'」'); return; }
  }
  var base = gi>=0? lpRowAt(route,gi) : null;
  if(base){
    for(var k=0;k<vals.length;k++) base[k]=vals[k].val;
    lpCloseFormDrawer(); lpTip('已保存'); lpRerender(); return;
  }
  var len=Math.max(c.cols.length,((c.rows||[])[0]||[]).length);
  var row=[];
  for(var j=0;j<len;j++) row.push(vals[j]? vals[j].val : '');
  c.rows=c.rows||[];
  c.rows.unshift(row);
  lst(route).page=1;
  lpCloseFormDrawer();
  lpTip('已新增 1 条');
  lpRerender();
}

/* 真删除（工具栏 / 行内） */
function crudDel(r,gi){
  var c=LISTS[r]; if(!c||!c.rows) return;
  var rows = gi>=0? [lpRowAt(r,gi)] : lpSelRows(r);
  rows=rows.filter(function(x){ return x; });
  if(!rows.length){ lpTip('请先勾选要删除的数据'); return; }
  lpConfirm('确认删除','将删除 '+rows.length+' 条数据，删除后不可恢复。',function(){
    for(var i=c.rows.length-1;i>=0;i--){ if(rows.indexOf(c.rows[i])>=0) c.rows.splice(i,1); }
    lst(r).sel={};
    lpTip('已删除 '+rows.length+' 条');
    lpRerender();
  },'danger');
}

/* 包一层：删除走真删；有自定义 handler 的页面不动 */
(function(){
  var _act=lpAct;
  lpAct=function(r,name){
    var c=LISTS[r]||{};
    var custom=!!(c.opHandlers&&c.opHandlers[name]);
    if(!custom && c.rows && !c.html){
      if(name==='删除'){ crudDel(r,-1); return; }
      if(name==='维护'){ if(crudMaintain(r,-1,true)) return; }
      if(name==='取消维护'){ if(crudMaintain(r,-1,false)) return; }
      if(name==='启用'||name==='停用'){ if(crudSetState(r,-1,name==='启用'?'正常':'停用')) return; }
    }
    _act(r,name);
  };
  var _op=lpOp;
  lpOp=function(r,gi,name){
    var c=LISTS[r]||{};
    if(name==='删除' && !(c.opHandlers&&c.opHandlers['删除']) && c.rows && !c.html){ crudDel(r,gi); return; }
    _op(r,gi,name);
  };
})();

/* 状态类按钮（启用/停用、维护/取消维护）真生效：改选中行的状态列 */
function crudSetState(r,gi,text){
  var c=LISTS[r]; if(!c||!c.cols) return false;
  var ci=-1;
  for(var i=0;i<c.cols.length;i++){
    if(/状态|在线|发布/.test(c.cols[i].t)){ ci=i; break; }
  }
  if(ci<0) return false;
  var rows = gi>=0? [lpRowAt(r,gi)] : lpSelRows(r);
  rows=rows.filter(function(x){ return x; });
  if(!rows.length){ lpTip('请先勾选数据'); return true; }
  var good=/^(正常|启用|生效中|已发布|在线|可值|已开启|开启)$/.test(text);
  rows.forEach(function(row){
    row[ci]='<span class="dot '+(good?'g':'gy')+'">'+text+'</span>';
  });
  lst(r).sel={}; lpRerender();
  lpTip('已设为「'+text+'」'+rows.length+' 条');
  return true;
}
/* 维护 / 取消维护 单独处理（状态列取「维护中 / 正常」） */
function crudMaintain(r,gi,on){
  var c=LISTS[r]; if(!c||!c.cols) return false;
  var ci=-1;
  for(var i=0;i<c.cols.length;i++){ if(/维护/.test(c.cols[i].t)){ ci=i; break; } }
  if(ci<0) return false;
  var rows = gi>=0? [lpRowAt(r,gi)] : lpSelRows(r);
  rows=rows.filter(function(x){ return x; });
  if(!rows.length){ lpTip('请先勾选数据'); return true; }
  rows.forEach(function(row){
    row[ci]='<span class="dot '+(on?'o':'g')+'">'+(on?'维护中':'正常')+'</span>';
  });
  lst(r).sel={}; lpRerender();
  lpTip((on?'已进入维护：':'已取消维护：')+rows.length+' 条');
  return true;
}
