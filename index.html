var CAP_COLORS=['#F2C94C','#FF7BA9','#5ADE8B','#5FB8FF','#C79BFF'];
function makeCap(){
  var box=document.getElementById('capImg'), code='';
  var chars='ABCDEFGHJKLMNPQRSTUVWXY3456789';
  var html='';
  for(var i=0;i<4;i++){
    var ch=chars.charAt(Math.floor(Math.random()*chars.length));
    code+=ch;
    html+='<b style="color:'+CAP_COLORS[i%CAP_COLORS.length]+'">'+ch+'</b>';
  }
  box.innerHTML=html;
  document.getElementById('c').value=code;
}
function doLogin(){
  var u=document.getElementById('u').value.trim(), p=document.getElementById('p').value.trim(), c=document.getElementById('c').value.trim();
  if(!u||!p){ document.getElementById('err').textContent='请输入账号和密码'; return; }
  if(!c){ document.getElementById('err').textContent='请输入验证码'; return; }
  var shown=document.getElementById('capImg').textContent.trim();
  if(c.toUpperCase()!==shown.toUpperCase()){ document.getElementById('err').textContent='验证码不正确'; return; }
  document.getElementById('err').textContent='';
  document.getElementById('login').classList.add('hide');
  document.getElementById('role').classList.remove('hide');
}
function pickRole(el){
  var all=el.parentNode.querySelectorAll('.opt');
  for(var i=0;i<all.length;i++) all[i].classList.remove('on');
  el.classList.add('on');
}
function enterApp(){
  document.getElementById('role').classList.add('hide');
  document.getElementById('app').style.display='block';
  buildTopNav(); switchModule('home');
}

/* ================= 外壳 ================= */
function buildTopNav(){
  var html='';
  MODULES.forEach(function(m){
    html+='<a href="javascript:;" data-k="'+m.key+'" onclick="switchModule(\''+m.key+'\')">'+m.name+'</a>';
  });
  document.getElementById('topnav').innerHTML=html;
}

var curModule='home';
function switchModule(k){
  curModule=k;
  var links=document.querySelectorAll('#topnav a');
  for(var i=0;i<links.length;i++) links[i].classList.toggle('on', links[i].getAttribute('data-k')===k);
  renderSidebar();
  if(k==='home'){ openPage(HOME_LAST.name, HOME_LAST.route); return; }
  var first=firstLeaf(k);
  if(first) openPage(first.name, first.route);
}

function firstLeaf(k){
  var m=MODULES.filter(function(x){return x.key===k})[0];
  for(var i=0;i<m.menus.length;i++){
    var it=m.menus[i];
    if(it.items) return it.items[0];
    if(it.name) return it;
  }
}

function renderSidebar(){
  var m=MODULES.filter(function(x){return x.key===curModule})[0];
  var html='';
  m.menus.forEach(function(node,gi){
    if(node.center){
      html+='<div style="position:relative"><div class="dc-pick" onclick="toggleDc(event)">'
          + '<i class="iconfont icon-ziyuanjianshi ico"></i><span class="nm" id="dcName">'+currentCenter+'</span>'
          + '<i class="iconfont icon-drop_down arrow"></i></div>'
          + '<div class="dc-pop" id="dcPop">'
          + CENTERS.map(function(c){ return '<div class="'+(c===currentCenter?'on':'')+'" onclick="pickCenter(\''+c+'\')">'+c+'</div>' }).join('')
          + '</div></div>';
      node.items.forEach(function(it){
        html+='<div class="it" data-r="'+it.route+'" onclick="openPage(\''+it.name+'\',\''+it.route+'\')"><span>'+it.name+'</span></div>';
      });
      return;
    }
    if(node.group){
      var fly=encodeURIComponent(JSON.stringify(node.items.map(function(x){return {n:x.name,r:x.route}})));
      html+='<div class="grp open"><div class="hd" data-fly="'+fly+'" onmouseenter="showFly(this)" onmouseleave="hideFlySoon()" onclick="toggleGrp(this)"><i class="iconfont '+(node.icon||'')+' ico"></i><span>'+node.group+'</span><i class="iconfont icon-drop_down arrow"></i></div><div class="bd">';
      node.items.forEach(function(it){
        html+='<div class="it" data-r="'+it.route+'" onclick="openPage(\''+it.name+'\',\''+it.route+'\')"><span>'+it.name+'</span></div>';
      });
      html+='</div></div>';
      return;
    }
    var fly1=encodeURIComponent(JSON.stringify([{n:node.name,r:node.route}]));
    html+='<div class="alone" data-r="'+node.route+'" data-fly="'+fly1+'" onmouseenter="showFly(this)" onmouseleave="hideFlySoon()" onclick="openPage(\''+node.name+'\',\''+node.route+'\')"><i class="iconfont '+(node.icon||'')+' ico"></i><span class="lb">'+node.name+'</span></div>';
  });
  document.getElementById('side').innerHTML=html;
}
function toggleGrp(hd){ hd.parentNode.classList.toggle('open'); }
function toggleCollapse(){
  var app=document.getElementById('app');
  app.classList.toggle('collapsed');
  var lb=document.querySelector('.sidebar .collapse span');
  if(lb) lb.textContent = app.classList.contains('collapsed') ? '展开菜单' : '收起菜单';
}
function toggleDc(e){ e.stopPropagation(); document.getElementById('dcPop').classList.toggle('on'); }
function pickCenter(c){
  currentCenter=c;
  document.getElementById('dcName').textContent=c;
  document.getElementById('dcPop').classList.remove('on');
  var ds=document.querySelectorAll('#dcPop div');
  for(var i=0;i<ds.length;i++) ds[i].classList.toggle('on', ds[i].textContent===c);
  closeTab(null, currentRoute); openPage('Web应用','/resource/application/system');
}

function togglePop(id,e){
  if(e) e.stopPropagation();
  var ids=['popSafety','popUser'];
  for(var i=0;i<ids.length;i++){
    var el=document.getElementById(ids[i]);
    if(ids[i]===id) el.classList.toggle('on'); else el.classList.remove('on');
  }
  if(id==='popSafety') renderSafety();
}
function renderSafety(){
  var box=document.getElementById('safetyApps');
  var list=QUICK_ACCESS.filter(function(a){return a.on});
  if(!list.length){ box.innerHTML='<div class="empty">未配置快捷访问应用，请到「系统 / 配置中心 / 快捷访问」添加</div>'; return; }
  box.innerHTML=list.map(function(a){
    return '<div class="app" title="'+a.url+'" onclick="window.open(\''+a.url+'\',\'_blank\')">'
      +'<div class="ic"><i class="iconfont '+(a.icon||'icon-identity_security')+'"></i></div>'
      +'<div class="nm">'+a.name+'</div></div>';
  }).join('');
}
document.addEventListener('click',function(){
  var ids=['popSafety','popUser'];
  for(var i=0;i<ids.length;i++) document.getElementById(ids[i]).classList.remove('on');
});

/* ================= 收起态飞层 ================= */
function showFly(el){
  var app=document.getElementById('app');
  if(!app.classList.contains('collapsed')){ document.getElementById('flyout').classList.remove('on'); return; }
  var raw=el.getAttribute('data-fly'); if(!raw) return;
  var items=JSON.parse(decodeURIComponent(raw));
  var f=document.getElementById('flyout');
  clearTimeout(window.__flyT);
  var r=el.getBoundingClientRect();
  f.style.top=r.top+'px';
  var head='';
  if(items.length>1){
    var lb=el.querySelector('.lb')||el.querySelector('span');
    head='<div class="ft">'+(lb?lb.textContent:'')+'</div>';
  }
  f.innerHTML=head+items.map(function(i){
    return '<div class="fi'+(i.r===currentRoute?' on':'')+'" onclick="flyGo(\''+i.r+'\',\''+i.n+'\')">'+i.n+'</div>';
  }).join('');
  f.classList.add('on');
}
function hideFlySoon(){ clearTimeout(window.__flyT); window.__flyT=setTimeout(function(){ document.getElementById('flyout').classList.remove('on'); },180); }
function flyGo(route,name){ document.getElementById('flyout').classList.remove('on'); openPage(name,route); }

function qaHtml(){
  var tb=QUICK_ACCESS.map(function(a,i){
    return '<tr><td>'+a.name+'</td><td style="color:#606266">'+a.url+'</td>'
      +'<td><span class="sw'+(a.on?' on':'')+'" onclick="qaToggle('+i+')"><i></i></span>'
      +'<span style="margin-left:8px;font-size:12px;color:'+(a.on?'#00B42A':'#909399')+'">'+(a.on?'是':'否')+'</span></td>'
      +'<td class="c-op"><a class="op" onclick="qaEdit('+i+')">编辑</a>'
      +'<a class="op" onclick="qaDel('+i+')">删除</a></td></tr>';
  }).join('');
  if(!QUICK_ACCESS.length) tb='<tr><td colspan="4"><div class="lp-empty"><div class="big">暂无数据</div><div>点击「新增」添加常用系统入口</div></div></td></tr>';
  return '<div class="lp-card"><div class="lp-body">'
    +'<div class="toolbar">'
    +'<button class="btn-pri" onclick="qaAdd()">新增</button>'
    +'<button class="btn-plain" onclick="qaDelAll()">删除</button>'
    +'<div class="tsearch"><i class="iconfont icon-search"></i><input class="fin" placeholder="请输入应用名称" onkeydown="if(event.key===\'Enter\')lpTip(\'查询完成\')"></div>'
    +'</div>'
    +'<div class="lp-tbl-wrap"><table class="lp-tbl"><thead><tr><th>应用名称</th><th>应用地址</th>'
    +'<th style="width:150px">是否启用</th><th class="c-op">操作</th></tr></thead><tbody>'+tb+'</tbody></table></div>'
    +'<div class="pager2"><span>共 '+QUICK_ACCESS.length+' 条</span></div>'
    +'</div></div>'+modalHtml();
}
function qaToggle(i){ QUICK_ACCESS[i].on=!QUICK_ACCESS[i].on; renderPage('快捷访问','/system/quick-access/index'); }
function qaDel(i){
  lpConfirm('删除确认','确定删除快捷访问「'+QUICK_ACCESS[i].name+'」？',function(){
    QUICK_ACCESS.splice(i,1); renderPage('快捷访问','/system/quick-access/index'); lpTip('已删除');
  });
}
function qaDelAll(){
  if(!QUICK_ACCESS.length){ lpTip('暂无可删除项'); return; }
  lpConfirm('删除确认','确定清空全部 '+QUICK_ACCESS.length+' 个快捷访问？',function(){
    QUICK_ACCESS=[]; renderPage('快捷访问','/system/quick-access/index'); lpTip('已清空');
  });
}
function qaAdd(){
  QUICK_ACCESS.push({name:'新应用'+(QUICK_ACCESS.length+1),url:'https://',on:false});
  renderPage('快捷访问','/system/quick-access/index');
  qaEdit(QUICK_ACCESS.length-1);
}
function qaEdit(i){
  var a=QUICK_ACCESS[i];
  lpOpenModal('编辑快捷访问',
    '<div class="frow"><label><em>*</em>应用名称</label><div class="ctl"><input id="qaN" value="'+a.name+'"></div></div>'
    +'<div class="frow"><label><em>*</em>应用地址</label><div class="ctl"><input id="qaU" value="'+a.url+'">'
    +'<div class="hint">需以 http:// 或 https:// 开头，展示在顶栏「零信任安全中心」面板</div></div></div>',
    '<button class="btn-plain" onclick="lpCloseModal()">取消</button>'
    +'<button class="btn-pri" onclick="qaSave('+i+')">保存</button>');
}
function qaSave(i){
  var n=document.getElementById('qaN').value.trim(), u=document.getElementById('qaU').value.trim();
  if(!n){ lpTip('请输入应用名称'); return; }
  if(!/^https?:\/\//.test(u)){ lpTip('应用地址需以 http:// 或 https:// 开头'); return; }
  QUICK_ACCESS[i].name=n; QUICK_ACCESS[i].url=u;
  lpCloseModal(); renderPage('快捷访问','/system/quick-access/index'); lpTip('已保存');
}

function openPage(name, route){
  currentRoute=route; currentName=name;
  if(curModule==='home'){
    /* 首页不出页签，只记住停留页，切回首页时回到这里 */
    HOME_LAST={name:name, route:route};
  } else {
    var exist=tabs.filter(function(t){return t.route===route})[0];
    if(!exist) tabs.push({name:name, route:route});
  }
  renderTabs(); markSide(route); renderPage(name, route);
}
function renderTabs(){
  var bar=document.getElementById('tabbar');
  /* 首页模块整条页签栏不展示 */
  if(curModule==='home'){ bar.classList.add('hide'); bar.innerHTML=''; return; }
  bar.classList.remove('hide');
  var html='';
  tabs.forEach(function(t){
    html+='<div class="tab'+(t.route===currentRoute?' on':'')+'" onclick="openPage(\''+t.name+'\',\''+t.route+'\')">'
        + '<span>'+t.name+'</span><span class="x" onclick="closeTab(event,\''+t.route+'\')">×</span></div>';
  });
  bar.innerHTML=html;
}
function closeTab(e, route){
  if(e) e.stopPropagation();
  var idx=-1;
  for(var i=0;i<tabs.length;i++) if(tabs[i].route===route) idx=i;
  if(idx<0) return;
  tabs.splice(idx,1);
  if(route===currentRoute){
    if(tabs.length){ var t=tabs[Math.max(0,idx-1)]; openPage(t.name,t.route); }
    else { currentRoute=''; renderTabs(); document.getElementById('page').innerHTML=''; }
  } else renderTabs();
}
function markSide(route){
  var els=document.querySelectorAll('#side .it,#side .alone');
  for(var i=0;i<els.length;i++) els[i].classList.toggle('on', els[i].getAttribute('data-r')===route);
}

function fit(arr,n){
  if(arr.length===n) return arr;
  var out=[];
  for(var i=0;i<n;i++) out.push(arr[Math.round(i*(arr.length-1)/(n-1))]);
  return out;
}

/*<<LISTS_JS_BEGIN>>*/
/* ================= 列表页引擎（第 2 批） ================= */
var LISTS={}, LSTATE={};
function reg(r,c){ c.route=r; LISTS[r]=c; }
function lst(r){ if(!LSTATE[r]) LSTATE[r]={page:1,size:10,sel:{},node:0,tab:0}; return LSTATE[r]; }
function lpRerender(){ renderPage(currentName, currentRoute); }
function lpTip(msg){
  var t=document.getElementById('toast');
  if(!t){ t=document.createElement('div'); t.id='toast'; document.body.appendChild(t); }
  t.textContent=msg; t.className='toast on';
  clearTimeout(window.__tt); window.__tt=setTimeout(function(){ t.className='toast'; },1700);
}

/* --- 单元格小工具 --- */
function d(txt,cls){ return '<span class="dot '+(cls||'g')+'">'+txt+'</span>'; }
function tg(txt,cls){ return '<span class="tag '+(cls||'')+'">'+txt+'</span>'; }
function tick(b){ return b? '<span style="color:#00B42A;font-weight:700">&#10003;</span>' : '<span style="color:#C0C4CC">&mdash;</span>'; }
function ell(txt){ return '<span class="ell" title="'+txt+'">'+txt+'</span>'; }
function lnk(txt,fn){ return '<a href="javascript:;" style="color:#0095E5" onclick="'+fn+'">'+txt+'</a>'; }
function strip(h){ return String(h).replace(/<[^>]+>/g,''); }

/* --- 分页数据 --- */
function treeItems(c){
  var t=c.tree, s=lst(c.route);
  if(!t) return [];
  return t.tabItems ? (t.tabItems[s.tab||0]||[]) : (t.items||[]);
}
function lpRows(r){
  var c=LISTS[r], st=lst(r), all=(c.rows||[]).slice(0);
  /* 左侧树节点过滤：节点带 k 字段时按 k 过滤数据 */
  if(c.nodeFilter){
    var its=treeItems(c), it=its[st.node||0];
    if(it && it.k!==undefined && it.k!==null){
      all=all.filter(function(row){ return c.nodeFilter(row,it.k); });
    }
  }
  var total=all.length, pages=Math.max(1,Math.ceil(total/st.size));
  if(st.page>pages) st.page=pages;
  return {all:all,total:total,pages:pages,rows:all.slice((st.page-1)*st.size, st.page*st.size)};
}
function lpPage(r,p){ var s=lst(r),q=lpRows(r); s.page=Math.min(Math.max(1,p|0),q.pages); lpRerender(); }
function lpSize(r,v){ var s=lst(r); s.size=parseInt(v,10)||10; s.page=1; lpRerender(); }
function lpSel(el,r,gi){ var s=lst(r); if(el.checked) s.sel[gi]=1; else delete s.sel[gi]; }
function lpAll(el,r){
  var s=lst(r), q=lpRows(r), st=(s.page-1)*s.size;
  q.rows.forEach(function(_,i){ if(el.checked) s.sel[st+i]=1; else delete s.sel[st+i]; });
  lpRerender();
}
function lpSelCount(r){ return Object.keys(lst(r).sel).length; }

/* --- 渲染 --- */
function lpHtml(r){
  var c=LISTS[r];
  if(c.before) c.before(c,r);
  return '<div class="lp-card">'+(c.tree? treeHtml(c):'')+'<div class="lp-body">'+lpBody(r)+'</div></div>'
    + drawerHtml(c) + modalHtml();
}
function treeHtml(c){
  var t=c.tree, s=lst(c.route), ti=(s.tab||0), h='<div class="tree">';
  var items = t.tabItems ? (t.tabItems[ti]||[]) : t.items;
  var title = t.tabTitles ? (t.tabTitles[ti]||'') : t.title;
  var tools = t.tabTools ? (t.tabTools[ti]||[]) : (t.tool||[]);
  if(t.tabs) h+='<div class="dtabs" style="padding:0 14px;margin-bottom:6px">'+t.tabs.map(function(x,i){
    return '<span class="'+(i===ti?'on':'')+'" onclick="lpTab(\''+c.route+'\','+i+')">'+x+'</span>' }).join('')+'</div>';
  h+='<div class="th">'+title;
  if(tools.length) h+='<span class="tool">'+tools.map(function(x){return '<i class="iconfont '+x+'" title=""></i>'}).join('')+'</span>';
  h+='</div>';
  h+=items.map(function(it,i){
    var cls='tn'+(it.lv?' lv'+it.lv:'')+(i===s.node?' on':'');
    var ar=it.ar?'<i class="ar'+(it.open!==false?' open':'')+'"></i>':'<i class="ar none"></i>';
    return '<div class="'+cls+'" onclick="lpNode(\''+c.route+'\','+i+')" title="'+it.n+'">'+ar+'<span class="tx">'+it.n+'</span></div>';
  }).join('');
  if(t.foot) h+=t.foot;
  var foot = t.tabFoots ? (t.tabFoots[ti]||'') : '';
  if(foot) h+=foot;
  return h+'</div>';
}
function lpNode(r,i){
  var c=LISTS[r], its=treeItems(c), it=its[i];
  /* 节点带 go 时跳转到对应页面（用于「一个菜单下多页」的左树导航） */
  if(it && it.go){ openPage(it.n, it.go); return; }
  lst(r).node=i; lpRerender();
}

function lpBody(r){
  var c=LISTS[r], h='';
  /* 自定义整页渲染（复杂卡片式页面用） */
  if(c.html) return c.html(c,r);
  if(c.cardTitle){
    h+='<div class="lp-ct"><h4>'+c.cardTitle+'</h4>'
      +(c.cardBtn? '<button class="btn-pri" onclick="lpTip(\''+c.cardBtn+'（演示）\')">'+c.cardBtn+'</button>':'')
      +'</div>';
  }
  if(c.tabs2) h+=tabs2Html(c);
  if(c.filters && c.filters.length) h+=filterHtml(c);
  if((c.toolbar&&c.toolbar.length) || c.search) h+=toolbarHtml(c);
  h+=tableHtml(r);
  h+=pagerHtml2(r);
  return h;
}
function tabs2Html(c){
  var s=lst(c.route);
  return '<div class="dtabs" style="margin-bottom:12px">'+c.tabs2.map(function(t,i){
    return '<span class="'+(i===s.tab?'on':'')+'" onclick="lpTab(\''+c.route+'\','+i+')">'+t+'</span>' }).join('')+'</div>';
}
function lpTab(r,i){ var s=lst(r); s.tab=i; s.node=0; lpRerender(); }

function filterHtml(c){
  var h='<div class="filters">';
  (c.filters||[]).forEach(function(f){
    if(f.t==='sel'){
      h+='<select class="fsel">'+'<option>'+f.ph+'</option>'+(f.opts||[]).map(function(o){return '<option>'+o+'</option>'}).join('')+'</select>';
    }else if(f.t==='date'){
      h+='<span class="fdate"><i class="iconfont icon-date_selection"></i><input class="fin" value="'+f.v1+'"><em>至</em><input class="fin" value="'+f.v2+'"></span>';
    }else{
      h+='<input class="fin" placeholder="'+f.ph+'"'+(f.w?' style="width:'+f.w+'px"':'')+'>';
    }
  });
  if(c.more!==false) h+='<span class="fmore" onclick="lpTip(\'展开更多筛选条件（演示）\')">更多筛选 <i class="iconfont icon-drop_down"></i></span>';
  h+='<span class="fbtns"><button class="btn-plain" onclick="lpTip(\'已重置筛选条件\')">重置</button>'
    +'<button class="btn-pri" onclick="lpTip(\'查询完成\')">查询</button></span></div>';
  return h;
}
function toolbarHtml(c){
  var h='<div class="toolbar">';
  (c.toolbar||[]).forEach(function(b){
    var cls=b.pri?'btn-pri':'btn-plain';
    h+='<button class="'+cls+'" onclick="lpAct(\''+c.route+'\',\''+b.n+'\')">'+b.n+'</button>';
  });
  if(c.search) h+='<div class="tsearch"><i class="iconfont icon-search"></i><input class="fin" placeholder="'+c.search+'" onkeydown="if(event.key===\'Enter\')lpTip(\'查询完成\')"></div>';
  return h+'</div>';
}
function tableHtml(r){
  var c=LISTS[r], q=lpRows(r), s=lst(r);
  var th='<tr>';
  if(c.check) th+='<th class="c-chk"><input type="checkbox" onclick="lpAll(this,\''+r+'\')"></th>';
  c.cols.forEach(function(col){ th+='<th'+(col.w?' style="width:'+col.w+'"':'')+'>'+col.t+'</th>'; });
  if(c.ops) th+='<th class="c-op">操作</th>';
  th+='</tr>';
  var tb=q.rows.map(function(row,i){
    var gi=(s.page-1)*s.size+i, td='<tr>';
    if(c.check) td+='<td class="c-chk"><input type="checkbox" '+(s.sel[gi]?'checked':'')+' onclick="lpSel(this,\''+r+'\','+gi+')"></td>';
    row.forEach(function(cell){ td+='<td>'+cell+'</td>'; });
    if(c.ops) td+='<td class="c-op">'+c.ops.map(function(o){
      return '<a class="op" onclick="lpOp(\''+r+'\','+gi+',\''+o.n+'\')">'+o.n+'</a>' }).join('')+'</td>';
    return td+'</tr>';
  }).join('');
  if(!q.rows.length) tb='<tr><td colspan="'+((c.check?1:0)+c.cols.length+(c.ops?1:0))+'"><div class="lp-empty"><div class="big">暂无数据</div><div>调整筛选条件后重试</div></div></td></tr>';
  return '<div class="lp-tbl-wrap"><table class="lp-tbl"><thead>'+th+'</thead><tbody>'+tb+'</tbody></table></div>';
}
function pagerHtml2(r){
  var q=lpRows(r), s=lst(r), h='<div class="pager2"><span>共 '+q.total+' 条</span><div class="pg">';
  h+='<span class="'+(s.page<=1?'dis':'')+'" onclick="lpPage(\''+r+'\','+(s.page-1)+')">&#8249;</span>';
  var pages=q.pages, list=[];
  if(pages<=7){ for(var i=1;i<=pages;i++) list.push(i); }
  else{
    list=[1];
    var st=Math.max(2,s.page-2), en=Math.min(pages-1,s.page+2);
    if(st>2) list.push('...');
    for(var j=st;j<=en;j++) list.push(j);
    if(en<pages-1) list.push('...');
    list.push(pages);
  }
  list.forEach(function(i){
    if(i==='...') h+='<span class="dis">...</span>';
    else h+='<span class="'+(i===s.page?'on':'')+'" onclick="lpPage(\''+r+'\','+i+')">'+i+'</span>';
  });
  h+='<span class="'+(s.page>=pages?'dis':'')+'" onclick="lpPage(\''+r+'\','+(s.page+1)+')">&#8250;</span></div>';
  h+='<select onchange="lpSize(\''+r+'\',this.value)">'+[10,20,50].map(function(n){
      return '<option value="'+n+'" '+(n===s.size?'selected':'')+'>'+n+' 条/页</option>' }).join('')+'</select>';
  h+='<span class="jump">前往<input value="'+s.page+'" onkeydown="if(event.key===\'Enter\')lpPage(\''+r+'\',this.value|0)">页</span></div>';
  return h;
}

/* --- 操作 --- */
function lpAct(r,name){
  var c=LISTS[r];
  if(name==='删除'){
    var n=lpSelCount(r);
    if(!n){ lpTip('请先勾选要删除的数据'); return; }
    lpConfirm('确认删除','已选中 '+n+' 条数据，删除后不可恢复。',function(){ lst(r).sel={}; lpTip('已删除 '+n+' 条（演示）'); lpRerender(); });
    return;
  }
  if(name==='刷新'){ lpTip('已刷新'); lpRerender(); return; }
  if(c.form) { lpForm(c, name); return; }
  lpTip(name+'（演示）');
}
function lpOp(r,gi,name){
  var c=LISTS[r];
  if(name==='详情'||name==='查看'){ if(c.drawer){ lpOpenDrawer(r,gi); return; } }
  if(name==='删除'){ lpConfirm('确认删除','删除后不可恢复，是否继续？',function(){ lpTip('已删除（演示）'); }); return; }
  if(name==='编辑'&&c.form){ lpForm(c,'编辑'); return; }
  lpTip(name+'（演示）');
}

/* --- 抽屉 --- */
function drawerHtml(c){
  if(!c.drawer) return '';
  return '<div class="mask" id="mask" onclick="lpCloseDrawer()"></div>'

/* 普通弹窗（表单/查看类）。确认弹框会把 #modal 的内容整体换掉，
   所以这里要能自己把结构补回来，否则关掉确认框再开普通弹窗就是空的 */
function lpModalReset(){
  var m=document.getElementById('modal');
  if(!m) return null;
  if(!document.getElementById('mTitle')){
    m.className='modal';
    m.innerHTML='<div class="mh"><span id="mTitle"></span><span class="x" onclick="lpCloseModal()">&#10005;</span></div>'
      +'<div class="mb" id="mBody"></div><div class="mf" id="mFoot"></div>';
  }
  return m;
}
function lpOpenModal(title, body, foot){
  var m=lpModalReset(); if(!m) return;
  document.getElementById('mTitle').textContent=title;
  document.getElementById('mBody').innerHTML=body;
  document.getElementById('mFoot').innerHTML=foot||'';
  m.classList.add('on');
  var k=document.getElementById('mMask'); if(k) k.classList.add('on');
}
function lpCloseModal(){
  var m=document.getElementById('modal'); if(m) m.classList.remove('on');
  var k=document.getElementById('mMask'); if(k) k.classList.remove('on');
  var t=document.getElementById('pfHoverTip'); if(t) t.style.display='none';
}

/* 全局规则（2026-11-17 沁定）：所有「填写类」弹框统一走右侧抽屉。
   确认类（删除确认、结束学习确认、纯查看）仍用居中弹窗——它们没有要填的东西，
   弹窗反而更聚焦。表单入口统一从这里出，各页面不再自己拼一套。 */
function lpFormDrawer(title, body, foot, w){   /* 宽度默认按规范标准抽屉 476px */
  var e=document.getElementById('fdDrawer'); if(e&&e.parentNode) e.parentNode.removeChild(e);
  var m=document.getElementById('fdMask'); if(m&&m.parentNode) m.parentNode.removeChild(m);
  var W=w||476;
  var html='<div class="mask on" id="fdMask" onclick="lpCloseFormDrawer()"></div>'
    +'<div class="drawer on" id="fdDrawer" style="width:'+W+'px;min-width:'+W+'px;max-width:'+W+'px;z-index:86;background:#fff">'
    +'<div class="dh"><b>'+title+'</b><span class="x" onclick="lpCloseFormDrawer()">&#10005;</span></div>'
    +'<div class="db" style="background:#fff">'+body+'</div>'
    +'<div class="dft" style="justify-content:flex-end">'+(foot||'')+'</div></div>';
  document.body.insertAdjacentHTML('beforeend',html);
}
function lpCloseFormDrawer(){
  ['fdMask','fdDrawer'].forEach(function(id){
    var e=document.getElementById(id); if(e&&e.parentNode) e.parentNode.removeChild(e);
  });
}
/* 确认型弹框（2026-11-18 按《4.2.3 通用组件-模态弹窗》改）
   规范要点：固定宽 496px（16+80N 栅格）、高度自适应 120–600px、遮罩 #000 40%；
   结构是「图标 + 标题」一行 + 说明文案 + 右下角 取消 / 确定，没有分割线、没有右上角关闭；
   危险操作用红色确定按钮。tone：info / warn / danger / success */
function lpConfirm(title,msg,ok,tone){
  window.__ok=ok;
  var t=tone||'info';
  var m=document.getElementById('modal'); if(!m) return;
  var ic=(t==='success')?'&#10003;':'!';
  if(t==='info') ic='?';
  m.className='modal cf on '+t;
  m.innerHTML='<div class="cfh"><span class="cfi">'+ic+'</span><b>'+title+'</b></div>'
    +'<div class="cfb">'+msg+'</div>'
    +'<div class="cff"><button class="btn-plain" onclick="lpCloseModal()">取消</button>'
    +'<button class="btn-pri'+(t==='danger'?' danger':'')+'" onclick="lpCloseModal();window.__ok&&window.__ok()">确定</button></div>';
  var k=document.getElementById('mMask'); if(k) k.classList.add('on');
}
function lpForm(c,title){
  var fs=c.form||[];
  var body=fs.map(function(f){
    var ctl;
    if(f.t==='sel') ctl='<select>'+(f.opts||[]).map(function(o){return '<option>'+o+'</option>'}).join('')+'</select>';
    else if(f.t==='area') ctl='<textarea placeholder="'+(f.ph||'')+'"></textarea>';
    else if(f.t==='sw') ctl='<span class="sw'+(f.on?' on':'')+'" onclick="this.classList.toggle(\'on\')"><i></i></span>';
    else ctl='<input placeholder="'+(f.ph||'')+'" value="'+(f.v||'')+'">';
    return '<div class="frow"><label>'+(f.req?'<em>*</em>':'')+f.lb+'</label><div class="ctl">'+ctl
      +(f.hint?'<div class="hint">'+f.hint+'</div>':'')+'</div></div>';
  }).join('');
  lpFormDrawer(title, body,
    '<button class="btn-plain" onclick="lpCloseFormDrawer()">取消</button>'
    +'<button class="btn-pri" onclick="lpCloseFormDrawer();lpTip(\'已保存（演示）\')">保存</button>');
}

  var c=GW_CLUSTERS.filter(function(x){ return x.n===cluster; })[0];

}
/* 左侧树：类型 → 集群；类型节点也可筛选 */
function gwTree(title,tool){
  var items=[{n:'所有集群',ar:true}];
  GW_TYPES.forEach(function(t){
    items.push({n:t,ar:true,lv:1,k:t});
    GW_CLUSTERS.filter(function(c){ return c.t===t; }).forEach(function(c){
      items.push({n:c.n,lv:2,k:c.n});
    });
  });
  return {title:title||'网关集群分组',tool:tool||['icon-newly_added','icon-edit','icon-delete'],items:items};
}
function gwHit(k,v){ return v===k || gwTypeOf(v)===k; }
function gwNodeCluster(id){
  var n=GW_NODES.filter(function(x){ return x[0]===id; })[0];
  return n? n[1] : '';
}

/* 模块数据是批次私有的（2026-11-18 改）：原来所有批次共用 PF_MODS_FULL 里同一批对象，
   A 画像校准完，B 画像跟着一起变——既没法做版本对比，也没法把基线模块回填到新画像。
   现在批次首次被访问时按 b.ord 深拷贝一份，之后改名 / 主 API / 敏感度 / 顺序都只动这一份。
   注意 __modsN：学习阶段 b.mod=0，会被问出一次空数组；分析完成把 mod 改成 7 时
   必须按新的模块数重建，否则模块清单永远是空的（空数组在 JS 里是 truthy） */
function pfClone(o){ return JSON.parse(JSON.stringify(o)); }
function pfMods(b){
  if(!b) return [];
  var n=b.mod||0;
  /* 显式赋过模块数组（pfEvolve / 演示数据）且数量对得上 → 原样用，不碰模板。
     不能把 mod 截到 PF_MODS_FULL.length：再次学习生成的画像会多出模板里没有的新模块
     （文件预览），一截就又按模板重建，新模块当场丢掉，对比永远算不出「新增」 */
  if(b.mods && b.__modsN===n) return b.mods;
  var tpl=Math.min(n, PF_MODS_FULL.length);
  var src=(b.ord&&b.ord.length===tpl)?b.ord.slice(0):(function(){var a=[];for(var i=0;i<tpl;i++)a.push(i);return a;})();
  b.mods=src.map(function(k){ return pfClone(PF_MODS_FULL[k]); });
  b.__modsN=n;
  return b.mods;
}
/* 取当前批次的第 ri 个模块（渲染/操作都以批次内索引为准） */
function pfModAt(ri){
  var m=pfMods(pfCurBatch());
  return (m&&m[ri])?m[ri]:null;
}

/* ---------- 版本标识 ----------
   一个应用的第几次学习 = 第几版画像。批次号 PF-20261116-02 这种串没人记得住，
   列表和对比下拉里一律显示「V2 · 11-05~11-12」，能一眼认出是哪一版。
   编号按学习开始时间升序：最早那版是 V1，最新一次学习就是最大号（2026-11-18 沁提） */
function pfVerNo(a,b){
  if(!a||!b) return 0;
  var arr=(a.batches||[]).slice(0).sort(function(x,y){ return x.ct>y.ct?1:-1; });
  for(var i=0;i<arr.length;i++){ if(arr[i].id===b.id) return i+1; }
  return 0;
}
function pfVerTag(a,b){
  var n=pfVerNo(a,b);
  return n?('<i class="pf-ver">V'+n+'</i>'):'';
}
function pfVerTx(a,b){
  var n=pfVerNo(a,b);
  return (n?'V'+n:'—')+' · '+String(b.ct||'').slice(5,10)+'~'+String(b.et||'').slice(5,10);
}

/* 采集量增长：真实环境由引擎按秒上报，原型用定时器模拟，便于演示条数在跳 */
function pfLiveTick(){
  var any=false;
  PF_DATA.forEach(function(a){
    (a.batches||[]).forEach(function(b){
      if(b.st!=='lr') return;
      b.cnt=(b.cnt||0)+20+Math.floor(Math.random()*60);
      b.liveAt=pfNowStr();
      any=true;
    });
  });
  if(!any) return;
  if(pfModalOpen()) return;   /* 弹框打开中不重绘，等用户操作完 */
  if(typeof currentRoute!=='undefined'&&currentRoute==='/resource/publish/profile'){
    var cb=pfCurBatch();
    if(cb&&cb.st==='lr') lpRerender();
  }
}
function pfLiveTimer(){
  if(typeof window==='undefined'||!window.document) return;
  if(typeof setInterval!=='function') return;
  if(window.__pfLiveT) return;
  window.__pfLiveT=setInterval(pfLiveTick,5000);
}
/* 弹窗打开时不刷新页面：modal 挂在 #page 内，lpRerender 会把它一起刷掉，
   表现为"结束学习弹框自己消失"。2026-11-17 沁的反馈。 */
function pfModalOpen(){
  if(typeof document==='undefined'||!document.getElementById) return false;
  var m=document.getElementById('modal');
  return !!(m && m.className && m.className.indexOf('on')>=0);

/* 新学习产出的画像：以当前生效画像为底，叠加上本次新识别到的内容。
   —— 应用没变化时，重新学习的识别结果本该和上一版几乎一致，所以底稿取基线；
      原型里固定多识别出一个「文件预览」模块，模拟"应用上了新功能"，
      这样从新建学习一路点下来，对比页能真的看到「新增 1」。
   —— 真实环境这块完全由识别结果决定，原型只是给一个确定的演示态 */
function pfEvolve(a,b){
  if(!a||!b||b.st!=='pd'||b.__evolved) return;
  b.__evolved=1;
  /* 底稿优先取当前生效画像；没有已发布的，退到最近一版已出结果的画像
     （只学到「待发布」就再学一次的场景，也得能看出这一版多了什么） */
  var pb=null, fallback=null;
  (a.batches||[]).forEach(function(x){
    if(x.id===b.id) return;
    if(x.st==='pb'&&!pb) pb=x;
    if((x.st==='pd'||x.st==='rp')&&!fallback) fallback=x;
  });
  var src=pb||fallback;
  if(!src) return;                      /* 这个应用的第一次学习，没有底稿可继承 */
  var base=pfMods(src);
  if(!base.length) return;
  var ms=base.map(function(m){ return pfClone(m); });
  if(!ms.some(function(m){ return m.n==='文件预览'; })){
    ms.push({n:'文件预览',api:2,main:'/blim-api/api/file/v1/preview',cnt:168,usr:19,sens:'',
      apis:[{u:'/blim-api/api/file/v1/preview',cnt:132,usr:19},
            {u:'/blim-api/api/file/v1/thumb',cnt:36,usr:11}]});
  }
  b.mods=ms; b.mod=ms.length; b.__modsN=ms.length;
}

/* 分析中 → 待发布：2026-11-17 沁定 5 秒——演示时不用干等，等待感也够 */
function pfAutoAn(){
  if(typeof window==='undefined'||!window.document) return;
  PF_DATA.forEach(function(a){
    (a.batches||[]).forEach(function(b){
      if(b.st!=='an'||b._anT) return;
      b._anT=1;
      setTimeout(function(){
        b._anT=0;
        if(b.st!=='an') return;
        b.st='pd'; b.mod=b.mod||PF_MODS_FULL.length;
        b.pt='';
        pfEvolve(a,b);
        pfAudit(a.n,b.id,'生成画像','分析完成，产出 '+b.mod+' 个模块，转为待发布');
        if(PF_CUR.app===a.id){ lpTip('「'+a.n+'」画像已生成，待发布'); if(!pfModalOpen()) lpRerender(); }
      },5000);
    });
  });
}

    if(b.st==='lr') stCell+='<div class="pf-sub">剩余 '+b.left+'</div><div class="pf-bar"><i style="width:'+(b.pct||0)+'%"></i></div>';

    h+='<tr class="'+(on?'on':'')+'" onclick="pfPickBatch(\''+b.id+'\')">'
      +'<td class="c-chk"><input type="radio" name="pfb" '+(on?'checked':'')+'></td>'
      +'<td'+(on?' class="cur"':'')+'>'+pfVerTag(app,b)+b.ct+' ~ '+b.et.slice(5,10)+'</td>'
      +'<td>'+b.days+' 天</td><td>'+pfNum(b.cnt)+'</td><td>'+pfNum(b.mod)+'</td>'
      +'<td>'+stCell+'</td><td style="color:#909399">'+(b.pt||'\u2014')+'</td>'
      /* 主操作位固定宽度：发布 / 取消发布 / 结束学习 / — 文字长度不同，不固定宽度会把删除顶来顶去 */
      +'<td><div class="pf-ops">'
      +'<span class="pf-op-cell">'
      /* 主操作位按状态切换：待发布/已替换→发布、已发布→取消发布、学习中→结束学习，同一位置只出现一个
         已替换也能再发布：重新发就是把这份画像回滚生效，当前生效的那份转已替换 */
      +(b.st==='pd' ? pfOp('发布', true, 'pfPublish(\''+app.id+'\',\''+b.id+'\')')
        : b.st==='rp' ? pfOp('发布', true, 'pfPublish(\''+app.id+'\',\''+b.id+'\')', '重新发布')
        : b.st==='pb' ? pfOp('取消发布', true, 'pfUnpublish(\''+app.id+'\',\''+b.id+'\')')
        : b.st==='lr' ? pfOp('结束学习', true, 'pfStopLearn(\''+app.id+'\',\''+b.id+'\')')
        : '<span class="op dis">\u2014</span>')
      +'</span>'
      +pfOp('删除', b.st!=='pb', 'pfDelBatch(\''+app.id+'\',\''+b.id+'\')', '已发布画像不允许删除，请先取消发布')
      +'</div></td></tr>';
  });
  h+='</tbody></table></div>';

  /* 内容 */
  if(cur && (cur.st==='lr'||cur.st==='pd'||cur.st==='pb'||cur.st==='rp')){
    var live=(cur.st==='lr');
    /* 对比模式接管整个内容区：差异清单 + 明细，比挤在表格里看得清 */
    if(PF_CMP.on && !live){
      h+='<div class="pf-content">'+pfCmpView(app,cur)+'</div>';
    }else{
    var tabs=live?['请求列表']:['模块清单','模块分析','请求列表'];
    h+='<div class="pf-ttabs">'
      +tabs.map(function(t,i){
        return '<span class="'+(i===PF_CUR.tab?'on':'')+'" onclick="pfTab('+i+')">'+t+'</span>' }).join('')
      +'<span class="meta">'+pfVerTx(app,cur)+' · 批次 '+cur.id+' · 采集 '+pfNum(cur.cnt)+' 条 · '+cur.usr+' 个用户'
        +(live?' · <b style="color:#0095E5">学习中，实时采集</b>':'')
        +(cur.st==='pb'?' · <b style="color:#00B42A">当前生效</b>':'')
        +(cur.st==='rp'?' · <b style="color:#A8ABB2">已被替换，可重新发布</b>':'')+'</span>'
      +((cur.st==='pd'||cur.st==='rp')
        ? '<span class="act">'
          +(pfCmpBaseList(cur).length?'<button class="btn-line pf-cmpgo" onclick="pfCmpOpen()">版本对比</button>':'')
          +'<button class="btn-pri pf-btn" onclick="pfPublish(\''+app.id+'\',\''+cur.id+'\')">'+(cur.st==='rp'?'重新发布画像':'发布画像')+'</button></span>'
        : '')
      +'</div>';
    h+='<div class="pf-content">';
    if(live) h+=pfReqList(cur);
    else if(PF_CUR.tab===0) h+=pfModList(cur);
    else if(PF_CUR.tab===1) h+=pfAnalysis(cur);
    else h+=pfReqList(cur);
    h+='</div>';
    }
  }else if(cur){
    h+=pfAnalyzing(cur);
  }
  h+='</div></div>';
  pfAutoAn(); pfLiveTimer();
  return h;
}

/* 操作链接：可用为蓝色，不可用置灰不可点 */
function pfOp(label,on,handler,tip){
  return on
    ? '<a class="op" onclick="event.stopPropagation();'+handler+'">'+label+'</a>'
    : '<span class="op dis" title="'+(tip||'当前状态不可操作')+'">'+label+'</span>';
}

function pfPickApp(id){
  PF_CUR.app=id; PF_CUR.batch=''; PF_CUR.tab=0;
  var bs=pfSorted(pfApp(id));
  if(bs.length) PF_CUR.batch=bs[0].id;
  lpRerender();
}
function pfPickBatch(id){ PF_CUR.batch=id; PF_CUR.tab=0; lpRerender(); }
function pfTab(i){ PF_CUR.tab=i; lpRerender(); }
function pfQ(k,v){ PF_Q[k]=v; lpRerender(); }

/* ---------- 模块清单 ---------- */
function pfSensTag(s){
  var v=PF_SENS[s||'none'];
  return '<span class="pf-sens" style="color:'+v.c+';background:'+v.bg+'">'+v.t+'</span>';
}
function pfToggleExp(n){
  if(PF_EXP[n]) delete PF_EXP[n]; else PF_EXP[n]=1;
  lpRerender();
}
function pfModList(b){
  /* 编辑权限：只有「已发布」锁住（它正在给日志打标签，改了会和线上标签对不上），
     待发布 / 已替换 / 学习中 / 分析中 都允许改；已替换改完不影响当前生效画像 */
  var mods=pfMods(b), editable=(b.st!=='pb');
  var kw=(PF_MODQ.kw||'').trim().toLowerCase();

  /* 常驻提示：讲清主 API 是什么、为什么要有。放列表上方，不塞在底部。
     2026-11-17 沁：去掉"改法：展开任一模块…"那句操作说明——怎么改看每行右侧的「主 API」就够，
     提示条只留一句口径；只读状态仍要说明原因 */
  var h='<div class="pf-tipbar">'
    +'<span class="ic">i</span>'
    +'<div class="tb">'
    +'<div class="tx">列表中的模块由系统根据请求数据自动识别生成。<b>每个模块选择设置一条主 API</b>，请求命中即判定为访问该模块；'
    +'标签可供 Trust Agent 做行为基线与访问异常检测。</div>'
    +(editable?'':'<div class="tx2">当前画像已发布、正在给访问日志打标签，模块清单只读。要调整请先「取消发布」，或等下一次学习产出的待发布画像校准好再发布。</div>')
    +'</div>'
    +'</div>';

  /* 工具行：API / 模块名模糊查询 + 展开全部 */
  var list=mods;
  if(kw){
    list=mods.filter(function(m){
      if(m.n.toLowerCase().indexOf(kw)>=0) return true;
      return (m.apis||[]).some(function(a){ return a.u.toLowerCase().indexOf(kw)>=0; });
    });
    /* 命中即展开，省得用户还要一条条点开找命中的 API */
    list.forEach(function(m){ PF_EXP[m.n]=1; });
  }
  var allOpen=list.length>0;
  list.forEach(function(m){ if(!PF_EXP[m.n]) allOpen=false; });

  /* 工具条分区（2026-11-17）：左边管"表格整体"——展开全部 + 条数；右边管"筛选"——搜索框。
     原来展开全部在右边跟搜索挤在一起，两个动作一个管显示一个管过滤，混在一排容易点错 */
  h+='<div class="pf-mtools">'
    +'<span class="mt-l">'
    +'<span class="lk" onclick="pfExpAll('+(allOpen?0:1)+')">'+(allOpen?'收起全部':'展开全部')+'</span>'
    +'<i class="sep"></i>'
    +'共 <b>'+list.length+'</b> 个模块</span>'
    +'<span class="schx"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="11" cy="11" r="6.5"/><path d="m16 16 4 4"/></svg>'
    +'<input placeholder="搜索模块名称或 API 接口" value="'+PF_MODQ.kw+'" oninput="pfModQ(this.value)">'
    +(PF_MODQ.kw?'<b class="clr" onclick="pfModQ(\'\')" title="清空">&#10005;</b>':'')+'</span>'
    +'</div>';

  mods=list;
  if(!mods.length){
    return h+'<div class="pf-mempty">没有匹配「'+PF_MODQ.kw+'」的模块或 API，换个关键字试试</div>';
  }

  /* 分页（2026-11-17）：模块多的应用一屏放不下，给条数统计 + 页码；搜索后回到第 1 页 */
  var total=mods.length, size=PF_MODSIZE||10;
  var pages=Math.max(1,Math.ceil(total/size));
  if(PF_MODPAGE>pages) PF_MODPAGE=pages;
  if(PF_MODPAGE<1) PF_MODPAGE=1;
  var from=(PF_MODPAGE-1)*size, pageRows=mods.slice(from,from+size);

  /* 展开行表格（对齐 el-table type="expand"）：主行一行看完关键信息，展开看该模块的 API 明细 */
  h+='<table class="pf-mtbl"><thead><tr>'
    +'<th class="c-exp"></th>'
    +'<th class="c-seq">序号</th>'
    +'<th style="width:168px">模块名称</th>'
    +'<th style="width:70px">敏感度</th>'
    +'<th>主 API</th>'
    +'<th class="r" style="width:82px">调用次数</th>'
    +'<th class="r" style="width:66px">用户数</th>'
    +'<th class="r" style="width:60px">API 数</th>'
    +'<th style="width:104px">操作</th>'
    +'</tr></thead><tbody>';

  pageRows.forEach(function(m,i){
    var gi=from+i;                       /* 全局序号：翻到第 2 页从 11 开始，不重新从 1 数 */
    var ri=mods.indexOf(m);
    var open=!!PF_EXP[m.n];
    h+='<tr class="pf-mrow'+(open?' on':'')+'"'+(editable
      ?' draggable="true" data-ri="'+ri+'" ondragstart="pfDragStart(event)" ondragover="pfDragOver(event)"'
        +' ondragleave="pfDragLeave(event)" ondrop="pfDrop(event)" ondragend="pfDragEnd(event)"'
      :'')+' onclick="pfToggleExp(\''+m.n+'\')">'
      +'<td class="c-exp"><span class="pf-caret'+(open?' on':'')+'">'+(open?'&minus;':'+')+'</span></td>'
      +'<td class="c-seq">'+(editable?'<span class="pf-grip" title="拖动调整顺序"><i></i></span>':'')
        +'<span class="no">'+(gi+1)+'</span></td>'
      +'<td class="c-nm" onclick="event.stopPropagation()"><span class="pf-mod-nm" title="'+m.n+'">'+m.n+'</span>'
        +(m.__cal==='base'?'<span class="pf-ctag cal">沿用基线</span>':'')+'</td>'
      +'<td><span'+(editable
        ?' class="pf-senpick" title="点击设置模块敏感度" onclick="event.stopPropagation();pfPickSens('+ri+')"'
        :'')+'>'+pfSensTag(m.sens)+'</span></td>'
      +'<td class="c-main"><span class="u" title="主 API（判定依据）：'+m.main+'">'+m.main+'</span></td>'
      +'<td class="r num">'+m.cnt.toLocaleString()+'</td>'
      +'<td class="r num">'+m.usr+'</td>'
      +'<td class="r num">'+m.api+'</td>'
      +'<td class="c-op">'+(editable
        ?'<a class="op" onclick="event.stopPropagation();pfRename('+ri+')">改名</a>'
          +'<a class="op" onclick="event.stopPropagation();pfPickMain('+ri+','+i+')">主 API</a>'
        :'<span class="dim">\u2014</span>')+'</td>'
      +'</tr>';

    /* 展开行：只放该模块抓到的全部 API，主 API 置顶并标记
       2026-11-17 按沁的反馈去掉模块信息块（模块名/主应用/涉及用户/调用次数/API 数都与上面主行重复） */
    if(open){
      var apis=m.apis.slice(0).sort(function(x,y){
        if(x.u===m.main) return -1;
        if(y.u===m.main) return 1;
        return y.cnt-x.cnt;
      });
      h+='<tr class="pf-mexp"><td colspan="9"><div class="pf-exp">'
        +'<table class="pf-apitbl"><thead><tr>'
        +'<th>API 地址</th>'
        +'<th class="r" style="width:100px">调用次数</th>'
        +'<th class="r" style="width:80px">用户数</th>'
        +'<th class="r" style="width:92px">占本模块</th>'
        +'<th style="width:112px">操作</th>'
        +'</tr></thead><tbody>';
      apis.forEach(function(a){
        var isMain=(a.u===m.main), owner=pfApiOwner(ri,a.u);
        var share=m.cnt?Math.round(a.cnt/m.cnt*100):0;
        /* 类名不用 .main：外壳全局有 .main{display:flex}，会把这个 tr 变成 flex 容器，单元格全叠在一起 */
        var hit=!!(kw && a.u.toLowerCase().indexOf(kw)>=0);
        h+='<tr class="'+(isMain?'pf-row-main':'')+(hit?' pf-row-hit':'')+'">'
          +'<td class="c-u"><span class="u" title="'+a.u+'">'+a.u+'</span>'
            +(isMain?'<span class="pf-mainbg">主 API</span>':'')
            +(owner?'<span class="pf-ownerbg" title="该 API 归属模块「'+owner+'」">属「'+owner+'」</span>':'')
          +'</td>'
          +'<td class="r num">'+a.cnt.toLocaleString()+'</td>'
          +'<td class="r num">'+a.usr+'</td>'
          +'<td class="r num">'+share+'%</td>'
          +'<td class="c-op">'
          +(isMain?'<span class="op dis">当前主 API</span>'
            :owner?'<span class="op dis" title="该 API 归属模块「'+owner+'」，不能重复使用">已被占用</span>'
            :editable?'<a class="op" onclick="pfSetMain('+ri+',\''+a.u+'\')">设为主 API</a>'
            :'<span class="dim">\u2014</span>')
          +'</td></tr>';
      });
      h+='</tbody></table></div></td></tr>';
    }
  });
  h+='</tbody></table>';

  /* 分页条：左边条数统计，右边页码 */
  var pn='';
  for(var p=1;p<=pages;p++){
    if(pages>7 && p!==1 && p!==pages && Math.abs(p-PF_MODPAGE)>1){
      if(p===2||p===pages-1) pn+='<span class="pn dots">…</span>';
      continue;
    }
    pn+='<span class="pn'+(p===PF_MODPAGE?' on':'')+'" onclick="pfModPage('+p+')">'+p+'</span>';
  }
  h+='<div class="pf-pager"><span>共 <b>'+total+'</b> 条</span>'
    +'<span class="pgs">'
    +'<span class="pn'+(PF_MODPAGE<=1?' dis':'')+'" onclick="pfModPage('+(PF_MODPAGE-1)+')">上一页</span>'
    +pn
    +'<span class="pn'+(PF_MODPAGE>=pages?' dis':'')+'" onclick="pfModPage('+(PF_MODPAGE+1)+')">下一页</span>'
    +'</span></div>';

  return h;
}
/* 模块清单翻页；搜索词变了要回第 1 页，否则会停在一个空页上 */
function pfModPage(p){
  var n=Math.max(1,p||1);
  if(n===PF_MODPAGE) return;
  PF_MODPAGE=n; lpRerender();
}
/* 模块清单搜索：按模块名或 API 路径模糊匹配 */
function pfModQ(v){ PF_MODQ.kw=v||''; PF_MODPAGE=1; lpRerender(); }

/* 操作列的「主 API」：把该模块的 API 明细展开，让用户在里面挑主 API
   （敏感度那列本身可点，操作列不再重复给一个入口） */
function pfPickMain(ri,i){
  var m=pfModAt(ri);
  if(!m) return;
  PF_EXP[m.n]=1;
  lpRerender();
  lpTip('已展开「'+m.n+'」的 API 列表，点目标 API 后的「设为主 API」即可');
}

/* 展开/收起全部模块 */
function pfExpAll(on){
  var b=pfCurBatch(); if(!b) return;
  PF_EXP={};
  if(on) pfMods(b).forEach(function(m){ PF_EXP[m.n]=1; });
  lpRerender();
}
/* 某个 API 被哪些模块占用（返回模块名，未占用返回空）——只在本批次内查 */
function pfApiOwner(ri,u){
  var mm=pfMods(pfCurBatch());
  for(var j=0;j<mm.length;j++){
    if(j===ri) continue;
    var hit=(mm[j].apis||[]).filter(function(a){ return a.u===u; })[0];
    if(hit) return mm[j].n;
  }
  return '';
}
/* 在 API 明细表里直接把某个 API 设为主 API */
function pfSetMain(ri,u){
  var m=pfModAt(ri);
  if(u===m.main){ lpTip('已经是主 API 了'); return; }
  var owner=pfApiOwner(ri,u);
  if(owner){ lpTip('该 API 归属模块「'+owner+'」，不能重复使用'); return; }
  var old=m.main;
  m.main=u;
  pfAudit(pfCurApp().n,m.n,'改主 API',old+' → '+u);
  lpTip('主 API 已改为 '+u.split('/').pop());
  lpRerender();
}

/* 敏感度设置 */
function pfPickSens(ri){
  var m=pfModAt(ri);
  var body='<div class="pf-hint" style="margin-bottom:12px">给「'+m.n+'」标一个安全等级，供 TA 做异常响应分级时参考（如薪资、财务类模块可设为高敏）。不选即为「未设置」。</div>';
  body+='<div class="pf-senslist">';
  ['none','low','mid','high'].forEach(function(k){
    var v=PF_SENS[k];
    body+='<div class="pf-sensopt'+(m.sens===k||(!m.sens&&k==='none')?' on':'')+'" onclick="pfSensOk('+ri+',\''+k+'\')">'
      +'<span class="pf-sens" style="color:'+v.c+';background:'+v.bg+'">'+v.t+'</span>'
      +'<span class="ft">'+(k==='none'?'不标记安全等级':(k==='high'?'泄露影响重大，需重点管控':(k==='mid'?'含敏感业务数据':'普通业务模块')))+'</span></div>';
  });
  body+='</div>';
  lpOpenModal('设置模块敏感度', body, '<button class="btn-plain" onclick="lpCloseModal()">取消</button>');
}
function pfSensOk(ri,k){
  var m=pfModAt(ri);
  m.sens=(k==='none'?'':k);
  lpCloseModal();
  pfAudit(pfCurApp().n,m.n,'改敏感度','敏感度 → '+(k==='none'?'未设置':PF_SENS[k].t));
  lpRerender(); lpTip('敏感度已更新');
}

/* 拖拽排序 */
function pfDragStart(e){
  PF_DRAG=parseInt(e.currentTarget.getAttribute('data-ri'),10);
  e.dataTransfer.effectAllowed='move';
  try{ e.dataTransfer.setData('text/plain',''); }catch(x){}
  e.currentTarget.classList.add('dragging');
}
function pfDragOver(e){
  e.preventDefault();
  e.dataTransfer.dropEffect='move';
  if(e.currentTarget.getAttribute('data-ri')===String(PF_DRAG)) return;
  e.currentTarget.classList.add('drop-t');
}
function pfDragLeave(e){ e.currentTarget.classList.remove('drop-t'); }
function pfDragEnd(e){
  e.currentTarget.classList.remove('dragging');
  var t=document.querySelectorAll('.pf-mtbl tr.drop-t, .pf-sort-tbl tr.drop-t');
  for(var i=0;i<t.length;i++) t[i].classList.remove('drop-t');
  PF_DRAG=null;
}
function pfDrop(e){
  e.preventDefault();
  var to=parseInt(e.currentTarget.getAttribute('data-ri'),10);
  e.currentTarget.classList.remove('drop-t');
  var from=PF_DRAG; PF_DRAG=null;
  if(isNaN(to)||from===null||from===to) return;
  var b=pfCurBatch();
  if(!b||b.st==='pb'){ lpTip('已发布画像正在给访问日志打标签，需先取消发布才能调整顺序'); return; }
  var mm=pfMods(b);
  if(!(from>=0&&from<mm.length&&to>=0&&to<mm.length)) return;
  var moved=mm.splice(from,1)[0];
  mm.splice(to,0,moved);
  pfAudit(pfCurApp().n,b.id,'调整模块顺序',
    '「'+moved.n+'」移至第 '+(to+1)+' 位');
  lpRerender(); lpTip('模块顺序已更新');
}

/* 改名（2026-11-17 沁）：不再内联编辑——原来把模块名变成输入框，鼠标悬停是编辑光标+虚线，
   想拖选文字时一点就进编辑态，选不中。
   改成点「改名」弹框：名字保持普通文本（可拖选复制），改一次确认一次 */
/* 表格里的悬停气泡（2026-11-17 沁：用户名只占一行，完整名单悬停看）
   挂到 body 上而不是单元格里——卡片和表格都可能 overflow:hidden，放在里面会被裁掉一半 */
function pfTipShow(el){
  var html='';
  try{ html=decodeURIComponent(el.getAttribute('data-tip-html')||''); }catch(e){ html=''; }
  if(!html) return;
  var t=document.getElementById('pfHoverTip');
  if(!t){
    t=document.createElement('div');
    t.id='pfHoverTip'; t.className='pf-htip';
    document.body.appendChild(t);
  }
  t.innerHTML=html;
  t.style.display='block';
  var r=el.getBoundingClientRect(), vw=window.innerWidth||1200;
  var left=r.left;
  if(left+t.offsetWidth>vw-12) left=vw-12-t.offsetWidth;
  if(left<12) left=12;
  /* 下方放不下就翻到上方，避免贴到窗口底被切掉 */
  var h=t.offsetHeight, vh=window.innerHeight||800;

  t.style.top=top+'px';
}

/* ================= 画像对比（2026-11-18 新增） =================
   场景：应用新增了模块，重新学习生成了新画像。管理员要快速确认「新画像 vs
   当前生效画像（或其他历史画像）」在模块结构上到底差在哪，并能把基线里已经
   校准好的模块直接回填到新画像，不用逐项重抄。
   对比口径：模块结构（名称 / 主 API / API 列表 / 敏感度），不含调用量与用户数
   —— 后者随学习窗口变化，比了没有决策价值。 */
var PF_CMP={on:false,base:'',sel:'',only:''};

/* 能当基线的：当前批次之外，且已经有画像的批次（学习中、分析中没有画像可对） */
function pfCmpBaseList(cb){
  var out=[];
  pfSorted(pfCurApp()).forEach(function(b){
    if(b.id===cb.id) return;
    if(b.st==='lr'||b.st==='an') return;
    out.push(b);
  });
  return out;
}
function pfCmpOpen(){
  var cb=pfCurBatch(); if(!cb) return;
  var list=pfCmpBaseList(cb);
  if(!list.length){ lpTip('没有可对比的历史画像：先发布一版，或结束一次学习'); return; }
  var hit=null;
  list.forEach(function(b){ if(b.id===PF_CMP.base) hit=b; });
  if(!hit) list.forEach(function(b){ if(!hit && b.st==='pb') hit=b; });
  if(!hit) hit=list[0];
  PF_CMP.on=true; PF_CMP.base=hit.id; PF_CMP.sel=''; PF_CMP.only='';
  lpRerender();
}
function pfCmpClose(){ PF_CMP.on=false; PF_CMP.sel=''; PF_CMP.only=''; lpRerender(); }
function pfCmpSetBase(id){ PF_CMP.base=id; PF_CMP.sel=''; lpRerender(); }
function pfCmpFilter(k){ PF_CMP.only=(PF_CMP.only===k?'':k); lpRerender(); }
function pfCmpPick(k){ PF_CMP.sel=(PF_CMP.sel===k?'':k); lpRerender(); }

/* 两个模块的 API 是否同一批（只比路径） */
function pfApiSet(m){
  var s={}; ((m&&m.apis)||[]).forEach(function(a){ s[a.u]=1; }); return s;
}

/* 算差异：先同名匹配，再用「主 API 相同」认出改名，再退到「API 重合度过半」 */
function pfCmpRows(cb, bb){
  var cm=pfMods(cb), bm=pfMods(bb);
  var usedB={}, usedC={}, rows=[];

  function pair(bi, ci, how){
    usedB[bi]=1; usedC[ci]=1;
    var b=bm[bi], c=cm[ci], ch=[];
    if(b.n!==c.n) ch.push({k:'名称',from:b.n,to:c.n});
    if((b.main||'')!==(c.main||'')) ch.push({k:'主 API',from:b.main,to:c.main});
    var bs=pfApiSet(b), cs=pfApiSet(c), addOnly=[], delOnly=[];
    Object.keys(cs).forEach(function(u){ if(!bs[u]) addOnly.push(u); });
    Object.keys(bs).forEach(function(u){ if(!cs[u]) delOnly.push(u); });
    if(addOnly.length||delOnly.length) ch.push({k:'API 列表',add:addOnly,del:delOnly});
    if((b.sens||'')!==(c.sens||'')) ch.push({k:'敏感度',from:b.sens||'',to:c.sens||''});
    rows.push({key:b.n,type:ch.length?'chg':'same',how:how,ch:ch,add:addOnly,
      del:delOnly,base:b,now:c,bi:bi,ci:ci});
  }

  cm.forEach(function(m,ci){
    if(usedC[ci]) return;
    for(var bi=0;bi<bm.length;bi++){ if(usedB[bi]) continue; if(bm[bi].n===m.n){ pair(bi,ci,'same'); return; } }
  });
  cm.forEach(function(m,ci){
    if(usedC[ci]) return;
    for(var bi=0;bi<bm.length;bi++){
      if(usedB[bi]) continue;
      if(m.main && bm[bi].main && bm[bi].main===m.main){ pair(bi,ci,'rename'); return; }
    }
  });
  cm.forEach(function(m,ci){
    if(usedC[ci]) return;
    var cs=pfApiSet(m), best=-1, bestN=0;
    for(var bi=0;bi<bm.length;bi++){
      if(usedB[bi]) continue;
      var bs=pfApiSet(bm[bi]), hit=0;
      Object.keys(bs).forEach(function(u){ if(cs[u]) hit++; });
      var denom=Math.max(Object.keys(bs).length, Object.keys(cs).length)||1;
      if(hit/denom>0.5 && hit>bestN){ bestN=hit; best=bi; }
    }
    if(best>=0) pair(best,ci,'overlap');
  });

  cm.forEach(function(m,ci){
    if(!usedC[ci]) rows.push({key:'new:'+m.n,type:'add',how:'',ch:[],add:[],del:[],base:null,now:m,bi:-1,ci:ci});
  });
  bm.forEach(function(m,bi){
    if(!usedB[bi]) rows.push({key:m.n,type:'del',how:'',ch:[],add:[],del:[],base:m,now:null,bi:bi,ci:-1});
  });
  return rows;
}

/* 用基线模块覆盖新画像的同名模块（位置不变），并留一份原副本供撤销 */
function pfCmpAdopt(key){
  var cb=pfCurBatch(), bb=pfCmpBase();
  if(!cb||!bb) return;
  if(cb.st==='pb'){ lpTip('已发布画像只读，请先取消发布'); return; }
  var rows=pfCmpRows(cb,bb), r=null;
  rows.forEach(function(x){ if(x.key===key) r=x; });
  if(!r||!r.base) return;
  var cm=pfMods(cb);
  var bak=pfClone(r.base);
  if(r.now){
    var i=cm.indexOf(r.now);
    if(i<0) return;
    r.now.__bak=pfClone(r.now);
    r.now.__cal='base';
    cm[i]=Object.assign(r.now, {
      n:bak.n, main:bak.main, apis:bak.apis, api:bak.api, cnt:bak.cnt, usr:bak.usr,
      sens:bak.sens, __cal:'base', __bak:r.now.__bak
    });
    pfAudit(pfCurApp().n, bak.n, '采用基线模块',
      '用「'+bb.id+'」的「'+bak.n+'」覆盖当前画像同名模块');
  }else{
    /* 基线独有 → 追加进新画像 */
    bak.__cal='base';
    cm.push(bak);
    pfAudit(pfCurApp().n, bak.n, '补入基线模块',
      '把「'+bb.id+'」独有模块「'+bak.n+'」补进当前画像');
  }
  lpTip('已用基线覆盖「'+bak.n+'」，仍需点「发布」才生效');
  lpRerender();
}
/* 撤销回填：恢复覆盖前的原模块（基线独有的则移除） */
function pfCmpUndo(key){
  var cb=pfCurBatch(); if(!cb) return;
  var cm=pfMods(cb), m=null;
  cm.forEach(function(x){ if(x.n===key||(x.__bak&&x.__bak.n===key)) m=x; });
  if(!m) return;
  if(m.__bak){
    var bak=m.__bak;
    Object.assign(m, bak);
    delete m.__cal; delete m.__bak;
  }else if(m.__cal==='base'){
    var i=cm.indexOf(m); if(i>=0) cm.splice(i,1);
  }
  pfAudit(pfCurApp().n, key, '撤销基线覆盖', '恢复为本次学习原始识别结果');
  lpTip('已撤销，恢复本次学习结果');
  lpRerender();
}
function pfCmpBase(){
  var b=null;
  pfSorted(pfCurApp()).forEach(function(x){ if(x.id===PF_CMP.base) b=x; });
  return b;
}

/* ---------- 模块分析 ---------- */
function pfDistSort(k){ PF_DIST_SORT=k; lpRerender(); }
/* 用户 × 模块 调用矩阵（演示数据，按模块热度与用户活跃度确定性生成） */
function pfUserMatrix(mods){
  var users=PF_USERS.slice(0,10), mx=0, mat=[];
  users.forEach(function(u,i){
    var row=[];
    mods.forEach(function(m,j){
      var hot=m.cnt/2300;                       /* 模块热度 0~1 */
      var w=0.35+((i*7+j*13)%11)/10;            /* 用户偏好 0.35~1.35 */
      var v=Math.round(hot*90*w);
      if(m.cnt<200 && (i+j)%3===0) v=0;         /* 冷门模块部分用户为 0 */
      if(v>mx) mx=v;
      row.push(v);
    });
    mat.push({u:u,row:row,total:row.reduce(function(a,c){return a+c;},0)});
  });
  return {users:users,mat:mat,mx:mx};
}
function pfAnalysis(b){
  var mods=pfMods(b), total=0;
  mods.forEach(function(m){ total+=m.cnt; });
  var ordList=(PF_DIST_SORT==='ord')?mods:mods.slice(0).sort(function(x,y){ return y.cnt-x.cnt; });
  var bars=ordList.slice(0,8);
  var M=pfUserMatrix(mods);

  var totalUsr=b.usr||1;
  mods.forEach(function(m){ if(m.usr>totalUsr) totalUsr=m.usr; });
  var common=mods.filter(function(m){ return m.usr/totalUsr>=0.5; }).length;
  var cold=mods.filter(function(m){ return m.usr/totalUsr<0.2; }).length;
  var single=mods.filter(function(m){ return m.api===1; }).length;
  var perCap=0;
  M.mat.forEach(function(r){ perCap+=r.row.filter(function(v){ return v>0; }).length; });
  perCap=M.mat.length?(perCap/M.mat.length).toFixed(1):'0.0';
  var pct=function(n){ return mods.length?Math.round(n/mods.length*100):0; };
  var sp=pct(single);

  var h='<div class="pf-viz">';

  /* 指标卡：圆形浅底图标 + 灰标题 + 大数字（2026-11-17 按参考图再改）
     辅助口径（单 API 占比 / 覆盖用户占比）并到标题右侧，数字行保持纯数字 */
  h+='<div class="pf-kpi">'
    +pfKpi('b1','M4 4h6v6H4zM14 4h6v6h-6zM4 14h6v6H4zM14 14h6v6h-6z','模块数',
        '本批共聚合出 '+mods.length+' 个模块，其中只抓到 1 个 API 的有 '+single+' 个（占 '+sp+'%），偏多说明聚类偏碎',mods.length)
    +pfKpi('b2','M5 19v-8M12 19V5M19 19v-5','人均访问模块',
        '每位用户平均用到几个模块，本批约 '+perCap+' 个（共 '+mods.length+' 个模块）。数字越小说明用户只用得到少数功能',perCap)
    +pfKpi('b3','M4 16l5-5 3 3 7-7','常用模块',
        '被 '+(Math.round(totalUsr*0.5))+' 人及以上访问过的模块（覆盖 ≥50% 用户），属核心链路，主 API 不能选错',common)
    +pfKpi('b4','M4 8l5 5 3-3 7 7','冷门模块',
        '少于 '+(Math.round(totalUsr*0.2))+' 人访问的模块（覆盖 <20% 用户），多为岗位专用或聚类碎片，可优先复核',cold)
    +'</div>';

  /* 第一行：模块调用量（条形）+ 模块规模分布（环形） */
  h+='<div class="pf-anrow">';
  h+='<div class="pf-dbox l"><div class="dh2">模块调用量<span class="sub">条长＝调用次数</span>'
    +'<span class="sel"><select onchange="pfDistSort(this.value)">'
    +'<option value="ord"'+(PF_DIST_SORT==='ord'?' selected':'')+'>按模块顺序</option>'
    +'<option value="cnt"'+(PF_DIST_SORT==='cnt'?' selected':'')+'>按调用量</option>'
    +'</select></span></div><div class="bd">';
  var bmax=1;
  bars.forEach(function(m){ if(m.cnt>bmax) bmax=m.cnt; });
  bars.forEach(function(m){
    var cover=Math.round(m.usr/totalUsr*100);
    h+='<div class="pf-hrow2"><span class="lb" title="'+m.n+'">'+m.n+'</span>'
      +'<div class="tr"><i style="width:'+(m.cnt/bmax*100).toFixed(1)+'%"></i></div>'
      +'<span class="vv">'+m.cnt.toLocaleString()+'</span>'
      +'<span class="cv" title="覆盖用户占比">'+cover+'% 用户</span></div>';
  });
  h+='</div></div>';

  var bk=[{l:'1 个 API',v:0,c:'#D5DBE5'},{l:'2 个 API',v:0,c:'#BCD3F7'},{l:'3 个 API',v:0,c:'#7FA9F0'},
          {l:'4 个 API',v:0,c:'#5B85EC'},{l:'5 个及以上',v:0,c:'#2B5CE6'}];
  mods.forEach(function(m){ var i=m.api>=5?4:m.api-1; if(i<0)i=0; bk[i].v++; });
  h+='<div class="pf-dbox r"><div class="dh2">模块规模分布<span class="sub">按 API 数 · 点色块切换</span></div><div class="bd">';
  h+=pfDonut(bk,mods.length);
  h+='<div class="pf-hint" style="margin-top:6px">'
    +(sp>=50?'单 API 模块占 '+sp+'%，聚类偏碎，建议合并或重新学习。':'单 API 模块占 '+sp+'%，分布正常。')
    +'</div>';
  h+='</div></div>';
  h+='</div>';

  /* 第二行：覆盖度散点（覆盖用户 × 调用量）+ 常用用户 */
  h+='<div class="pf-anrow" style="margin-top:12px">';
  h+=pfScatter(mods,totalUsr);
  h+=pfRank(mods,M,perCap);
  h+='</div>';

  /* 第三行：敏感度 × 访问用户（高敏模块被谁访问） */
  h+=pfSensPanel(mods,M);

  h+='</div>';
  return h;
}

/* 敏感度 × 访问用户（2026-11-17 新增）
   管理员在模块清单里给模块标了高敏/中敏，就该能在分析里回答"这些模块被谁在用"。
   这是 TA 做高危行为关注的入口，也是发布前自查：高敏模块是不是被一大票人访问（说明标错了或该拆） */
function pfSensPanel(mods,M){
  var cnt={high:0,mid:0,low:0,none:0};
  mods.forEach(function(m){ var k=(m.sens||'none'); if(!(k in cnt)) k='none'; cnt[k]++; });

  var rows=mods.filter(function(m){ return m.sens==='high'||m.sens==='mid'; })
    .sort(function(a,b){
      var rk=function(s){ return s==='high'?0:1; };
      if(rk(a.sens)!==rk(b.sens)) return rk(a.sens)-rk(b.sens);
      return b.cnt-a.cnt;
    });

  /* 2026-11-17 沁：原来的「敏感度与访问用户」看不懂——标题改成一句人话，
     副标把"这块表在回答什么"讲清楚；用户列改成按访问次数取前 10 位 */
  var h='<div class="pf-dbox" style="margin-top:12px"><div class="dh2">敏感模块访问列表'
    +'<span class="sub">标了高敏 / 中敏的模块，分别被哪些账号访问过</span>'
    +'<span class="senscnt">'
    +'<i style="color:'+PF_SENS.high.c+';background:'+PF_SENS.high.bg+'">高敏 '+cnt.high+'</i>'
    +'<i style="color:'+PF_SENS.mid.c+';background:'+PF_SENS.mid.bg+'">中敏 '+cnt.mid+'</i>'
    +'<i style="color:'+PF_SENS.low.c+';background:'+PF_SENS.low.bg+'">低敏 '+cnt.low+'</i>'
    +'<i style="color:'+PF_SENS.none.c+';background:'+PF_SENS.none.bg+'">未设置 '+cnt.none+'</i>'
    +'</span></div><div class="bd">';

  if(!rows.length){
    /* 2026-11-17 沁：敏感度初始为空，必须先到模块清单人工标注，这里才有归纳结果 */
    h+='<div class="pf-sensempty">'
      /* 2026-11-18 沁：改成管理员视角的话术——说清「去哪儿设、设哪类业务、设完这里才有数据」 */
      +'<div class="t1">敏感度还没有标记</div>'
      +'<div class="t2">敏感度由管理员人工标记，系统不会自动识别。请到「模块清单」给薪资、人事、设备控制这类业务模块标上高敏 / 中敏，'
        +'标记后这里才会列出哪些账号在访问它们。</div>'
      +'<button class="btn-plain" onclick="pfGoMods()">去「模块清单」标记</button>'
      +'</div>';
    return h+'</div></div>';
  }

  h+='<table class="pf-senstbl"><thead><tr><th>模块</th><th style="width:78px">敏感度</th>'
    +'<th class="r" style="width:78px">访问人数</th><th class="r" style="width:82px">请求数</th>'
    +'<th style="width:44%">访问次数最多的 10 个用户</th></tr></thead><tbody>';
  rows.forEach(function(m){
    var mi=mods.indexOf(m);
    /* 用户数取 m.usr，与模块清单同口径；矩阵只用来挑"谁排前面"，不用它算总数 */
    var us=M.mat.filter(function(r){ return r.row[mi]>0; })
      .sort(function(a,b){ return b.row[mi]-a.row[mi]; });
    /* 2026-11-17 沁：主要访问用户要看前 10 个，不再只给 3 个加省略号 */
    var top=us.slice(0,10);
    /* 用户名做成小标签：一整串顿号连着排，遇到长账号会被从中间断行（daishijin / g），很难看。
       title 里必须用纯文本——把带 class="uc" 的标签塞进属性会把引号截断，页面上会漏出一个 ">" */
    /* 2026-11-17 沁：默认一行放得下就一行，放不下省略号；完整 10 个人悬停气泡里看，移开就收 */
    var chips=top.map(function(r){ return '<span class="uc">'+r.u+'</span>'; }).join('')||'—';
    var tip='<b>访问次数前 '+top.length+' 的用户</b><div class="chips">'+chips+'</div>'
      +(us.length>top.length?'<div class="more">共 '+us.length+' 人访问过，这里按次数取前 '+top.length+' 位</div>':'');
    h+='<tr><td class="mn" title="'+m.n+'">'+m.n+'</td>'
      +'<td>'+pfSensTag(m.sens)+'</td>'
      +'<td class="r num">'+m.usr+'</td>'
      +'<td class="r num">'+m.cnt.toLocaleString()+'</td>'
      +'<td class="un"><span class="uline" onmouseenter="pfTipShow(this)" onmouseleave="pfTipHide()" '
        +'data-tip-html="'+encodeURIComponent(tip)+'">'+chips+'</span></td></tr>';
  });
  h+='</tbody></table>';
  h+='<div class="pf-hint" style="margin-top:8px">只看高敏 / 中敏模块，未标敏感度的模块不在这里出现。'
    +'如果某个高敏模块几乎全员都在访问，先回头看敏感度是不是标错了，或者这个模块本来就该拆成"看"和"改"两部分。</div>';
  h+='</div></div>';
  return h;
}

/* 指标卡（2026-11-17 按参考图再改）：左侧圆形浅底图标，右侧「灰小标题 / 大数字」两行。
   参考图标题行只有一个词，所以口径（单 API 43% / ≥50% 用户）挪到数字右侧做小注，
   标题行保持干净；口径不丢，但不再和标题串成一句话 */
/* 指标卡（2026-11-17 沁：只留数值和数值名称）
   口径说明不再跟着数字走，收进标题右侧的小问号里，悬停出气泡。
   卡片上只剩「名称 + 数字」两个信息，扫一眼就是四个数，要口径再 hover。 */
function pfKpi(cls,path,t,tip,v){
  return '<div class="k">'
    +'<span class="ic '+cls+'"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" '
    +'stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="'+path+'"/></svg></span>'
    +'<div class="kh"><span class="t">'+t
    +(tip?'<i class="qi" data-tip="'+tip+'">?</i>':'')
    +'</span><span class="kb"><b class="n">'+v+'</b></span></div></div>';
}

/* 环形图：替代原来的横条分档，一屏一眼看出"碎片占多少"。
   2026-11-17：色块可点，右侧数据卡跟着切到被点的那一档（原来固定只看单 API）。
   默认仍是第 0 档（单 API），因为碎片化是最常被问的问题 */
var PF_DONUT=0;
function pfDonutPick(i){ PF_DONUT=i; lpRerender(); }
function pfArcPath(cx,cy,r1,r2,a1,a2){
  var pt=function(a,r){ return [cx+r*Math.sin(a), cy-r*Math.cos(a)]; };
  var s1=pt(a1,r2), e1=pt(a2,r2), s2=pt(a2,r1), e2=pt(a1,r1);
  var big=((a2-a1)>Math.PI)?1:0;
  return 'M'+s1[0].toFixed(2)+' '+s1[1].toFixed(2)
    +'A'+r2+' '+r2+' 0 '+big+' 1 '+e1[0].toFixed(2)+' '+e1[1].toFixed(2)
    +'L'+s2[0].toFixed(2)+' '+s2[1].toFixed(2)
    +'A'+r1+' '+r1+' 0 '+big+' 0 '+e2[0].toFixed(2)+' '+e2[1].toFixed(2)+'Z';
}
function pfDonut(items,totalN){
  var W=168,H=168,cx=84,cy=84,r2=76,r1=52;
  var sum=0; items.forEach(function(x){ sum+=x.v; });
  var sel=Math.min(Math.max(PF_DONUT|0,0),items.length-1);
  if(sel<0) sel=0;
  var s='<svg class="pf-donut" viewBox="0 0 '+W+' '+H+'">';
  if(!sum){
    s+='<circle cx="'+cx+'" cy="'+cy+'" r="'+((r1+r2)/2)+'" fill="none" stroke="#EDEFF3" stroke-width="'+(r2-r1)+'"/>';
  }else{
    /* 两趟画：先画没被选中的，再把选中的那段半径 +5 叠上去（外凸 + 白描边）。
       一开始是靠"其余段压透明度"表示选中，结果选中的浅灰段反而显得最弱，看不出选了哪块 */
    var ang=[],acc=0;
    items.forEach(function(x){ var a1=acc/sum*Math.PI*2; acc+=x.v; ang.push([a1, acc/sum*Math.PI*2]); });
    items.forEach(function(x,i){
      if(!x.v||i===sel) return;
      s+='<path class="seg" d="'+pfArcPath(cx,cy,r1,r2,ang[i][0],ang[i][1])+'" fill="'+x.c+'"'
        +' onclick="pfDonutPick('+i+')">'
        +'<title>'+x.l+'：'+x.v+' 个模块（占 '+Math.round(x.v/sum*100)+'%），点击看这一档</title></path>';
    });
    if(items[sel]&&items[sel].v){
      s+='<path class="seg on" d="'+pfArcPath(cx,cy,r1,r2+5,ang[sel][0],ang[sel][1])+'" fill="'+items[sel].c+'"'
        +' stroke="#fff" stroke-width="1.5" onclick="pfDonutPick('+sel+')">'
        +'<title>'+items[sel].l+'：'+items[sel].v+' 个模块（占 '+Math.round(items[sel].v/sum*100)+'%）</title></path>';
    }
  }
  s+='<text x="'+cx+'" y="'+(cy-2)+'" text-anchor="middle" class="dn">'+totalN+'</text>';
  s+='<text x="'+cx+'" y="'+(cy+15)+'" text-anchor="middle" class="dl">个模块</text>';
  s+='</svg>';

  var cur=items[sel]||{l:'—',v:0};
  var cp=sum?Math.round(cur.v/sum*100):0;
  var h='<div class="pf-donutwrap">'+s
    +'<div class="pf-callout"><div class="ct"><i class="cd" style="background:'+cur.c+'"></i>'+cur.l+'</div>'
    +'<div class="cl"><span>模块数</span><b>'+cur.v+' 个</b></div>'
    +'<div class="cl"><span>占比</span><b>'+cp+'%</b></div></div></div>';
  h+='<div class="pf-legend2">';
  items.forEach(function(x,i){
    h+='<span class="'+(i===sel?'on':'')+'" onclick="pfDonutPick('+i+')"><i style="background:'+x.c+'"></i>'+x.l+'<em>'+x.v+'</em></span>';
  });
  h+='</div>';
  return h;
}

/* 散点：横轴覆盖用户占比，纵轴调用次数，气泡＝API 数。
   和条形图看的是两件事：条形图看"谁被调得多"，散点看"多的是不是大家都要用"，
   四象限直接分出 全员高频 / 少数人重度 / 全员轻度 / 疑误聚 四类。
   （2026-11-17 复原：中途换成过「主 API 集中度」，沁说原来这张更好，改回来） */
/* 轴刻度的漂亮步长：1 / 2 / 5 × 10^n */
function pfNiceStep(v){
  if(!(v>0)) return 1;
  var e=Math.pow(10,Math.floor(Math.log(v)/Math.LN10)), f=v/e;
  return (f<=1?1:(f<=2?2:(f<=5?5:10)))*e;
}

function pfScatter(mods,totalUsr){
  var W=520,H=272,ml=36,mr=14,mt=22,mb=34;
  var pw=W-ml-mr, ph=H-mt-mb;
  var mx=0, maxU=1;
  mods.forEach(function(m){
    if(m.cnt>mx) mx=m.cnt;
    if(m.usr>maxU) maxU=m.usr;
  });
  /* 分母取「批次用户数」和「最大模块用户数」的较大者：
     模块用户是按模块分别去重的，同一个人可能让两个模块各记一次，
     直接除以批次用户数会算出 >100% 的覆盖率，点被夹到画布右边缘挤成一条线 */
  var base=Math.max(totalUsr||1,maxU);
  /* 刻度保持紧口径（0 / 500 / 1k），顶部靠 mt 留白 + 名字允许写到画布上沿来腾位置，
     不靠放大 yMax 硬拉空白——否则点全掉到底部，图会显得空 */
  var step=pfNiceStep((mx||10)/4), yMax=step*Math.max(1,Math.ceil((mx||10)*1.04/step));
  var fx=function(v){ return v>=1000?((v/1000)+'k'):v; };
  var px=function(v){ return ml+Math.max(0,Math.min(1,v))*pw; };
  var py=function(v){ return mt+ph-Math.max(0,Math.min(1,v/yMax))*ph; };

  var s='<svg class="pf-scat" viewBox="0 0 '+W+' '+H+'" preserveAspectRatio="xMidYMid meet">';
  for(var gv=0;gv<=yMax+1;gv+=step){
    if(gv>yMax) break;
    var gy=py(gv);
    s+='<line x1="'+ml+'" y1="'+gy.toFixed(1)+'" x2="'+(ml+pw)+'" y2="'+gy.toFixed(1)+'" stroke="#F0F2F5"/>';
    s+='<text x="'+(ml-8)+'" y="'+(gy+3.5).toFixed(1)+'" text-anchor="end" class="ax">'+fx(gv)+'</text>';
  }
  for(var g2=0;g2<=4;g2++){
    var gx=ml+pw*g2/4;
    s+='<line x1="'+gx.toFixed(1)+'" y1="'+mt+'" x2="'+gx.toFixed(1)+'" y2="'+(mt+ph)+'" stroke="#F7F8FA"/>';
  }
  s+='<text x="'+ml+'" y="'+(mt+ph+20)+'" class="ax">0</text>';
  s+='<text x="'+(ml+pw)+'" y="'+(mt+ph+20)+'" text-anchor="end" class="ax">100% 用户覆盖</text>';
  /* 四象限分割线：50% 覆盖处一条极淡虚线，把"人人用"和"少数人用"分开。
     角标文字改到图下方一行——画在角上会和右上角的气泡标签打架（第一版就叠在一起了） */
  s+='<line x1="'+px(0.5).toFixed(1)+'" y1="'+mt+'" x2="'+px(0.5).toFixed(1)+'" y2="'+(mt+ph)+'" stroke="#EDF0F4" stroke-dasharray="4 4"/>';

  var pts=mods.slice(0).sort(function(a,b){ return b.cnt-a.cnt; });
  /* 2026-11-17 沁：每个点都要带名字（原来只标"最大调用"和"最小覆盖"两个，其余点像没名字的云）。
     放法：下 → 上 → 右 → 左 → 更下 → 更上 依次试，挑第一个既不压别的气泡、
     也不压已放好的标签、又不出画布的位置；实在都放不下才退到正下方 */
  var circles=[], labs=[];
  var twOf=function(t){ var w=0; for(var i=0;i<t.length;i++){ w+=(/[\u4e00-\u9fa5]/.test(t.charAt(i))?10:5.8); } return w; };
  var over=function(a,b){ return !(a.x2<=b.x1||a.x1>=b.x2||a.y2<=b.y1||a.y1>=b.y2); };
  pts.forEach(function(m){
    var cover=base?m.usr/base:0;
    var cx=px(cover), cy=py(m.cnt);
    var r=5+Math.min(6,m.api||1)*1.7;
    var fill=cover>=0.5?'#2B5CE6':(cover>=0.2?'#7FA9F0':'#C9CFDA');
    s+='<circle cx="'+cx.toFixed(1)+'" cy="'+cy.toFixed(1)+'" r="'+r.toFixed(1)+'" fill="'+fill+'" fill-opacity="0.9">'
      +'<title>'+m.n+'：调用 '+m.cnt.toLocaleString()+' 次 · 覆盖 '+Math.round(cover*100)+'% 用户 · '+m.api+' 个 API</title></circle>';
    circles.push({x1:cx-r-2,y1:cy-r-2,x2:cx+r+2,y2:cy+r+2});
    labs.push({cx:cx,cy:cy,r:r,t:(m.n.length>10?m.n.slice(0,9)+'\u2026':m.n)});
  });
  var used=[];
  labs.forEach(function(l){
    var tw=twOf(l.t), th=10;
    /* 上下各三档 × 横向 0/±16/±32 错开：顶部三个点挨得近，
       只给"正上/正下"两个位置必然互压，多给几档才排得开 */
    var cand=[], lvs=[-(l.r+6),(l.r+13),-(l.r+19),(l.r+26),-(l.r+32),(l.r+39)];
    var dxs=[0,-16,16,-32,32];
    for(var li=0;li<lvs.length;li++){
      for(var di=0;di<dxs.length;di++) cand.push({a:'middle',x:l.cx+dxs[di],y:l.cy+lvs[li]});
    }
    cand.push({a:'start',x:l.cx+l.r+5,y:l.cy+3.5});
    cand.push({a:'end',x:l.cx-l.r-5,y:l.cy+3.5});
    /* 先试最近的位置：正上 / 正下 排最前 */
    cand.sort(function(p,q){
      var wp=Math.abs(p.x-l.cx)/10+Math.abs(p.y-l.cy)/6, wq=Math.abs(q.x-l.cx)/10+Math.abs(q.y-l.cy)/6;
      return wp-wq;
    });
    var pick=null;
    for(var i=0;i<cand.length;i++){
      var c=cand[i];
      var x1=c.a==='middle'?(c.x-tw/2):(c.a==='start'?c.x:c.x-tw);
      var box={x1:x1,x2:x1+tw,y1:c.y-th,y2:c.y+2};
      if(box.x1<ml+2||box.x2>ml+pw-2||box.y1<3||box.y2>mt+ph+4) continue;
      var bad=false;
      for(var k=0;k<circles.length;k++){ if(over(box,circles[k])){ bad=true; break; } }
      if(!bad){ for(var k2=0;k2<used.length;k2++){ if(over(box,used[k2])){ bad=true; break; } } }
      if(!bad){ pick={c:c,box:box}; break; }
    }
    if(!pick){
      var cx2=Math.min(Math.max(l.cx,ml+2+tw/2),ml+pw-2-tw/2);
      pick={c:{a:'middle',x:cx2,y:l.cy+l.r+13},box:{x1:cx2-tw/2,x2:cx2+tw/2,y1:l.cy+l.r+3,y2:l.cy+l.r+15}};
    }
    used.push(pick.box);
    s+='<text x="'+pick.c.x.toFixed(1)+'" y="'+pick.c.y.toFixed(1)+'" text-anchor="'+pick.c.a+'" class="bl">'+l.t+'</text>';
  });
  s+='</svg>';

  /* 图表类型：气泡图（bubble chart）——横轴覆盖率、纵轴调用次数、气泡面积＝API 数，
     三个变量一张图看完，比一张普通散点多一层信息。标题里点明"气泡图"，免得看着不知道是什么图 */
  var h='<div class="pf-dbox l"><div class="dh2">模块覆盖度气泡图'
    +'<span class="sub">横轴＝覆盖用户占比，纵轴＝调用次数，气泡大小＝API 数</span></div><div class="bd">'
    +s
    +'<div class="pf-legend">'
    +'<span><i style="background:#2B5CE6"></i>半数以上用户常用</span>'
    +'<span><i style="background:#7FA9F0"></i>两成到半数用户</span>'
    +'<span><i style="background:#C9CFDA"></i>不足两成，优先核是否误聚</span>'
    +'</div>'
    +'<div class="pf-hint" style="margin-top:8px">右上＝全员都在用，主 API 不能选错；左下＝少数人或疑误聚，优先核一核；气泡越大 API 越多，聚类越粗。</div>'
    +'</div></div>';
  return h;
}

function pfRank(mods,M,perCap){
  var rank=M.mat.slice(0).sort(function(x,y){ return y.total-x.total; });
  var show=Math.min(10,rank.length);   /* 2026-11-17 沁：暂时就是 Top 10，不做「查看全部」 */

function pfPad2(n){ return n<10?'0'+n:''+n; }
function pfTs(t){
  var d=new Date(t*1000);
  return d.getFullYear()+'-'+pfPad2(d.getMonth()+1)+'-'+pfPad2(d.getDate())+' '
    +pfPad2(d.getHours())+':'+pfPad2(d.getMinutes())+':'+pfPad2(d.getSeconds());
}
/* 一次学习批次 = 一批采集请求，按真实会话顺序生成 */
function pfReqData(b){
  var lr=(b.st==='lr');
  var key=(b.id||'')+'|'+(b.mod||0)+(lr?'|'+b.cnt:'');
  if(b._req && b._reqKey===key) return b._req;
  var mods=pfMods(b), apiMod={};
  mods.forEach(function(m){ (m.apis||[]).forEach(function(a){ apiMod[a.u]=m.n; }); if(m.main) apiMod[m.main]=m.n; });
  var seq=Object.keys(PF_API_META).filter(function(u){ return apiMod[u]; });
  if(!seq.length) seq=Object.keys(PF_API_META).slice(0,6);
  /* 学习中：样本条数随采集量增长（最多 60 行），时间锚定在"刚刚"，看起来是活的流 */
  var N=lr?Math.max(24,Math.min(60,Math.round((b.cnt||0)/600))):56;
  var t=lr?0:(new Date(2026,10,12,9,12,3).getTime()/1000), rows=[], sess=0, prevPk='';
  for(var k=0;k<N;k++){
    var u=seq[k%seq.length], meta=PF_API_META[u]||{pk:'/',gap:[1,5]};
    var isStart=(k%seq.length===0);
    var gap=0;
    if(k>0){
      if(isStart){ gap=600+((k*137)%2100); sess++; }
      else gap=meta.gap[0]+((k*7)%Math.max(1,meta.gap[1]-meta.gap[0]+1));
      t+=gap;
    }
    var sr='';
    if(isStart) sr=(k===0?'会话开始':PF_SR[sess%3]);
    rows.push({
      _t:t,
      user:PF_USERS[(Math.floor(k/seq.length)+k)%PF_USERS.length],
      ip:PF_IPS[(Math.floor(k/seq.length)*2+k)%PF_IPS.length],
      api:u, mod:apiMod[u]||'未归属', gap:gap,
      ref:prevPk?('https://spcconsole.example.com'+prevPk):'\u2014',
      pk:meta.pk, sr:sr, raw:PF_SR_RAW[sr]||'',
      flag:meta.flag||'', start:isStart
    });
    prevPk=meta.pk;
  }
  if(lr){
    var last=rows.length?rows[rows.length-1]._t:0;
    var shift=Date.now()/1000-25-last;
    rows.forEach(function(r){ r.ts=pfTs(r._t+shift); delete r._t; });
  }else{
    rows.forEach(function(r){ r.ts=pfTs(r._t); delete r._t; });
  }
  b._req=rows; b._reqKey=key;
  return rows;
}

function pfReqFiltered(b){
  var all=pfReqData(b), F=PF_REQ_F;
  return all.filter(function(r){
    if(F.u && r.user!==F.u) return false;
    if(F.ip && r.ip!==F.ip) return false;
    if(F.kw && r.api.toLowerCase().indexOf(F.kw.toLowerCase())<0) return false;
    if(F.s && r.ts.replace(/-/g,'/')<F.s.replace('T',' ')) return false;
    if(F.e && r.ts.replace(/-/g,'/')>F.e.replace('T',' ')+':59') return false;
    if(F.hideBg && r.flag==='bg') return false;
    if(F.hideTimed && r.flag==='timed') return false;
    if(F.hideChan && r.flag==='chan') return false;
    return true;
  });
}
function pfSpan(list){
  if(list.length<2) return '\u2014';
  var a=new Date(list[0].ts.replace(/-/g,'/')).getTime();
  var z=new Date(list[list.length-1].ts.replace(/-/g,'/')).getTime();
  var m=Math.round((z-a)/60000);
  return m<60?m+' 分钟':(m/60).toFixed(1)+' 小时';
}
/* 采集时间跨度按批次算：学习中到当前时刻，学完到结束时刻。
   不能用样例明细算——明细只是抽取的展示行，跨度会比真实学习期短一大截 */
function pfSpanB(b){
  if(!b||!b.ct) return '\u2014';
  var a=new Date(b.ct.replace(/-/g,'/')).getTime();
  var z=(b.st==='lr')?Date.now():new Date((b.et||b.ct).replace(/-/g,'/')).getTime();
  var m=Math.round((z-a)/60000);
  if(m<1) return '不足 1 分钟';
  if(m<60) return m+' 分钟';
  if(m<1440) return (m/60).toFixed(1)+' 小时';
  var d=m/1440;
  return (d<10?d.toFixed(1):Math.round(d))+' 天';
}

   明细只抽了最近若干条，用它算用户数/片段数会把量级说小 */
function pfReqStat(b, all){
  var sample=all.length||1;
  var total=b.cnt||sample;
  var k=total/sample;
  var segRaw=0; all.forEach(function(r){ if(r.start) segRaw++; });
  var seg=Math.max(1, Math.round(segRaw*(k>1?k:1)));
  var usr=b.usr||0;
  if(!usr){ var u={}; all.forEach(function(r){ u[r.user]=1; }); usr=Object.keys(u).length; }
  return { total:total, seg:seg, usr:usr, span:pfSpanB(b) };
}

  if(b.st==='pb'){ lpTip('已发布画像不允许删除，请先取消发布'); return; }
  var busy=(b.st==='lr'||b.st==='an');

    +'将同时删除该批次的采集数据（请求列表）共 '+pfNum(b.cnt)+' 条，不可恢复。', function(){
    for(var i=0;i<a.batches.length;i++) if(a.batches[i].id===batchId){ a.batches.splice(i,1); break; }
    PF_CUR.batch='';
    pfAudit(a.n,batchId,'删除批次','删除批次 '+batchId+' 及其采集数据 '+pfNum(b.cnt)+' 条');
    lpTip('已删除'); lpRerender();
  },'danger');
}

/* 删除应用：只要不存在已发布画像就能删；级联删除该应用全部批次与采集数据 */
function pfDelApp(){
  var a=pfCurApp();
  if(pfHas(a,'pb')){ lpTip('该应用存在已发布画像，需先取消发布才能删除'); return; }
  var total=0;
  a.batches.forEach(function(b){ total+=b.cnt||0; });
  /* 2026-11-18 沁：删掉「应用本身仍在数据中心纳管范围内，可随时重新发起学习」这句 */
  lpConfirm('删除应用',
    '将删除应用「'+a.n+'」及其全部 <b>'+a.batches.length+'</b> 个学习批次、<b>'+pfNum(total)+'</b> 条采集数据，不可恢复。', function(){
    var nm=a.n, n=a.batches.length;
    for(var i=0;i<PF_DATA.length;i++) if(PF_DATA[i].id===a.id){ PF_DATA.splice(i,1); break; }
    PF_CUR.app=PF_DATA[0]?PF_DATA[0].id:'';
    PF_CUR.batch=PF_DATA[0]&&PF_DATA[0].batches[0]?PF_DATA[0].batches[0].id:'';
    pfAudit(nm,'\u2014','删除应用','删除应用及其 '+n+' 个批次、'+pfNum(total)+' 条采集数据');
    lpTip('已删除应用「'+nm+'」'); lpRerender();
  },'danger');
}

/* ---------- 开启学习 ---------- */
function pfOpenLearn(preId){
  PF_SEL={};
  if(preId){ PF_SEL[preId]=7; }
  /* 2026-11-17：弹窗改右侧抽屉，和「设置」抽屉同一套版式（分区标题 + 左标签 + 底部操作条） */
  var body='<div class="pf-sect"><div class="st">选择应用<em>可跨数据中心、分组多选</em></div>'
    +'<div class="pf-sel"><div class="pf-selbox" id="pfSelBox" onclick="pfTogglePanel(event)">'
    +'<span class="ph">请选择应用（支持按数据中心、分组选择）</span><i class="arw"></i></div>'
    +'<div class="pf-panel" id="pfPanel"><div class="sbox"><input id="pfKw" placeholder="搜索应用名称或标识" oninput="pfRenderPanel()"></div>'
    +'<div class="list" id="pfList"></div></div></div>'
    +'<div id="pfPicked"></div></div>';

  body+='<div class="pf-sect"><div class="st">学习时长<em>按天设置，最少 1 天，建议 7–30 天覆盖一个完整业务周期</em></div>'
    +'<div class="frow"><label>批量设置</label><div class="ctl"><div class="pf-dayset">'
    +'<input id="pfBatch" type="number" min="1" value="7"><span class="u">天</span>'
    +'<button class="btn-plain" onclick="pfApplyBatch()">应用到已选应用</button></div>'
    +'</div></div></div>';

  var html='<div class="mask on" id="pfLearnMask" onclick="pfCloseLearn()"></div>'
    +'<div class="drawer on" id="pfLearnDrawer" style="width:476px;min-width:476px;z-index:85;background:#fff">'
    +'<div class="dh"><b>新建应用学习</b><span class="x" onclick="pfCloseLearn()" style="margin-left:auto;cursor:pointer;color:#909399">&#10005;</span></div>'
    +'<div class="db" style="background:#fff">'+body+'</div>'
    +'<div class="dft"><span id="pfCount" class="cnt">共选 0 个应用</span>'
    +'<button class="btn-plain" onclick="pfCloseLearn()">取消</button>'
    +'<button class="btn-pri" id="pfStartBtn" disabled onclick="pfStartLearn()">开始学习</button></div></div>';
  document.body.insertAdjacentHTML('beforeend', html);
  pfRenderPanel(); pfRenderPicked();
}
function pfCloseLearn(){
  var m=document.getElementById('pfLearnMask'), d=document.getElementById('pfLearnDrawer');
  if(m&&m.parentNode) m.parentNode.removeChild(m);
  if(d&&d.parentNode) d.parentNode.removeChild(d);
}
function pfTogglePanel(e){
  if(e) e.stopPropagation();
  document.getElementById('pfSelBox').classList.toggle('on');
  document.getElementById('pfPanel').classList.toggle('on');
}
/* 点下拉框以外的任何地方都要收起（2026-11-17）：
   树形下拉一展开就是几百像素高，不收起的话下面学习时长区被盖住，用户以为自己点错了 */
if(typeof document!=='undefined' && document.addEventListener){
  document.addEventListener('click',function(e){
    var p=document.getElementById('pfPanel'), b=document.getElementById('pfSelBox');
    if(!p || !p.classList.contains('on')) return;
    if(p.contains(e.target) || (b && b.contains(e.target))) return;
    p.classList.remove('on');
    if(b) b.classList.remove('on');
  });
}
function pfRenderPanel(){
  var kw=((document.getElementById('pfKw')||{}).value||'').trim();
  var h='';
  PF_DC.forEach(function(dc){
    var hit=[];
    /* 从纳管应用全集取，删除过学习记录的应用也要能重新选回来 */
    PF_ALL.forEach(function(m){
      if(m.dc!==dc.n) return;
      if(kw && m.n.toLowerCase().indexOf(kw.toLowerCase())<0 && m.id.toLowerCase().indexOf(kw.toLowerCase())<0) return;
      hit.push(m);
    });
    if(!hit.length) return;
    h+='<div class="pf-pn lv0">'+dc.n+'</div>';
    dc.grps.forEach(function(g){
      var ga=hit.filter(function(a){return a.grp===g});
      if(!ga.length) return;
      h+='<div class="pf-pn lv1">'+g+'</div>';
      ga.forEach(function(m){
        var inList=!!pfApp(m.id);
        var st=inList?pfAppSt(pfApp(m.id)):'none', dis=(st==='lr'||st==='an');
        var ck=PF_SEL[m.id]!==undefined?'checked':'';
        h+='<div class="pf-pn lv2'+(dis?' dis':'')+'" onclick="'+(dis?'lpTip(\'该应用正在学习中\')':'pfPick(\''+m.id+'\')')+'">'
          +'<input type="checkbox" '+(dis?'disabled':'')+' '+ck+' onclick="event.stopPropagation();'+(dis?'':'pfPick(\''+m.id+'\')')+'">'
          +'<span>'+m.n+'</span><span class="ft">'+(dis?'学习中':(inList?m.id:m.id+' · 未添加'))+'</span></div>';
      });
    });
  });
  document.getElementById('pfList').innerHTML=h||'<div class="pf-pn lv1" style="color:#A8ABB2">无匹配应用</div>';
}
function pfPick(id){
  if(PF_SEL[id]!==undefined) delete PF_SEL[id]; else PF_SEL[id]=7;
  pfRenderPanel(); pfRenderPicked();
}
function pfRemove(id){ delete PF_SEL[id]; pfRenderPanel(); pfRenderPicked(); }
function pfSetDays(id,v){
  var n=parseInt(v,10);
  PF_SEL[id]=isNaN(n)||n<1?1:n;
}
function pfRenderPicked(){
  var ids=Object.keys(PF_SEL), h='';
  var box=document.getElementById('pfSelBox');
  if(box){
    var chips=ids.map(function(id){
      var m=pfApp(id)||pfMeta(id);
      return '<span class="pf-chip">'+(m?m.n:id)+'<b onclick="event.stopPropagation();pfRemove(\''+id+'\')">&#10005;</b></span>';
    }).join('');
    box.innerHTML=(chips||'<span class="ph">请选择应用（支持按数据中心、分组选择）</span>')+'<i class="arw"></i>';
  }
  if(!ids.length){
    h='<div class="pf-hint" style="padding:16px 0 4px">尚未选择应用。学习时长建议 7–30 天，需覆盖一个完整业务周期。</div>';
  }else{
    h='<table class="pf-picked"><thead><tr><th>应用名称</th><th>数据中心 / 分组</th>'
      +'<th style="width:130px">学习时长</th><th style="width:60px">操作</th></tr></thead><tbody>';
    ids.forEach(function(id){
      var a=pfApp(id)||pfMeta(id);
      h+='<tr><td>'+a.n+'</td><td style="color:#909399">'+a.dc+' / '+a.grp+'</td>'
        +'<td><input type="number" min="1" value="'+PF_SEL[id]+'" oninput="pfSetDays(\''+id+'\',this.value)"> 天</td>'
        +'<td><span class="rm" onclick="pfRemove(\''+id+'\')">移除</span></td></tr>';
    });
    h+='</tbody></table>';
    var bad=ids.filter(function(id){ var d=PF_SEL[id]; return d<7||d>30; });
    if(bad.length) h+='<div class="pf-hint warn" style="margin-top:8px">'+bad.length+' 个应用的学习时长不在 7–30 天建议区间，可能影响画像完整或增大采集量。</div>';
  }
  var box2=document.getElementById('pfPicked');
  if(box2) box2.innerHTML=h;
  var cnt=document.getElementById('pfCount');
  if(cnt) cnt.textContent='共选 '+ids.length+' 个应用';
  /* 一个应用都没选时「开始学习」不可点（不可点击就置灰，而不是点了再弹提示） */
  var sb=document.getElementById('pfStartBtn');
  if(sb) sb.disabled=!ids.length;
}
function pfApplyBatch(){
  var v=parseInt((document.getElementById('pfBatch')||{}).value,10);
  if(isNaN(v)||v<1){ lpTip('学习时长至少 1 天'); return; }
  Object.keys(PF_SEL).forEach(function(id){ PF_SEL[id]=v; });
  pfRenderPicked(); lpTip('已统一设为 '+v+' 天');
}
function pfStartLearn(){
  var ids=Object.keys(PF_SEL);
  if(!ids.length){ lpTip('请先选择应用'); return; }
  var skip=[];
  ids=ids.filter(function(id){
    var a=pfApp(id);
    /* 不在列表里的应用（删除过学习记录）视为完全空闲，直接放行 */
    if(a && (pfAppSt(a)==='lr'||pfAppSt(a)==='an')){ skip.push(a.n); return false; }
    return true;
  });
  if(!ids.length){ lpTip('所选应用都在学习中，暂不可再次发起'); return; }
  ids.forEach(function(id){
    var a=pfApp(id);
    /* 删除过学习记录的应用：重新建回列表（应用本身仍在纳管范围内） */
    if(!a){
      var m=pfMeta(id);
      a={n:(m?m.n:id),id:id,dc:(m?m.dc:''),grp:(m?m.grp:''),at:(m&&m.at)||'2026-11-17',batches:[]};
      PF_DATA.push(a);
    }
    var d=PF_SEL[id], now='2026-11-16 15:40';
    a.batches.unshift({id:'PF-20261116-0'+(a.batches.length+1),days:d,cnt:186,usr:9,mod:0,
      st:'lr',pt:'',ct:now,et:now,left:d+' 天',pct:0});
    pfAudit(a.n,'\u2014','开始学习','学习时长 '+d+' 天，批次 PF-20261116-0'+(a.batches.length));
  });
  /* 2026-11-17 沁：开完学习就直接把这个应用选中、落到它的请求列表，
     不要再停在"选一个应用看画像"的缺省页——那样等于让用户再点一次才看到刚开的东西。
     同时开多个时选第一个，其余的从左列表点 */
  var first=null;
  PF_DATA.forEach(function(a){ if(!first && ids.indexOf(a.id)>=0) first=a; });
  if(first){
    PF_CUR.app=first.id;
    PF_CUR.batch=(first.batches[0]||{}).id||'';
    PF_CUR.tab=0;
  }

  PF_SEL={};
  pfCloseLearn();
  lpTip('已开启 '+ids.length+' 个应用的学习'+(skip.length?'，'+skip.length+' 个学习中已跳过':''));
  lpRerender();
}

/* ---------- 演示数据：让「新画像 vs 已发布画像」真的有差异可看 ----------
   spcconsole 的 PF-20261112-03（待发布，7 模块）对 PF-20261108-01（已发布，6 模块）：
   新增模块 / 模块改名 / 主 API 变更 / API 增减 / 模块消失，五种情形各一，
   这样对比页四态（新增 / 修改 / 消失 / 一致）都能点到。
   真实环境这些差异由两次学习的识别结果自然产生，原型里手工埋一份。 */
(function(){
  if(!PF_DEMO) return;
  var a=null, nb=null, pb=null;
  PF_DATA.forEach(function(x){ if(x.id==='spcconsole') a=x; });
  if(!a) return;
  (a.batches||[]).forEach(function(b){
    if(b.id==='PF-20261112-03') nb=b;
    if(b.id==='PF-20261108-01') pb=b;
  });
  if(!nb||!pb) return;

  pfMods(nb).forEach(function(m){
    if(m.n==='品牌定制查询') m.n='品牌配置查询';
    if(m.n==='设备卸载校验'){
      m.main='/blim-api/api/elogonconfig/v1/uninstall/device/confirm';
      m.apis.push({u:'/blim-api/api/elogonconfig/v1/uninstall/device/audit',cnt:24,usr:9});
      m.api=m.apis.length;
      m.cnt+=24;
    }
    if(m.n==='壁纸配置'){
      m.apis=m.apis.filter(function(x){ return x.u.indexOf('isallowedsetting')<0; });
      m.api=m.apis.length;
    }
  });

  var bm=pfMods(pb);
  if(!bm.some(function(m){ return m.n==='旧版权限校验'; })){
    bm.push({n:'旧版权限校验',api:1,main:'/blim-api/api/auth/v1/legacyPermit',cnt:42,usr:6,sens:'',
      apis:[{u:'/blim-api/api/auth/v1/legacyPermit',cnt:42,usr:6}]});
    pb.mod=bm.length; pb.__modsN=bm.length;   /* 两个一起改，否则下次 pfMods 会按模板重建把它冲掉 */
  }
})();
