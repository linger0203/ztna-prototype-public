<!DOCTYPE html>
<html lang="zh-CN" data-page-node-id="orahOoCgjmvo2kvU6R50hT">
<head data-page-node-id="FFk00PhBDPcxIKvf7ewCQK">
<meta charset="utf-8" data-page-node-id="lyjyu7fn6Bf4DNV2B4ZL5s">
<title>竹云零信任安全服务平台 · 管控台原型</title>
<link rel="stylesheet" href="_assets/iconfont.css" data-page-node-id="E0BWQY8k7cIPbDdCNbahJJ">
<script src="_assets/echarts.min.js"></script>
<script>if(typeof echarts==="undefined"){document.write('<script src="https://cdn.jsdelivr.net/npm/echarts@5.5.0/dist/echarts.min.js"><\/script>')}</script>
<style>
:root{
  --blue:#0095E5; --blue-dark:#007FC4; --blue-weak:rgba(0,149,229,.08);
  --t1:#303133; --t2:#606266; --t3:#909399; --t4:#C0C4CC;
  --bd:#DCDFE6; --line:#DFE4ED; --bg:#F2F3F5;
  --green:#00B42A; --red:#F54141; --orange:#FF7D00; --purple:#7D5EF7; --cyan:#14C9C9;
  --top:64px; --side:240px; --ic:#8D959F; --t1b:#2E3239;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:"Helvetica Neue",Helvetica,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",Arial,sans-serif;color:var(--t1);background:var(--bg);font-size:14px;-webkit-font-smoothing:antialiased}
button{font-family:inherit;cursor:pointer;border:none;background:none}
input{font-family:inherit}
.hide{display:none!important}

/* ============ 登录页（真素材：设计稿背景 + SVG logo） ============ */
#login{position:fixed;inset:0;background:url(_assets/login-bg.png) center center/cover no-repeat;overflow:hidden}
#login .lg{position:absolute;left:26px;top:20px;height:36px;z-index:3}
#login .lg img{height:36px;display:block}
#login .card{position:absolute;right:8.4%;top:50%;transform:translateY(-50%);width:300px;z-index:4;
  background:rgba(12,47,88,.62);border:1px solid rgba(130,185,240,.26);border-radius:8px;padding:26px 24px 22px;
  box-shadow:0 10px 34px rgba(0,0,0,.28)}
#login .card h2{color:#fff;font-size:20px;font-weight:400;text-align:center;margin-bottom:22px;letter-spacing:1px}
#login .fld{position:relative;margin-bottom:13px}
#login .fld>i{position:absolute;left:11px;top:50%;transform:translateY(-50%);color:#8FB3D4;font-size:15px}
#login .fld input{width:100%;height:38px;border-radius:3px;border:1px solid rgba(130,180,230,.3);
  background:rgba(255,255,255,.05);color:#fff;padding:0 10px 0 34px;font-size:13px;outline:none}
#login .fld input::placeholder{color:#87A9C8}
#login .fld input:focus{border-color:#3FA9F5;background:rgba(255,255,255,.09)}
#login .cap{display:flex;gap:8px}
#login .cap input{flex:1}
#login .cap .img{width:86px;height:38px;flex-shrink:0;border-radius:3px;background:#173F68;border:1px solid rgba(130,180,230,.3);
  display:flex;align-items:center;justify-content:center;gap:4px;font-size:18px;letter-spacing:0;
  font-style:italic;font-weight:600;user-select:none;cursor:pointer;font-family:Georgia,"Times New Roman",serif}
#login .cap .img b{font-weight:600;transform:skewX(-8deg)}
#login .cap .img b:nth-child(2){transform:skewX(-8deg) translateY(-1px)}
#login .cap .img b:nth-child(4){transform:skewX(-8deg) translateY(1px)}
#login .row{display:flex;align-items:center;gap:6px;margin:3px 0 15px;color:#A8C4DC;font-size:12px;cursor:pointer;user-select:none}
#login .row .box{width:12px;height:12px;border:1px solid #6D93B4;border-radius:2px;display:inline-block}
#login .row .box.on{background:#3FA9F5;border-color:#3FA9F5}
#login .btn{width:100%;height:38px;border-radius:3px;background:#0FA8F0;color:#fff;font-size:15px;letter-spacing:2px}
#login .btn:hover{background:#2FB8F5}
#login .err{color:#FF9B9B;font-size:12px;height:15px}
#login .foot{position:absolute;bottom:16px;width:100%;text-align:center;color:rgba(255,255,255,.5);font-size:12px;z-index:3}

/* ============ 角色选择（按现网形态 + 设计稿背景） ============ */
#role{position:fixed;inset:0;background:url(_assets/role-bg.png) center center/cover no-repeat;z-index:20;overflow:auto}
#role .wrap{min-height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:40px 0}
#role h1{color:#0B72E7;font-size:34px;font-weight:500;letter-spacing:3px;margin-bottom:16px}
#role .tip{color:#5B6B7D;font-size:14px;margin-bottom:36px}
#role .opt{width:268px;height:64px;margin:0 auto 16px;border-radius:32px;background:#fff;border:1px solid #DCE2EC;
  display:flex;align-items:center;gap:12px;padding:0 20px;cursor:pointer;box-shadow:0 2px 10px rgba(23,66,122,.06)}
#role .opt .av{width:34px;height:34px;border-radius:50%;background:#EAF2FE;color:#0B72E7;
  display:flex;align-items:center;justify-content:center;font-size:16px;flex-shrink:0}
#role .opt .nm{flex:1;text-align:left;font-size:15px;color:#2B3A4B}
#role .opt .rdo{width:18px;height:18px;border-radius:50%;border:1px solid #C6D0DC;position:relative;flex-shrink:0}
#role .opt.on{border-color:#0B72E7;background:#EAF2FE;box-shadow:0 3px 12px rgba(11,114,231,.14)}
#role .opt.on .av{background:#fff}
#role .opt.on .rdo{border-color:#0B72E7}
#role .opt.on .rdo:after{content:"";position:absolute;inset:3px;border-radius:50%;background:#0B72E7}
#role .acts{display:flex;gap:14px;justify-content:center;margin-top:24px}
#role .acts button{width:152px;height:42px;border-radius:3px;font-size:15px}
#role .acts .ok{background:#0B72E7;color:#fff}
#role .acts .ok:hover{background:#2A87EE}
#role .acts .no{background:#fff;color:#5B6B7D;border:1px solid #DCE2EC}
#role .acts .no:hover{color:#0B72E7;border-color:#0B72E7}


/* 顶栏右侧面板 */
.topbar .right{position:relative}
.topbar .right .grid{cursor:pointer}
.topbar .right .who{padding:4px 6px;border-radius:4px}
.topbar .right .who:hover{background:rgba(255,255,255,.12)}
.pop{position:absolute;top:calc(var(--top) - 6px);right:16px;background:#fff;border-radius:6px;
  box-shadow:0 8px 26px rgba(23,66,122,.16);border:1px solid var(--line);display:none;z-index:120}
.pop.on{display:block}
.pop-safety{width:300px;padding:12px}
.pop-safety .hero{position:relative;border-radius:6px;padding:16px 14px;overflow:hidden;
  background:linear-gradient(120deg,#EAF5FE 0%,#D6EAFB 60%,#C9E4F9 100%);min-height:74px}
.pop-safety .hero .ht{font-size:15px;color:#1B6FBF;font-weight:500;margin-bottom:4px}
.pop-safety .hero .hs{font-size:12px;color:#5A90C4}
.pop-safety .hero .himg{position:absolute;right:8px;bottom:6px;width:72px;height:52px}
.pop-safety .apps{display:flex;flex-wrap:wrap;gap:6px;padding:12px 0 2px}
.pop-safety .app{width:88px;padding:10px 6px 8px;border-radius:6px;text-align:center;cursor:pointer}
.pop-safety .app:hover{background:#F4F9FE}
.pop-safety .app .ic{width:40px;height:40px;margin:0 auto 8px;border-radius:9px;display:flex;align-items:center;justify-content:center;
  background:linear-gradient(135deg,#2AC7A6,#2196E0);color:#fff;font-size:20px}
.pop-safety .app .nm{font-size:12px;color:var(--t2);line-height:1.3;word-break:break-all}
.pop-safety .empty{font-size:12px;color:var(--t4);padding:14px 4px 6px}
.pop-user{width:250px;padding:0 0 6px}
.pop-user .uhead{display:flex;align-items:center;gap:10px;padding:14px;background:linear-gradient(120deg,#EAF5FE,#D9ECFB);
  border-radius:6px 6px 0 0}
.pop-user .uav{width:36px;height:36px;border-radius:50%;background:#fff;color:var(--blue);display:flex;align-items:center;justify-content:center;font-size:18px}
.pop-user .umeta b{display:block;font-size:14px;color:#1B6FBF;font-weight:500}
.pop-user .utag{display:inline-block;margin-top:4px;font-size:11px;color:#2C7BC0;background:rgba(0,116,200,.1);
  border-radius:2px;padding:1px 6px}
.pop-user .uact{display:flex;align-items:center;gap:9px;padding:11px 16px;font-size:13px;color:var(--t2);cursor:pointer}
.pop-user .uact:hover{background:#F5F9FD;color:var(--blue)}
.pop-user .uact .iconfont{font-size:15px}

/* 收起态：悬浮飞层 */
.flyout{position:fixed;left:54px;min-width:152px;background:#fff;border:1px solid var(--line);
  box-shadow:0 6px 20px rgba(23,66,122,.14);border-radius:4px;padding:6px 0;z-index:90;display:none}
.flyout.on{display:block}
.flyout .ft{padding:7px 16px;font-size:12px;color:var(--t4)}
.flyout .fi{padding:9px 16px;font-size:13px;color:var(--t2);cursor:pointer;white-space:nowrap}
.flyout .fi:hover{background:#F5F9FD;color:var(--blue)}
.flyout .fi.on{color:var(--blue);font-weight:500;background:var(--blue-weak)}

/* ============ 应用外壳 ============ */
#app{display:none}
.topbar{position:fixed;top:0;left:0;right:0;height:var(--top);background:var(--blue);display:flex;align-items:center;z-index:60}
.topbar .logo{display:flex;align-items:center;padding-left:20px;padding-right:24px;flex-shrink:0}
.topbar .logo img{height:28px;display:block}

.topbar nav{display:flex;height:100%;flex:1}
.topbar nav a{color:#fff;text-decoration:none;padding:0 26px;display:flex;align-items:center;font-size:15px;opacity:.9}
.topbar nav a:hover{background:rgba(255,255,255,.1);opacity:1}
.topbar nav a.on{background:rgba(255,255,255,.16);opacity:1;font-weight:500}
.topbar .right{display:flex;align-items:center;gap:18px;padding-right:22px;color:#fff;font-size:14px}
.topbar .right .grid{display:grid;grid-template-columns:repeat(3,3px);gap:3px;opacity:.9;cursor:pointer}
.topbar .right .grid i{width:3px;height:3px;background:#fff;border-radius:1px;display:block}
.topbar .right .who{display:flex;align-items:center;gap:8px;cursor:pointer}
.topbar .right .who .av{width:24px;height:24px;border-radius:50%;background:rgba(255,255,255,.9);color:var(--blue);
  display:flex;align-items:center;justify-content:center;font-size:14px}

.sidebar{position:fixed;top:var(--top);left:0;bottom:0;width:var(--side);background:#fff;border-right:1px solid var(--line);
  display:flex;flex-direction:column;z-index:50}
.sidebar .scroll{flex:1;overflow-y:auto;padding:8px 0}
.sidebar .grp>.hd{display:flex;align-items:center;gap:10px;height:48px;padding:0 25px;color:var(--t1);font-size:14px;cursor:pointer;user-select:none}
.sidebar .grp>.hd:hover{color:var(--blue)}
.sidebar .grp>.hd .ico{font-size:16px;color:var(--ic);transition:color .15s}
.sidebar .grp>.hd .arrow{margin-left:auto;font-size:12px;color:var(--t4);transition:transform .2s}
.sidebar .grp.open>.hd .arrow{transform:rotate(180deg)}
.sidebar .grp>.bd{display:none}
.sidebar .grp.open>.bd{display:block}
.sidebar .it{display:flex;align-items:center;height:48px;padding-left:50px;color:var(--t1b);font-size:14px;cursor:pointer;position:relative}
.sidebar .it:hover{color:var(--blue);background:#F7FBFE}
.sidebar .it.on{color:var(--blue);background:var(--blue-weak);font-weight:500}
.sidebar .it:hover .ico,.sidebar .it.on .ico{color:var(--blue)}
.sidebar .it.on:before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--blue)}
.sidebar .alone{display:flex;align-items:center;gap:10px;height:48px;padding:0 25px;color:var(--t1);font-size:14px;cursor:pointer}
.sidebar .alone .ico{font-size:16px;color:var(--ic);transition:color .15s}
.sidebar .alone:hover,.sidebar .alone.on{color:var(--blue)}
.sidebar .alone:hover .ico,.sidebar .alone.on .ico{color:var(--blue)}
.sidebar .grp>.hd:hover .ico{color:var(--blue)}
.dc-pick:hover .ico{color:var(--blue)}
.sidebar .alone.on{background:var(--blue-weak);font-weight:500;position:relative}
.sidebar .alone.on:before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--blue)}
.sidebar .collapse{height:44px;border-top:1px solid var(--line);display:flex;align-items:center;gap:10px;padding:0 18px;color:var(--t2);font-size:14px;cursor:pointer}
.sidebar .collapse:hover{color:var(--blue)}
.dc-pick{display:flex;align-items:center;gap:10px;height:48px;padding:0 25px;color:var(--t1);font-size:14px;cursor:pointer;border-bottom:1px solid #F0F2F5}
.dc-pick .ico{font-size:16px;color:var(--ic);transition:color .15s}
.dc-pick .nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dc-pick .arrow{margin-left:auto;font-size:12px;color:var(--t4)}
.dc-pick:hover{color:var(--blue)}
.dc-pop{position:absolute;left:8px;top:46px;width:210px;background:#fff;border:1px solid var(--line);border-radius:4px;
  box-shadow:0 6px 18px rgba(0,0,0,.12);z-index:70;padding:6px 0;display:none}
.dc-pop.on{display:block}
.dc-pop div{padding:9px 16px;font-size:13px;color:var(--t2);cursor:pointer}
.dc-pop div:hover{background:#F5F9FD;color:var(--blue)}
.dc-pop div.on{color:var(--blue);background:var(--blue-weak);font-weight:500}

#app.collapsed{--side:54px}
#app.collapsed .sidebar .bd{display:none!important}
#app.collapsed .sidebar .lb,#app.collapsed .sidebar .grp>.hd span,#app.collapsed .sidebar .dc-pick .nm,
#app.collapsed .sidebar .grp>.hd .arrow,#app.collapsed .sidebar .dc-pick .arrow,#app.collapsed .sidebar .collapse span{display:none}
#app.collapsed .sidebar .it{display:none}
#app.collapsed .sidebar .alone,#app.collapsed .sidebar .grp>.hd,#app.collapsed .sidebar .dc-pick,#app.collapsed .sidebar .collapse{justify-content:center;padding:0}
#app.collapsed .sidebar .collapse .iconfont{transform:rotate(180deg)}
.main{margin-left:var(--side);padding-top:var(--top);min-height:100vh;display:flex;flex-direction:column}
.tabbar{height:42px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:2px;padding:0 12px;overflow-x:auto;flex-shrink:0}
.tabbar .tab{display:flex;align-items:center;gap:8px;height:30px;padding:0 12px;border-radius:3px;font-size:13px;color:var(--t2);cursor:pointer;white-space:nowrap}
.tabbar .tab:hover{background:#F5F7FA}
.tabbar .tab.on{background:var(--blue-weak);color:var(--blue);font-weight:500}
.tabbar .tab .x{font-size:12px;color:var(--t4);width:14px;height:14px;line-height:14px;text-align:center;border-radius:2px}
.tabbar .tab .x:hover{background:#DCE6EE;color:var(--t1)}
.page{flex:1;padding:16px;background:var(--bg)}
.crumb{font-size:13px;color:var(--t3);margin-bottom:12px}
.crumb b{color:var(--t1);font-weight:400}

/* KPI 卡 */
.kpis{display:grid;grid-template-columns:repeat(6,1fr);gap:12px;margin-bottom:12px}
.kpi{background:#fff;border-radius:3px;padding:14px 16px;position:relative}
.kpi .hd{display:flex;align-items:center;gap:8px;margin-bottom:10px}
.kpi .hd .ib{width:26px;height:26px;border-radius:4px;display:flex;align-items:center;justify-content:center;font-size:15px}
.kpi .hd span{font-size:14px;color:var(--t1)}
.kpi .val{font-size:26px;color:var(--t1);font-weight:500;line-height:1.1}
.kpi .val small{font-size:13px;color:var(--t3);font-weight:400;margin-left:6px}
.kpi .sub{margin-top:6px;font-size:12px;color:var(--t3)}
.kpi .sub i{font-style:normal;margin-left:4px}
.up{color:var(--red)}.down{color:var(--green)}

.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:12px}
.grid3{display:grid;grid-template-columns:1fr 1.05fr;gap:12px;margin-bottom:12px;align-items:start}
.panel{background:#fff;border-radius:3px;padding:0 0 8px}
.panel .ph{display:flex;align-items:center;padding:14px 16px 10px}
.panel .ph h4{font-size:14px;font-weight:500;color:var(--t1);flex:1}
.seg{display:flex;font-size:13px;color:var(--t3)}
.seg span{padding:0 10px;cursor:pointer}
.seg span.on{color:var(--blue)}
.chart{width:100%}

/* 表格 */
.tbl-wrap{background:#fff;border-radius:3px}
.tbl{width:100%;border-collapse:collapse;font-size:13px}
.tbl th{background:#F2F3F5;color:var(--t1b);font-weight:700;text-align:left;padding:12px 10px;border-bottom:1px solid #EBEEF5;white-space:nowrap;font-size:14px}
.tbl td{padding:12px 10px;border-bottom:1px solid #EBEEF5;color:var(--t1b);white-space:nowrap;font-size:14px}
.tbl tr:hover td{background:#FAFCFE}
.tag{display:inline-block;padding:1px 7px;border-radius:2px;font-size:12px;line-height:18px}
.tag.red{background:#FEECEC;color:var(--red);border:1px solid #FBCCCC}
.tag.orange{background:#FFF4E8;color:var(--orange);border:1px solid #FFDEBA}
.tag.blue{background:#EAF5FD;color:var(--blue);border:1px solid #C7E6F8}

/* 通用按钮/开关 */
.btn-pri{height:32px;padding:0 14px;background:#0095E5;color:#fff;border-radius:3px;font-size:13px;display:inline-flex;align-items:center;gap:5px}
.btn-pri:hover{background:#2FA9EC}
.btn-plain{height:32px;padding:0 14px;background:#fff;color:#606266;border:1px solid #DCDFE6;border-radius:3px;font-size:13px}
.btn-plain:hover{color:#0095E5;border-color:#0095E5}
.sw{display:inline-block;width:34px;height:18px;border-radius:9px;background:#DCDFE6;position:relative;cursor:pointer;vertical-align:middle;transition:background .2s}
.sw i{position:absolute;left:2px;top:2px;width:14px;height:14px;border-radius:50%;background:#fff;transition:left .2s}
.sw.on{background:#00B42A}
.sw.on i{left:18px}

/* ============ 数据卡（首页 KPI / 数据中心 / API监视 共用，按设计稿形态） ============ */
.stats{display:grid;gap:12px;margin-bottom:12px}
.stats.c6{grid-template-columns:repeat(6,1fr)}
.stats.c5{grid-template-columns:repeat(5,1fr)}
.stats.c4{grid-template-columns:repeat(4,1fr)}
.stats.cdc{grid-template-columns:.9fr repeat(5,1fr)}
.stats.capi{grid-template-columns:.9fr repeat(4,1fr)}
.stat{background:#fff;border-radius:3px;padding:13px 16px 11px;min-width:0;display:flex;flex-direction:column}
.stat .hd{display:flex;align-items:center;gap:8px;margin-bottom:9px;height:26px;flex-shrink:0}
.stat .ib{width:26px;height:26px;border-radius:4px;display:flex;align-items:center;justify-content:center;font-size:15px;flex-shrink:0}
.stat .hd .tt{font-size:13px;color:var(--t1b);flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.stat .hd .v{font-size:25px;font-weight:500;color:var(--t1b);line-height:1;letter-spacing:-.3px;flex-shrink:0}
.stat .hd .v.red{color:var(--red)}
.stat .r{display:flex;align-items:center;justify-content:space-between;gap:6px;font-size:12px;color:var(--t3);height:22px;line-height:22px;white-space:nowrap;flex-shrink:0}
.stat .r.big{height:30px}
.stat .r .bv{font-size:25px;font-weight:500;color:var(--t1b);line-height:1;letter-spacing:-.3px}
.stat .r b{font-weight:400;color:var(--t1b);font-size:13px}
.stat .r .up{color:var(--red)}
.stat .r .down{color:var(--green)}

/* 面板头 + 下划线页签 */
.ph.bb{border-bottom:1px solid #EBEEF5;padding-bottom:12px;margin-bottom:10px}
.ph2{display:flex;align-items:center;padding:0 16px;border-bottom:1px solid #EBEEF5;margin-bottom:10px}
.ph2 .tabs2{display:flex;gap:24px;flex:1;min-width:0}
.ph2 .tabs2 span{position:relative;padding:13px 0;font-size:14px;color:var(--t1b);cursor:pointer;white-space:nowrap}
.ph2 .tabs2 span.on{color:var(--blue);font-weight:500}
.ph2 .tabs2 span.on:after{content:"";position:absolute;left:0;right:0;bottom:-1px;height:2px;background:var(--blue)}
.ph2 .seg{padding-bottom:0}
.pills{display:flex;gap:8px;padding:0 16px 10px;flex-wrap:wrap}
.pills span{padding:3px 13px;border-radius:2px;background:#F2F3F5;color:var(--t2);font-size:12px;cursor:pointer;line-height:20px}
.pills span:hover{color:var(--blue)}
.pills span.on{background:var(--blue);color:#fff}
.lgd{display:flex;gap:18px;padding:0 16px 6px;font-size:12px;color:var(--t2);flex-wrap:wrap}
.lgd span{display:inline-flex;align-items:center}
.lgd i{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:5px;border:2px solid;background:#fff}

/* 面板内实时小卡 */
.lrow{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;padding:0 16px 12px}
.lv{border:1px solid #EBEEF5;border-radius:3px;padding:9px 12px;display:flex;align-items:center;gap:8px;min-width:0}
.lv .ib{width:30px;height:30px;border-radius:4px;display:flex;align-items:center;justify-content:center;font-size:16px;flex-shrink:0}
.lv .tx{flex:1;min-width:0;line-height:1.3}

/* 左列两卡 + 右列一整卡（告警/API 明细） */
.cols2{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:12px;align-items:stretch}
.cols2>.cstack{display:flex;flex-direction:column;gap:12px;min-width:0}
.cols2>.cstack>.panel{flex:1;min-height:0;display:flex;flex-direction:column}
.cols2>.panel{display:flex;flex-direction:column;min-width:0;min-height:0}
.cols2 .chart{flex:1}
.cols2 .fillrow{flex:1;min-height:0}

/* 分页 */
.pager{display:flex;align-items:center;justify-content:flex-end;gap:12px;padding:10px 16px 12px;
  font-size:12px;color:var(--t3);flex-shrink:0}
.pager .pg{display:flex;gap:4px}
.pager .pg span{min-width:24px;height:24px;padding:0 6px;border-radius:3px;border:1px solid #DCDFE6;
  display:flex;align-items:center;justify-content:center;cursor:pointer;color:var(--t2);line-height:1}
.pager .pg span.on{background:var(--blue);border-color:var(--blue);color:#fff}
.pager .pg span:hover{border-color:var(--blue);color:var(--blue)}

/* 等高行：同一行两张卡底部对齐，图自适应拉伸 */
.grid2.eq>.panel,.grid3.eq>.panel{display:flex;flex-direction:column}
.grid2.eq>.panel>.chart,.grid3.eq>.panel>.chart{flex:1}
.grid3{align-items:stretch}

/* 趋势图 + TOP10 同卡分栏 */
.dcsplit{display:flex;padding-bottom:8px}
.dcsplit .dcside{width:33%;flex-shrink:0;border-left:1px solid #EBEEF5}
.dcsplit .dcside .sh{text-align:center;font-size:13px;color:var(--t1b);padding:6px 0 6px}
.dcsplit .dcside .sh2{display:flex;border-bottom:1px solid #EBEEF5;margin-bottom:2px}
.dcsplit .dcside .sh2 span{flex:1;text-align:center;font-size:12px;color:var(--t3);padding:9px 2px;cursor:pointer;position:relative;white-space:nowrap}
.dcsplit .dcside .sh2 span.on{color:var(--blue);font-weight:500}
.dcsplit .dcside .sh2 span.on:after{content:"";position:absolute;left:14%;right:14%;bottom:-1px;height:2px;background:var(--blue)}

/* 布局辅助 */
.grid21{display:grid;grid-template-columns:2fr 1fr;gap:12px;margin-bottom:12px;align-items:start}
.grid2b{display:grid;grid-template-columns:1.15fr 1fr;gap:12px;margin-bottom:12px;align-items:start}
.grid2b.eq>.panel{display:flex;flex-direction:column}
.grid2b.eq>.panel>.chart{flex:1}
.grid3c{display:grid;grid-template-columns:1.45fr 1fr 1fr;gap:12px;margin-bottom:12px;align-items:stretch}
.grid3c.eq>.panel,.grid2c.eq>.panel{display:flex;flex-direction:column}
.grid3c.eq>.panel .fillrow,.grid2c.eq>.panel .fillrow{flex:1;min-height:0}
.grid2c{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:12px;align-items:stretch}

/* 数据中心切换器（与数据卡同结构：标题行 + 数值行） */
.dcsw{background:#fff;border-radius:3px;padding:13px 14px 11px;min-width:0;display:flex;flex-direction:column;align-items:stretch}
.dcsw .hd{display:flex;align-items:center;gap:8px;margin-bottom:9px;height:26px;flex-shrink:0;width:100%}
.dcsw .ib{width:26px;height:26px;border-radius:4px;background:#EAF6FE;color:#0CA2F2;display:flex;align-items:center;justify-content:center;font-size:15px;flex-shrink:0}
.dcsw .tt{font-size:13px;color:var(--t1b);white-space:nowrap}
.dcsw .r{display:flex;align-items:center;justify-content:space-between;gap:4px;height:22px;width:100%;font-size:12px;color:var(--t3);flex-shrink:0;white-space:nowrap}
.dcsw .r.swrow{height:30px}
.dcsw .r b{font-weight:400;color:var(--t1b)}
.dcsw .nm{flex:1;min-width:0;color:var(--blue);font-size:12px;font-weight:500;text-align:center;overflow:hidden;text-overflow:ellipsis}
.dcsw .ar{width:18px;height:18px;flex-shrink:0;border-radius:50%;background:#EAF5FD;color:var(--blue);display:flex;align-items:center;justify-content:center;font-size:9px;cursor:pointer}
.dcsw .ar:hover{background:#D6ECFB}

/* 表内小字/奖牌 */
.tbl.sm th,.tbl.sm td{padding:9px 4px;font-size:12px}
.tblapi th,.tblapi td{padding:7px 10px}
.tblapi th:first-child,.tblapi td:first-child{padding-left:16px}
.tblapi th:last-child,.tblapi td:last-child{padding-right:16px}
.sortic{color:#C0C4CC;font-size:10px;margin-left:3px;vertical-align:1px}
.aw{font-style:normal;font-size:11px}
.aw.up{color:#F54141}
.aw.down{color:#00B42A}
.tbl.sm th{font-size:12px}
.tbl.cen th,.tbl.cen td{text-align:center}
.mdl{width:17px;height:17px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;
  font-size:10px;color:#fff;background:#C8CDD4;line-height:1;font-weight:400}
.mdl.g{background:#F7B500}.mdl.s{background:#A9B4C0}.mdl.b{background:#CE8A56}

/* 信息提示（圆 i） */
.inf{display:inline-flex;align-items:center;justify-content:center;width:13px;height:13px;border-radius:50%;
  border:1px solid #C0C4CC;color:#C0C4CC;font-size:9px;font-style:normal;margin-left:6px;cursor:default;
  vertical-align:1px;font-family:Arial;line-height:1}

/* 环形图 HTML 图例 */
.dgl{display:flex;flex-direction:column;gap:11px;font-size:12px;color:var(--t2);justify-content:center;min-width:0}
.dgl span{display:flex;align-items:center;gap:6px;white-space:nowrap;line-height:1}
.dgl i{width:8px;height:8px;border-radius:2px;flex-shrink:0}
.dgl b{font-weight:400;color:var(--t1b);margin-left:auto;padding-left:10px}

/* 敏感数据词云 */
.cloud{position:relative;height:198px}
.cloud b{position:absolute;border-radius:50%;display:flex;align-items:center;justify-content:center;
  color:#fff;font-weight:400;letter-spacing:.5px;transform:translate(-50%,-50%)}

/* 占位 */
.placeholder{background:#fff;border-radius:3px;padding:70px 20px;text-align:center;color:var(--t3)}
.placeholder .big{font-size:15px;color:var(--t2);margin-bottom:8px}
.placeholder .route{font-size:12px;color:var(--t4);font-family:Consolas,monospace}























































































































/*<<LISTS_CSS_BEGIN>>*/
/* ================= 列表页通用（第 2 批：终端/网络/资源/安全/审计/系统） ================= */
.lp-card{background:#fff;border-radius:3px;display:flex;min-height:calc(100vh - 64px - 42px - 32px)}
.lp-card>.tree{width:220px;flex-shrink:0;border-right:1px solid var(--line);padding:14px 0}
.lp-body{flex:1;min-width:0;padding:14px 16px 0;display:flex;flex-direction:column}
.lp-ct{display:flex;align-items:center;padding:2px 0 14px;border-bottom:1px solid #F0F2F5;margin-bottom:14px}
.lp-ct h4{font-size:15px;font-weight:500;color:var(--t1);flex:1}
.lp-ct h4:before{content:"";display:inline-block;width:3px;height:14px;background:var(--blue);border-radius:2px;margin-right:8px;vertical-align:-2px}

/* 树 */
.tree .th{display:flex;align-items:center;padding:0 14px 12px;font-size:13px;color:var(--t1)}
.tree .th .tool{margin-left:auto;display:flex;gap:8px;color:var(--t3);font-size:13px;cursor:pointer}
.tree .th .tool i:hover{color:var(--blue)}
.tree .tn{display:flex;align-items:center;height:34px;padding:0 14px 0 14px;font-size:13px;color:var(--t2);cursor:pointer}
.tree .tn .tx{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tree .tn.lv1{padding-left:28px}
.tree .tn:hover{background:#F5F9FD;color:var(--blue)}
.tree .tn.on{background:#EAF5FD;color:var(--blue);font-weight:500}
.tree .tn .ar{width:16px;height:16px;margin-right:2px;flex-shrink:0;position:relative}
.tree .tn .ar:before{content:"";position:absolute;left:3px;top:7px;width:0;height:0;
  border:4px solid transparent;border-left-color:#C0C4CC;transform-origin:3px 4px;transition:transform .15s}
.tree .tn .ar.open:before{transform:rotate(90deg)}
.tree .tn .ar.none:before{display:none}
.tree .tn.lv2{padding-left:40px}
.tree .tn.lv3{padding-left:56px}
.tree .tn .hide-empty{display:none}

/* 筛选 */
.filters{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:12px}
.fsel,.fin{height:32px;border:1px solid var(--bd);border-radius:3px;font-size:13px;color:var(--t2);background:#fff;padding:0 10px;outline:none}
.fsel{min-width:150px;cursor:pointer}
.fin{width:200px}
.fin::placeholder{color:#B4B9C0}
.fsel:focus,.fin:focus{border-color:var(--blue)}
.fdate{display:flex;align-items:center;gap:6px;color:var(--t3);font-size:13px}
.fdate .fin{width:176px}
.fmore{display:flex;align-items:center;gap:4px;color:var(--blue);font-size:13px;cursor:pointer}
.fbtns{margin-left:auto;display:flex;gap:10px}
.fbtns .btn-plain,.fbtns .btn-pri{height:32px}

/* 工具条 */
.toolbar{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.toolbar .btn-plain,.toolbar .btn-pri{height:32px}
.tsearch{margin-left:auto;position:relative;display:flex;align-items:center}
.tsearch i{position:absolute;left:9px;color:var(--t4);font-size:13px}
.tsearch .fin{padding-left:28px;width:240px}

/* 表格 */
.lp-tbl-wrap{flex:1;min-height:0;overflow-x:auto}
.lp-tbl{width:100%;border-collapse:collapse;font-size:13px}
.lp-tbl th{background:#F2F3F5;color:var(--t1b);font-weight:700;font-size:13px;text-align:left;padding:11px 12px;border-bottom:1px solid #EBEEF5;white-space:nowrap}
.lp-tbl td{padding:11px 12px;border-bottom:1px solid #EBEEF5;color:var(--t1b);font-size:13px;white-space:nowrap}
.lp-tbl tbody tr:hover td{background:#FAFCFE}
.lp-tbl .c-chk{width:40px;padding-left:16px}
.lp-tbl .c-op{text-align:right;padding-right:16px}
.lp-tbl .c-op .op{color:var(--blue);margin-left:14px;font-size:13px;text-decoration:none;cursor:pointer}
.lp-tbl .c-op .op:hover{color:#2FA9EC;text-decoration:underline}
.lp-tbl .ell{display:inline-block;max-width:190px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;vertical-align:middle}
.lp-tbl input[type=checkbox]{width:14px;height:14px;accent-color:#0095E5;cursor:pointer;vertical-align:-2px}
.lp-empty{padding:70px 0;text-align:center;color:var(--t3);font-size:13px}
.lp-empty .big{font-size:14px;color:var(--t2);margin-bottom:6px}

/* 状态 */
.dot{display:inline-flex;align-items:center;gap:6px;font-size:13px}
.dot:before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor;flex-shrink:0}
.dot.g{color:var(--green)}.dot.r{color:var(--red)}.dot.o{color:var(--orange)}
.dot.b{color:var(--blue)}.dot.gy{color:var(--t3)}.dot.p{color:var(--purple)}
.tag.g{background:#E8F8EB;color:#00B42A;border:1px solid #BFEBC8}
.tag.gy{background:#F2F3F5;color:#909399;border:1px solid #E1E4E8}
.tag.p{background:#F1EEFE;color:#7D5EF7;border:1px solid #DCD3FA}

/* 分页 */
.pager2{display:flex;align-items:center;justify-content:flex-end;gap:10px;padding:14px 0 16px;font-size:13px;color:var(--t2);margin-top:auto}
.pager2 .pg{display:flex;gap:6px;align-items:center}
.pager2 .pg span{min-width:28px;height:28px;line-height:26px;text-align:center;border:1px solid var(--bd);border-radius:3px;cursor:pointer;padding:0 7px;background:#fff;color:var(--t2)}
.pager2 .pg span:hover{border-color:var(--blue);color:var(--blue)}
.pager2 .pg span.on{background:var(--blue);border-color:var(--blue);color:#fff}
.pager2 .pg span.on:hover{color:#fff}
.pager2 .pg span.dis{color:var(--t4);cursor:default;border-color:#EBEEF5}
.pager2 .pg span.dis:hover{border-color:#EBEEF5;color:var(--t4)}
.pager2 select{height:28px;border:1px solid var(--bd);border-radius:3px;font-size:13px;color:var(--t2);background:#fff;outline:none}
.pager2 .jump{display:flex;align-items:center;gap:6px}
.pager2 .jump input{width:44px;height:28px;border:1px solid var(--bd);border-radius:3px;text-align:center;font-size:13px;color:var(--t2);outline:none}

/* 抽屉 */
.mask{position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:80;display:none}
.mask.on{display:block}
.drawer{position:fixed;top:0;right:0;bottom:0;width:60%;min-width:720px;max-width:1080px;background:var(--bg);z-index:81;
  transform:translateX(100%);transition:transform .22s ease;display:flex;flex-direction:column;box-shadow:-6px 0 24px rgba(0,0,0,.12)}
.drawer.on{transform:none}
.drawer .dh{display:flex;align-items:center;gap:10px;padding:0 20px;height:56px;background:#fff;border-bottom:1px solid var(--line);flex-shrink:0}
.drawer .dh b{font-size:16px;font-weight:500;color:var(--t1)}
.drawer .dh .x{margin-left:auto;cursor:pointer;color:var(--t3);font-size:16px;width:28px;height:28px;display:flex;align-items:center;justify-content:center;border-radius:3px}
.drawer .dh .x:hover{background:#F2F3F5;color:var(--t1)}
.drawer .db{flex:1;overflow:auto;padding:14px 16px 24px}
.dpanel{background:#fff;border-radius:3px;margin-bottom:12px;padding:14px 16px}
.dpanel>.dt{font-size:14px;color:var(--t1);font-weight:500;margin-bottom:12px}
.dkv{display:grid;grid-template-columns:repeat(3,1fr);gap:12px 18px}
.dkv>div{display:flex;font-size:13px;line-height:20px}
.dkv>div>b{color:var(--t3);font-weight:400;width:76px;flex-shrink:0}
.dkv>div>span{color:var(--t1b);word-break:break-all}
.dtabs{display:flex;gap:20px;border-bottom:1px solid #EBEEF5;margin-bottom:2px}
.dtabs span{padding:10px 0;font-size:13px;color:var(--t2);cursor:pointer;position:relative}
.dtabs span.on{color:var(--blue);font-weight:500}
.dtabs span.on:after{content:"";position:absolute;left:0;right:0;bottom:-1px;height:2px;background:var(--blue)}

/* 弹窗 */
.modal{position:fixed;left:50%;top:15%;transform:translateX(-50%);width:540px;background:#fff;border-radius:4px;z-index:82;
  display:none;box-shadow:0 10px 34px rgba(0,0,0,.18);max-height:74vh;flex-direction:column}
.modal.on{display:flex}
.modal .mh{padding:0 24px;height:56px;display:flex;align-items:center;border-bottom:1px solid var(--line);font-size:16px;font-weight:600;color:var(--t1);flex-shrink:0}
.modal .mh .x{margin-left:auto;cursor:pointer;color:var(--t3)}
.modal .mb{padding:20px 24px 4px;overflow:auto}
.modal .mf{padding:14px 24px 20px;display:flex;justify-content:flex-end;gap:12px}
/* 模态层：规范定义 #000000 / 40%，确认框和表单弹窗共用 */
.mmask{position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:81;display:none}
.mmask.on{display:block}
/* 确认型弹框（规范 4.2.3）：宽 496px 固定、高度自适应 120–600、
   无分割线无关闭按钮，「图标+标题」一行 + 说明 + 右下角按钮 */
.modal.cf{width:496px;min-height:120px;max-height:600px;top:22%;border-radius:4px;
  padding:26px 32px 22px;box-sizing:border-box;display:none;flex-direction:column;overflow:auto}
.modal.cf.on{display:flex}
.modal.cf .cfh{display:flex;align-items:center;gap:10px;font-size:16px;line-height:22px;color:#1D2129}
.modal.cf .cfh b{font-weight:600}
.modal.cf .cfi{flex-shrink:0;width:20px;height:20px;border-radius:50%;background:#0E9CF6;color:#fff;
  font-size:13px;line-height:20px;text-align:center;font-weight:700;font-style:normal}
.modal.cf.warn .cfi{background:#FF7D00}
.modal.cf.danger .cfi{background:#F5483B}
.modal.cf.success .cfi{background:#00B42A}
.modal.cf .cfb{font-size:14px;line-height:24px;color:#5A6474;margin-top:14px}
.modal.cf .cfb b{color:#1D2129;font-weight:600}
.modal.cf .cff{display:flex;justify-content:flex-end;gap:12px;margin-top:26px}
.modal.cf .cff .btn-plain,.modal.cf .cff .btn-pri{min-width:76px;height:32px;font-size:14px;border-radius:4px}
.btn-pri.danger{background:#F5483B;border-color:#F5483B}
.btn-pri.danger:hover{background:#E03E32;border-color:#E03E32}
.frow{display:flex;align-items:flex-start;margin-bottom:14px;font-size:13px}
.frow>label{width:92px;color:var(--t2);text-align:right;padding:8px 12px 0 0;flex-shrink:0}
.frow>label em{color:var(--red);font-style:normal;margin-right:2px}
.frow .ctl{flex:1;min-width:0}
.frow .ctl input,.frow .ctl select,.frow .ctl textarea{width:100%;height:32px;border:1px solid var(--bd);border-radius:3px;padding:0 10px;font-size:13px;color:var(--t1);outline:none}
.frow .ctl textarea{height:70px;padding:8px 10px;resize:vertical}
.frow .ctl input:focus,.frow .ctl select:focus,.frow .ctl textarea:focus{border-color:var(--blue)}
.frow .hint{font-size:12px;color:var(--t3);margin-top:6px}
.frow .chks{display:flex;flex-wrap:wrap;gap:10px 18px;padding-top:7px}
.frow .chks label{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--t2);cursor:pointer}

/* 轻提示 */
.toast{position:fixed;left:50%;top:74px;transform:translateX(-50%) translateY(-14px);background:rgba(48,49,51,.92);color:#fff;
  font-size:13px;padding:9px 18px;border-radius:3px;z-index:90;opacity:0;transition:all .2s;pointer-events:none}

/* 树底部数据来源说明 */
.tree .tree-src{font-size:11px;color:#A8ABB2;line-height:17px;padding:12px 14px 0;margin-top:8px;border-top:1px dashed #EBEEF5}

.sdp-apps{display:flex;gap:28px;justify-content:center}
.sdp-app{text-align:center}
.sdp-app b{display:block;font-size:20px;font-weight:400;color:#303133;line-height:26px}
.sdp-app span{font-size:12px;color:#A8ABB2}
.sdp-tbl .c-op .op{color:var(--blue);margin:0 7px;font-size:13px;cursor:pointer}
.sdp-tbl .c-op{white-space:nowrap}
.sdp-tbl thead th{white-space:nowrap}
.sdp-app span{white-space:nowrap}

/* ===== 客户端版本 / 下载 / 升级 ===== */
.cd-title{font-size:15px;color:#303133;margin:2px 0 14px;font-weight:400}
.cd-card{background:#F7F8FA;border-radius:4px;padding:16px 18px 18px;margin-bottom:14px}
.cd-ct{display:flex;align-items:center;margin-bottom:14px}
.cd-ct h4{font-size:14px;color:#303133;font-weight:400;flex:1}
.cd-ct .op{color:var(--blue);font-size:13px;cursor:pointer}
.cd-kv{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px;background:#fff;border-radius:3px;padding:14px 16px;font-size:13px}
.cd-kv>div{display:flex;gap:8px;min-width:0}
.cd-kv b{color:#A8ABB2;font-weight:400;flex-shrink:0}
.cd-kv span{color:#303133;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cd-link{background:#fff;border-radius:3px;padding:12px 16px;margin-top:10px;font-size:13px}
.cd-link .row{display:flex;gap:8px;line-height:22px}
.cd-link b{color:#A8ABB2;font-weight:400;width:56px;flex-shrink:0}
.cd-link a{color:var(--blue);cursor:pointer;word-break:break-all}
.cd-prog{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.cd-sub{background:#fff;border-radius:3px;padding:12px 14px 6px;min-width:0}
.cd-sub-t{font-size:13px;color:#606266;text-align:center;margin-bottom:4px}
.cd-radio-row{display:flex;align-items:center;gap:28px;margin-bottom:16px;font-size:13px;color:#303133;flex-wrap:wrap}
.cd-rl{color:#606266;flex-shrink:0}
.cd-rd{display:inline-flex;align-items:center;gap:7px;cursor:pointer;color:#303133}
.cd-rd>i{width:14px;height:14px;border:1px solid #DCDFE6;border-radius:50%;position:relative;background:#fff;flex-shrink:0}
.cd-rd.on>i{border-color:var(--blue)}
.cd-rd.on>i:after{content:"";position:absolute;left:3px;top:3px;width:6px;height:6px;border-radius:50%;background:var(--blue)}

/* ===== 虚拟网络：IP 统计条 ===== */
.stat-strip{display:flex;gap:34px;align-items:center;padding:2px 2px 14px}
.stat-strip .ss{display:flex;align-items:baseline;gap:8px}
.stat-strip .ss b{font-size:22px;font-weight:400;color:#303133;line-height:26px}
.stat-strip .ss b.s-blue{color:var(--blue)}
.stat-strip .ss span{font-size:12px;color:#A8ABB2}

/* ===== 表单型页面通用（系统参数 / 页面定制 / 页面安全 / 产品许可） ===== */
.fm-card{border:1px solid #EBEEF5;border-radius:4px;margin-bottom:14px;background:#fff}
.fm-hd{display:flex;align-items:center;height:44px;padding:0 16px;border-bottom:1px solid #F0F2F5;font-size:14px;color:#303133}
.fm-hd .r{margin-left:auto;display:flex;align-items:center;gap:14px;font-size:13px;color:#909399}
.fm-hd .r .op{color:var(--blue);cursor:pointer}
.fm-bd{padding:16px 16px 2px}
.fm-row{display:flex;align-items:flex-start;margin-bottom:15px;font-size:13px}
.fm-row>label{width:104px;flex-shrink:0;color:#606266;text-align:right;padding:8px 12px 0 0;line-height:16px}
.fm-row>label em{color:var(--red);font-style:normal;margin-right:2px}
.fm-row .fc{flex:1;min-width:0;display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding-top:1px}
.fm-row .fc input[type=text],.fm-row .fc input:not([type]),.fm-row .fc select{
  height:32px;border:1px solid var(--bd);border-radius:3px;padding:0 10px;font-size:13px;color:#303133;outline:none;
  background:#fff;width:320px;max-width:100%}
.fm-row .fc select{cursor:pointer}
.fm-row .fc input:focus,.fm-row .fc select:focus{border-color:var(--blue)}
.fm-row .fc .unit{color:#909399;font-size:13px}
.fm-row .fc .hint{color:#A8ABB2;font-size:12px;line-height:18px}
.fm-foot{display:flex;justify-content:flex-end;gap:10px;padding:12px 16px;border-top:1px solid #F0F2F5}
.fm-foot.stick{border-top:none;padding:4px 0 18px}

/* 复选组 / 色板 / 滑块 */
.chk-grp{display:flex;flex-wrap:wrap;gap:10px 18px;padding-top:7px}
.chk{display:inline-flex;align-items:center;gap:6px;cursor:pointer;color:#303133}
.chk input{width:14px;height:14px;accent-color:#0095E5;cursor:pointer}
.sw-list{display:flex;align-items:center;gap:10px;padding-top:4px}
.sw-i{width:20px;height:20px;border-radius:3px;cursor:pointer;border:2px solid #fff;box-shadow:0 0 0 1px #DCDFE6}
.sw-i.on{box-shadow:0 0 0 2px var(--blue)}
.rng{width:220px;accent-color:#0095E5}
.rng-v{color:#606266;font-size:13px;min-width:34px}

/* ===== 页面安全（水印设置 + 预览） ===== */
.wm-wrap{display:grid;grid-template-columns:minmax(0,1fr) 420px;gap:16px;align-items:start}
.wm-pv{position:relative;height:400px;background:#F7F8FA;border:1px solid #EBEEF5;border-radius:4px;overflow:hidden}
.wm-pv-page{position:absolute;inset:18px;background:#fff;border-radius:3px;box-shadow:0 1px 4px rgba(0,0,0,.06);overflow:hidden}
.wm-pv-bar{height:34px;background:#F2F6FA;border-bottom:1px solid #EBEEF5;display:flex;align-items:center;gap:6px;padding:0 12px}
.wm-pv-bar i{width:7px;height:7px;border-radius:50%;background:#DCDFE6}
.wm-pv-tx{padding:16px 18px;color:#C9CDD4;font-size:12px;line-height:22px}
.wm-pv-tx b{display:block;height:9px;background:#EDEFF2;border-radius:2px;margin-bottom:10px}
.wm-pv-tx b.w1{width:46%}.wm-pv-tx b.w2{width:88%}.wm-pv-tx b.w3{width:72%}.wm-pv-tx b.w4{width:94%}.wm-pv-tx b.w5{width:61%}
.wm-layer{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.wm-note{font-size:12px;color:#A8ABB2;line-height:20px;padding:8px 2px 0}

/* ===== 页面定制（素材上传） ===== */
.pg-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px;padding:16px}
.pg-item{border:1px solid #EBEEF5;border-radius:4px;padding:12px}
.pg-item .pt{font-size:13px;color:#606266;margin-bottom:10px;display:flex;align-items:center}
.pg-item .pt .op{margin-left:auto;font-size:12px;color:var(--blue);cursor:pointer}
.pg-up{height:86px;border:1px dashed #DCDFE6;border-radius:4px;display:flex;flex-direction:column;
  align-items:center;justify-content:center;gap:6px;color:#A8ABB2;font-size:12px;cursor:pointer;background:#FAFBFC}
.pg-up:hover{border-color:var(--blue);color:var(--blue);background:#F5FAFF}
.pg-up i{font-size:20px}
.pg-up.has{border-style:solid;background:#fff;color:#606266}
.pg-up .thumb{height:52px;max-width:100%;object-fit:contain}
.pg-item input[type=text]{width:100%;height:32px;border:1px solid var(--bd);border-radius:3px;padding:0 10px;font-size:13px;color:#303133;outline:none}
.pg-item input[type=text]:focus{border-color:var(--blue)}

/* ===== 产品许可 ===== */
.lc-hero{display:flex;align-items:center;gap:28px;padding:18px 20px;border:1px solid #EBEEF5;border-radius:4px;margin-bottom:14px}
.lc-hero .main{flex:1;min-width:0}
.lc-hero .cust{font-size:17px;color:#303133;margin-bottom:10px}
.lc-hero .meta{display:flex;gap:34px;font-size:13px;color:#606266;flex-wrap:wrap}
.lc-hero .meta b{color:#A8ABB2;font-weight:400;margin-right:6px}
.lc-hero .badge{display:inline-flex;align-items:center;gap:6px;height:28px;padding:0 12px;border-radius:14px;
  background:#EAF8EC;color:#52C41A;font-size:13px}
.lc-caps{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px;margin-bottom:14px}
.lc-cap{border:1px solid #EBEEF5;border-radius:4px;padding:14px 16px}
.lc-cap .cn{font-size:13px;color:#606266;margin-bottom:8px}
.lc-cap .cv{font-size:20px;color:#303133;font-weight:400;line-height:24px}
.lc-cap .cv em{font-size:12px;color:#A8ABB2;font-style:normal;margin-left:4px}
.lc-cap .bar{height:5px;border-radius:3px;background:#F0F2F5;margin-top:10px;overflow:hidden}
.lc-cap .bar i{display:block;height:5px;border-radius:3px;background:var(--blue)}
.lc-cap .bar i.warn{background:#FF7D00}

/* ===== 应用画像 ===== */
.pf-page{background:#fff;border-radius:3px;min-height:calc(100vh - 64px - 42px - 32px);display:flex;flex-direction:column}
.pf-hd{display:flex;align-items:center;padding:14px 16px 12px;border-bottom:1px solid #F0F2F5}
.pf-hd h4{font-size:15px;font-weight:500;color:var(--t1);flex:1;margin:0}
.pf-hd h4:before{content:"";display:inline-block;width:3px;height:14px;background:var(--blue);border-radius:2px;margin-right:8px;vertical-align:-2px}
.pf-hd .gear{width:32px;height:32px;border:1px solid var(--bd);border-radius:3px;display:flex;align-items:center;justify-content:center;color:#606266;cursor:pointer;margin-right:10px;font-size:15px}
.pf-hd .gear:hover{border-color:var(--blue);color:var(--blue)}
.pf-bd{flex:1;min-height:0;padding:12px 16px 0;display:flex;flex-direction:column}

.pf-st{display:inline-flex;align-items:center;gap:5px;font-size:13px;white-space:nowrap}
.pf-st i{width:7px;height:7px;border-radius:50%;flex-shrink:0}
.pf-st-lr,.pf-st-an{color:#0095E5}
.pf-st-lr i{background:#0095E5;animation:pfpulse 1.6s infinite}
.pf-st-an i{background:#0095E5;animation:pfpulse .9s infinite}
.pf-st-pd{color:#FF7D00}.pf-st-pd i{background:#FF7D00}
.pf-st-pb{color:#00B42A}.pf-st-pb i{background:#00B42A}
.pf-st-rp{color:#A8ABB2}.pf-st-rp i{background:#C0C4CC}
.pf-st-none{color:#A8ABB2}.pf-st-none i{background:#C0C4CC}
/* 列表里的小号状态：13px→11px，圆点 7→6，给名称留出宽度 */
.pf-st.sm{font-size:11px;gap:4px;flex-shrink:0}
.pf-st.sm i{width:6px;height:6px}
.pf-sub{font-size:12px;color:#A8ABB2;margin-top:2px;white-space:nowrap}
.pf-bar{width:86px;height:3px;border-radius:2px;background:#F0F2F5;margin-top:5px;overflow:hidden}
.pf-bar i{display:block;height:3px;background:#0095E5;border-radius:2px}
.pf-bar.wait i{animation:pfwait 1.5s infinite}
@keyframes pfpulse{0%,100%{opacity:1}50%{opacity:.22}}
@keyframes pfwait{0%{width:10%;margin-left:0}50%{width:55%;margin-left:22%}100%{width:10%;margin-left:90%}}

.pf-sel{position:relative}
.pf-selbox{min-height:32px;border:1px solid var(--bd);border-radius:3px;padding:4px 26px 4px 8px;display:flex;flex-wrap:wrap;gap:4px;cursor:pointer;background:#fff;position:relative}
.pf-selbox:hover{border-color:#C0C4CC}
.pf-selbox.on{border-color:var(--blue)}
.pf-selbox .ph{color:#B4B9C0;font-size:13px;line-height:22px}
.pf-chip{display:inline-flex;align-items:center;gap:5px;height:22px;padding:0 6px;background:#EAF5FD;color:#0074A8;border-radius:2px;font-size:12px}
.pf-chip b{font-weight:400;cursor:pointer;color:#85BADB}
.pf-chip b:hover{color:#0074A8}
.pf-selbox .arw{position:absolute;right:10px;top:50%;margin-top:-4px;border:4px solid transparent;border-top-color:#C0C4CC}
.pf-panel{display:none;margin-top:6px;background:#fff;border:1px solid #DCDFE6;border-radius:4px;box-shadow:0 2px 8px rgba(0,0,0,.06)}
.pf-panel.on{display:block}
.pf-panel .sbox{padding:8px;border-bottom:1px solid #F0F2F5}
.pf-panel .sbox input{width:100%;height:28px;border:1px solid var(--bd);border-radius:3px;padding:0 8px;font-size:13px;outline:none}
.pf-panel .list{max-height:206px;overflow:auto;padding:4px 0 6px}
.pf-pn{display:flex;align-items:center;gap:6px;height:28px;padding:0 10px;font-size:13px;color:#303133;cursor:pointer}
.pf-pn:hover{background:#F5F9FD}
.pf-pn.lv0{color:#909399;font-size:12px;background:#FAFBFC}
.pf-pn.lv1{color:#606266;padding-left:24px;font-size:13px}
.pf-pn.lv2{padding-left:46px}
.pf-pn.dis{color:#C0C4CC;cursor:not-allowed}
.pf-pn.dis:hover{background:none}
.pf-pn input{margin:0}
.pf-pn .ft{margin-left:auto;font-size:11px;color:#A8ABB2}

.pf-picked{width:100%;border-collapse:collapse;font-size:13px;margin-top:12px}
.pf-picked th{background:#F2F3F5;color:#303133;font-weight:400;text-align:left;padding:8px 10px;font-size:12px}
.pf-picked td{padding:6px 10px;border-bottom:1px solid #F0F2F5;color:#606266}
.pf-picked input[type=number]{width:66px;height:28px;border:1px solid var(--bd);border-radius:3px;padding:0 6px;font-size:13px;outline:none;text-align:center}
.pf-picked input[type=number]:focus{border-color:var(--blue)}
.pf-picked .rm{color:#0095E5;cursor:pointer;font-size:12px}

.pf-kpi{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:14px}
.pf-kpi .k{border:1px solid #EBEEF5;border-radius:4px;padding:12px 14px}
.pf-kpi .k .n{font-size:20px;color:#303133;line-height:23px}
.pf-kpi .k .t{font-size:12px;color:#909399;margin-top:4px}
.pf-meta{display:flex;gap:22px;font-size:12px;color:#909399;padding:9px 16px;background:#FAFBFC;border-bottom:1px solid #F0F2F5;flex-wrap:wrap}
.pf-meta b{font-weight:400;color:#303133;margin-left:4px}
.pf-back{font-size:13px;color:#0095E5;cursor:pointer;margin-right:10px;flex-shrink:0}

/* 模块分布 */
.pf-dist2{display:flex;gap:12px;align-items:flex-start}
.pf-dbox{background:#fff;border:1px solid #EBEEF5;border-radius:4px;overflow:hidden}
.pf-dbox .dh2{display:flex;align-items:baseline;height:38px;line-height:38px;padding:0 14px;font-size:13px;color:#303133;border-bottom:1px solid #F0F2F5}
.pf-dbox .dh2 .sub{margin-left:8px;font-size:11px;color:#A8ABB2;font-weight:400}
.pf-dbox .bd{padding:12px 14px}
.pf-dbox.l{flex:1;min-width:0}
.pf-dright{width:328px;flex-shrink:0;display:flex;flex-direction:column;gap:12px}
.pf-hrow{display:flex;align-items:center;height:30px;font-size:12px;color:#606266}
.pf-hrow .lb{width:104px;flex-shrink:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:#303133}
.pf-hrow .tr{flex:1;height:8px;background:#F0F2F5;border-radius:4px;overflow:hidden;margin:0 10px}
.pf-hrow .tr i{display:block;height:100%;background:#0095E5;border-radius:4px}
.pf-hrow .vv{width:56px;flex-shrink:0;text-align:right;font-size:11px;color:#909399}
.pf-share{display:flex;align-items:center;gap:8px}
.pf-share .tr{flex:1;max-width:104px;height:6px;background:#F0F2F5;border-radius:3px;overflow:hidden}
.pf-share .tr i{display:block;height:100%;background:#0095E5;border-radius:3px}
.pf-share .tx{width:40px;text-align:right;font-size:11px;color:#909399}

/* 模块排序 */
.pf-grip{width:34px;text-align:center;cursor:grab;user-select:none}
.pf-grip i{display:inline-block;width:12px;height:18px;vertical-align:-4px;
  background-image:radial-gradient(circle,#AEB5BE 1.7px,transparent 1.8px);
  background-size:6px 6px;background-repeat:repeat;background-position:0 2px}
.pf-grip:hover i{background-image:radial-gradient(circle,#0095E5 1.7px,transparent 1.8px)}
.pf-grip:active{cursor:grabbing}
.pf-seq{color:#A8ABB2;font-size:12px;text-align:center}
.pf-sort-tbl tr.dragging td{background:#EAF5FD}
.pf-sort-tbl tr.drop-t td{box-shadow:inset 0 2px 0 #0095E5}

/* 分段控件 */
.pf-seg{display:inline-flex;border:1px solid var(--bd);border-radius:3px;overflow:hidden;vertical-align:middle;margin-left:16px}
.pf-seg span{padding:0 11px;height:26px;line-height:24px;font-size:12px;color:#606266;cursor:pointer;background:#fff}
.pf-seg span+span{border-left:1px solid var(--bd)}
.pf-seg span:hover{color:#0095E5}
.pf-seg span.on{background:#0095E5;color:#fff}

/* 请求列表 */
/* 请求列表统计卡（2026-11-17）：原来是贴在一条灰底里的四格，和模块分析的卡片不是一套；
   改成四张独立白卡 + 大数字，两个页签的"数字区"看起来才是一家人 */
.pf-stat{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:12px}
.pf-stat .i{background:#fff;border:1px solid #EBEDF0;border-radius:10px;padding:14px 16px}
.pf-stat .v{font-size:26px;line-height:32px;color:#1D2129;font-weight:700;font-variant-numeric:tabular-nums;letter-spacing:-.2px}
.pf-stat .l{font-size:12px;color:#86909C;margin-top:2px}
.pf-fbar{display:flex;align-items:center;gap:8px;margin-bottom:8px;flex-wrap:wrap}
.pf-fbar .fin,.pf-fbar .fsel{flex:0 0 auto}
.pf-fbar.sub{margin-bottom:10px;padding-bottom:10px;border-bottom:1px solid #F0F2F5}
.pf-fbar .pf-cb{display:inline-flex;align-items:center;gap:5px;font-size:12px;color:#606266;cursor:pointer}
.pf-fbar .pf-cb input{accent-color:#0095E5;cursor:pointer}
.pf-tilde{color:#C0C4CC;font-size:12px}
.pf-gap{font-variant-numeric:tabular-nums;font-size:12px}
.pf-gap.s{color:#606266}
.pf-gap.m{color:#FF7D00}
.pf-gap.l{color:#F54141}
.pf-tag{display:inline-flex;align-items:center;height:18px;padding:0 5px;border-radius:2px;font-size:11px;margin-left:6px;vertical-align:1px;font-family:-apple-system,"Microsoft YaHei",sans-serif}
.pf-tag.split{background:#FFF8E6;color:#B88230;border:1px solid #FFE58F}
.pf-tag.bg{background:#F2F3F5;color:#909399}
.pf-tag.timed{background:#EAF5FD;color:#0074A8}
.pf-tag.chan{background:#F4F0FF;color:#6B4EE6}
.pf-req-tbl tr.pf-row-start td{background:#FFFCF2}

.pf-hint{font-size:12px;color:#909399;line-height:19px}
.pf-hint.warn{color:#FF7D00}
.pf-sect{border:1px solid #EBEEF5;border-radius:4px;padding:14px 16px;margin-bottom:14px}
.pf-sect .st{font-size:13px;color:#303133;margin-bottom:12px;padding-bottom:8px;border-bottom:1px solid #F5F7FA}
.pf-sect .st em{font-size:11px;color:#A8ABB2;font-style:normal;margin-left:8px}

/* 主从布局 */
.pf-master{display:flex;height:calc(100vh - 64px - 42px - 32px);margin:-14px -16px 0;background:#fff;border-radius:3px;overflow:hidden}
.pf-left{width:268px;flex-shrink:0;border-right:1px solid #EBEEF5;display:flex;flex-direction:column;background:#fff}
.pf-lhd{display:flex;align-items:center;height:40px;padding:0 10px 0 12px;border-bottom:1px solid #F5F7FA;flex-shrink:0}
.pf-lhd .t{font-size:13px;color:#303133;font-weight:500;display:inline-flex;align-items:center;gap:6px}
.pf-lhd .t .cnt{display:inline-block;min-width:18px;height:16px;line-height:16px;padding:0 5px;border-radius:8px;background:#F2F3F5;color:#909399;font-size:11px;font-weight:400;text-align:center}
.pf-lhd .lk{margin-left:auto;font-size:12px;color:var(--blue);cursor:pointer;white-space:nowrap}
.pf-lhd .lk:hover{color:#2FA9EC;text-decoration:underline}
.pf-left .sch{padding:10px 10px 8px;border-bottom:1px solid #F5F7FA;flex-shrink:0}
.pf-left .sch input{width:100%;height:30px;border:1px solid var(--bd);border-radius:3px;padding:0 9px;font-size:13px;outline:none}
.pf-left .sch input:focus{border-color:var(--blue)}
.pf-left .lst{flex:1;overflow:auto;padding:4px 0}
.pf-left .empty{padding:26px 12px;text-align:center;font-size:12px;color:#A8ABB2}
/* 应用项：两行——名称 + 状态标签 / 学习次数 + 添加时间 */
.pf-app{display:block;padding:9px 12px 9px 13px;cursor:pointer;border-left:2px solid transparent}
.pf-app:hover{background:#F5F9FD}
.pf-app.on{background:#EAF5FD;border-left-color:#0095E5}

.pf-legend{display:flex;flex-wrap:wrap;gap:6px 16px;margin-top:8px;font-size:11px;color:#86909C}
.pf-legend span{display:inline-flex;align-items:center;gap:5px}
.pf-legend i{width:8px;height:8px;border-radius:50%;display:inline-block;flex-shrink:0}

/* 长访问用户：紧凑榜 */
.pf-rank2{width:100%;border-collapse:collapse;font-size:12px;table-layout:fixed}
.pf-rank2 th{color:#909399;font-weight:400;font-size:11px;text-align:left;padding:0 4px 6px;border-bottom:1px solid #F0F2F5}
.pf-rank2 th.r{text-align:right}
.pf-rank2 td{padding:5px 4px;border-bottom:1px solid #F7F8FA;color:#606266}
.pf-rank2 tbody tr:last-child td{border-bottom:none}
.pf-rank2 td.rk{color:#A8ABB2;text-align:center}
.pf-rank2 td.rk.top{color:#0095E5;font-weight:600}
.pf-rank2 td.un{color:#303133;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pf-rank2 td.num{text-align:right;font-variant-numeric:tabular-nums}

/* ==================================================================
   v2.9 视觉重做（2026-11-17 按沁给的 5 张参考图）：
   白卡 + 浅灰分隔、指标大数字卡、极简图表（细条 / 环形 / 淡网格）、
   表格灰底表头 + 彩色文字操作。功能结构不变，只换皮。
   ================================================================== */
.pf-viz{--v1:#2B5CE6;--v2:#7FA9F0;--v3:#BCD3F7;--v4:#D5DBE5;--vt:#1D2129;--vs:#86909C;--vl:#EBEDF0}

/* 指标卡（2026-11-17 按参考图再改）：左侧圆形浅底图标 + 右侧「灰小标题 / 大数字 + 小注」
   参考图是横排、标题行只有一个词，数字 28px 加粗 */
.pf-kpi{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:12px}
.pf-kpi .k{position:relative;display:flex;align-items:center;gap:14px;background:#fff;border:1px solid #EBEDF0;border-radius:10px;padding:18px 16px;min-height:86px}
.pf-kpi .ic{width:44px;height:44px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;flex-shrink:0}
.pf-kpi .ic svg{width:21px;height:21px}
.pf-kpi .ic.b1{background:#E8F1FE;color:#3B82F6}
.pf-kpi .ic.b2{background:#FDECEC;color:#F0625D}
.pf-kpi .ic.b3{background:#E7F7EF;color:#22B07D}
.pf-kpi .ic.b4{background:#FFF3E4;color:#F5A623}
.pf-kpi .kh{min-width:0;display:flex;flex-direction:column;gap:3px}
.pf-kpi .t{font-size:13px;color:#86909C;line-height:17px;white-space:nowrap;display:inline-flex;align-items:center;gap:5px}
/* 指标卡口径：不再跟着数字排一行，收进标题右侧问号，悬停出气泡（2026-11-17 沁）
   气泡挂在卡片下方而不是上方——指标卡是内容区第一行，往上弹会被 .pf-content 的 overflow 切掉 */
.pf-kpi .qi{width:13px;height:13px;border-radius:50%;border:1px solid #C9CDD4;color:#A8ABB2;font-size:9px;
  line-height:11px;text-align:center;font-style:normal;cursor:default;flex-shrink:0;transition:all .15s}
.pf-kpi .qi:hover{border-color:#2B5CE6;color:#2B5CE6;background:#F2F6FF}
.pf-kpi .qi::after{content:attr(data-tip);position:absolute;left:50%;top:calc(100% + 8px);transform:translateX(-50%);
  width:max-content;max-width:224px;white-space:normal;text-align:left;
  background:#1D2129;color:#fff;font-size:11px;line-height:17px;padding:7px 10px;border-radius:6px;
  box-shadow:0 6px 18px rgba(0,0,0,.18);opacity:0;visibility:hidden;transition:opacity .15s;z-index:40;pointer-events:none}
/* 首尾两张卡的卡片贴边，气泡改为向内展开，避免被内容区裁掉 */
.pf-kpi .k:first-child .qi::after{left:0;transform:none}
.pf-kpi .k:last-child .qi::after{left:auto;right:0;transform:none}
.pf-kpi .qi:hover::after{opacity:1;visibility:visible}
.pf-kpi .kb{display:flex;align-items:baseline;gap:6px;min-width:0}
.pf-kpi .n{font-size:28px;line-height:33px;color:#1D2129;font-weight:700;font-variant-numeric:tabular-nums;letter-spacing:-.3px}
.pf-kpi .d{font-size:11px;color:#B4B9C0;font-style:normal;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* 卡片：标题纯文字（不再用灰色分隔线把标题和图表割开） */
.pf-dbox{border-radius:8px;border:1px solid #EBEDF0}
.pf-dbox .dh2{height:auto;line-height:1.4;padding:14px 16px 2px;font-size:15px;font-weight:600;color:#1D2129;border-bottom:none}
.pf-dbox .dh2 .sub{font-size:12px;color:#86909C;font-weight:400}
.pf-dbox .dh2 .sel select{height:26px;border:1px solid #E5E6EB;border-radius:6px;color:#4E5969;background:#fff}
.pf-dbox .dh2 .lk{color:#2B5CE6;font-weight:400}
.pf-dbox .bd{padding:12px 16px 16px}
.pf-anrow .pf-dbox.r{width:340px}
.pf-anrow .pf-dbox.l{min-width:0}

/* 横向条：单色细条 + 浅灰轨，数值贴条右端 */
.pf-hrow2{height:34px}
.pf-hrow2 .lb{width:96px;color:#4E5969;font-size:12px}
.pf-hrow2 .tr{height:8px;background:#EDEFF3;border-radius:4px;margin:0 10px}
.pf-hrow2 .tr i{background:#2B5CE6;border-radius:4px}
.pf-hrow2 .vv{width:54px;color:#1D2129;font-size:12px;font-variant-numeric:tabular-nums}
.pf-hrow2 .cv{width:64px;color:#86909C;font-size:11px}

/* 环形图 + 右侧浮卡 + 两列图例 */
.pf-donutwrap{display:flex;align-items:center;gap:4px;margin:2px 0 4px}
.pf-donut{width:150px;height:150px;flex-shrink:0}
.pf-donut .dn{font-size:20px;font-weight:600;fill:#1D2129}
.pf-donut .dl{font-size:10px;fill:#86909C}
.pf-callout{flex:1;min-width:0;background:#fff;border:1px solid #EBEDF0;border-radius:8px;box-shadow:0 2px 8px rgba(29,33,41,.06);padding:10px 12px}
.pf-callout .ct{font-size:12px;color:#4E5969;margin-bottom:6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:flex;align-items:center;gap:6px}
.pf-callout .cd{width:9px;height:9px;border-radius:2px;flex-shrink:0}
.pf-callout .cl{display:flex;justify-content:space-between;align-items:baseline;font-size:11px;color:#86909C;line-height:19px}
.pf-callout .cl b{font-size:13px;color:#1D2129;font-weight:600}
.pf-legend2{display:grid;grid-template-columns:1fr 1fr;gap:4px 10px;margin-top:6px}
.pf-legend2 span{display:flex;align-items:center;gap:5px;font-size:11px;color:#86909C;white-space:nowrap;cursor:pointer;border-radius:4px;padding:1px 5px;margin:-1px -5px}
.pf-legend2 span:hover{background:#F7F9FC}
.pf-legend2 span.on{background:#F2F6FF;color:#1D2129}
.pf-legend2 i{width:8px;height:8px;border-radius:2px;flex-shrink:0}
.pf-legend2 em{margin-left:auto;font-style:normal;color:#4E5969}

/* 环形图色块可点：选中那段外凸 5px（在 SVG 里画大一圈），不靠压透明度区分 */
.pf-donut .seg{cursor:pointer;transition:opacity .16s}
.pf-donut .seg:hover{opacity:.78}
.pf-donut .seg.on:hover{opacity:1}

/* 敏感度 × 访问用户（2026-11-17 新增） */
.pf-dbox .dh2 .senscnt{margin-left:auto;display:flex;gap:6px}
.pf-dbox .dh2 .senscnt i{font-size:11px;font-style:normal;font-weight:400;padding:2px 7px;border-radius:9px;line-height:15px}
.pf-senstbl{width:100%;border-collapse:collapse;font-size:12px;table-layout:fixed}
.pf-senstbl th{background:#F7F8FA;color:#86909C;font-weight:400;text-align:left;padding:8px 10px;font-size:12px}
.pf-senstbl th:first-child{border-radius:6px 0 0 6px}
.pf-senstbl th:last-child{border-radius:0 6px 6px 0}
.pf-senstbl td{padding:9px 10px;border-bottom:1px solid #F2F3F5;color:#1D2129;vertical-align:middle}
.pf-senstbl tr:last-child td{border-bottom:none}
.pf-senstbl .mn{font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pf-senstbl .num{font-variant-numeric:tabular-nums;color:#4E5969}
.pf-senstbl .r{text-align:right}
/* 用户列：默认一行，超出省略；完整名单在悬停气泡里（.pf-htip） */
.pf-senstbl .un{color:#4E5969;white-space:nowrap;overflow:hidden}
.pf-senstbl .uline{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;cursor:default}
.pf-senstbl .uc,.pf-htip .uc{display:inline-block;padding:0 6px;margin:2px 4px 2px 0;background:#F4F6FA;border-radius:3px;
  font-size:11px;line-height:20px;color:#4E5969;white-space:nowrap}
.pf-htip{position:fixed;z-index:96;display:none;max-width:340px;background:#fff;border:1px solid #E5E8EF;border-radius:8px;
  box-shadow:0 10px 28px rgba(31,45,61,.14);padding:10px 12px 11px}
.pf-htip b{display:block;font-size:12px;color:#1D2129;font-weight:600;margin-bottom:6px}
.pf-htip .chips{line-height:22px}
.pf-htip .more{font-size:11px;color:#A8ABB2;margin-top:6px}

/* 散点：淡网格 + 无底色块 */
.pf-scat .ax{font-size:10px;fill:#C0C6D0}
.pf-scat .bl{font-size:10px;fill:#4E5969}
.pf-legend{gap:6px 14px;color:#86909C}
.pf-legend i{border-radius:2px}

/* 用户榜：去表头底色，行高加大 */
.pf-rank2 th{background:none;border-bottom:1px solid #EBEDF0;padding:0 4px 8px;font-size:11px;color:#86909C}
.pf-rank2 td{padding:8px 4px;border-bottom:1px solid #F2F3F5;font-size:12px}
.pf-rank2 td.rk{color:#A9AEB8}
.pf-rank2 td.rk.top{color:#2B5CE6;font-weight:600}
.pf-rank2 td.un{color:#1D2129;font-weight:500}
.pf-rank2 td.num{color:#4E5969}
.pf-rank2 td.dim{color:#86909C}

/* 模块清单工具条：左「共 N 个模块」，右侧搜索 + 展开全部 */
.pf-mtools{margin:2px 0 10px;gap:10px}
/* 左边管表格整体（展开全部 + 条数），右边管筛选（搜索） */
.pf-mtools .mt-l{display:flex;align-items:center;gap:10px;font-size:12px;color:#86909C}
.pf-mtools .mt-l .lk{margin-left:0;font-size:12px}
.pf-mtools .mt-l .sep{width:1px;height:11px;background:#E5E6EB}
.pf-mtools .schx{margin-left:auto}

/* 分页条（2026-11-17）：左条数统计，右页码 */
.pf-pager{display:flex;align-items:center;gap:12px;margin-top:12px;font-size:12px;color:#86909C}
.pf-pager b{color:#1D2129;font-weight:600}
.pf-pager .pgs{margin-left:auto;display:flex;align-items:center;gap:6px}
.pf-pager .pn{min-width:26px;height:26px;padding:0 8px;border:1px solid #E5E6EB;border-radius:6px;background:#fff;
  color:#4E5969;font-size:12px;cursor:pointer;display:inline-flex;align-items:center;justify-content:center}
.pf-pager .pn:hover{border-color:#2B5CE6;color:#2B5CE6}
.pf-pager .pn.on{background:#2B5CE6;border-color:#2B5CE6;color:#fff}
.pf-pager .pn.on:hover{color:#fff}
.pf-pager .pn.dis{color:#C9CDD4;cursor:not-allowed;border-color:#EDEFF3}
.pf-pager .pn.dis:hover{border-color:#EDEFF3;color:#C9CDD4}
.pf-pager .pn.dots{border:none;background:none;cursor:default;color:#C9CDD4}
.pf-mtools .mt-l b{color:#4E5969;font-weight:600;margin:0 1px}
.pf-mtools .schx{flex:0 0 252px;margin-left:auto}
.pf-mtools .schx svg{position:absolute;left:9px;top:7px;width:14px;height:14px;color:#C0C6D0;pointer-events:none}
.pf-mtools .schx input{height:30px;border:1px solid #E5E6EB;border-radius:6px;background:#F7F8FA;padding:0 26px 0 28px;font-size:12px}
.pf-mtools .schx input:focus{background:#fff;border-color:#2B5CE6}
.pf-mtools .lk{color:#2B5CE6}

/* 展开圈：圆圈里 +/-（参考表格的 ⊕ / ⊖） */
.pf-caret{width:16px;height:16px;border:1px solid #C9CDD4;border-radius:50%;font-size:12px;line-height:14px;color:#86909C;transition:none}
.pf-caret:hover{border-color:#2B5CE6;color:#2B5CE6}
.pf-caret.on{transform:none;border-color:#2B5CE6;color:#2B5CE6}

/* 表格：灰底表头 + 无竖线 + 行高 44 */
.pf-mtbl th{background:#F7F8FA;color:#86909C;height:38px;padding:0 10px;border-bottom:none;font-size:12px}
.pf-mtbl th:first-child{border-radius:6px 0 0 6px}
.pf-mtbl th:last-child{border-radius:0 6px 6px 0}
.pf-mtbl td{height:44px;padding:0 10px;border-bottom:1px solid #F2F3F5;font-size:13px}
.pf-mtbl tbody tr.pf-mrow:hover td{background:#F7F9FC}
.pf-mtbl tbody tr.pf-mrow.on td{background:#F5F8FE;border-bottom-color:#E5EBF7}
.pf-mtbl .c-nm .pf-mod-nm{color:#1D2129}
.pf-mtbl .c-main .u{color:#86909C}
.pf-mtbl .num{color:#1D2129}
.pf-mtbl .c-op .op{color:#2B5CE6}
.pf-apitbl th{background:#FAFBFC;color:#86909C;border-bottom:none;border-top:none}
.pf-apitbl td{border-bottom:1px solid #F2F3F5}
.pf-apitbl tbody tr.pf-row-main td{background:#F2F6FE}
.pf-apitbl tbody tr.pf-row-main td:first-child{box-shadow:inset 3px 0 0 #2B5CE6}
.pf-mainbg{background:#2B5CE6;border-radius:3px}
.pf-apitbl .c-u .u{color:#1D2129}
.pf-mexp td{background:#fff}

/* 请求列表：表头同样灰底 */
.pf-req-tbl th{background:#F7F8FA;color:#86909C;border-bottom:none;height:38px}
.pf-req-tbl th:first-child{border-radius:6px 0 0 6px}
.pf-req-tbl th:last-child{border-radius:0 6px 6px 0}
/* 敏感度：状态类信息统一走胶囊，可点的给手型 + hover 加深 */
.pf-senpick{cursor:pointer}
.pf-senpick .pf-sens{transition:filter .12s}
.pf-senpick:hover .pf-sens{filter:brightness(.96)}

/* 请求列表：数据密集，字号收一档；URL 单行省略（悬停看全文），不再折行把行高撑乱 */
.pf-req-tbl{table-layout:fixed;font-size:12px}
.pf-req-tbl td{height:40px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:12px}
.pf-req-tbl .c-api .u{font-family:Consolas,monospace;font-size:11px;color:#303133;display:inline-block;vertical-align:middle;max-width:calc(100% - 78px);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pf-req-tbl .pf-tag{vertical-align:middle;margin-left:4px}
.pf-fbar .pf-cb{flex-shrink:0}
.pf-fbar .pf-cb input{flex-shrink:0;width:14px;height:14px}
.pf-req-tbl .c-ip{font-family:Consolas,monospace;font-size:11px;color:#86909C}
.pf-req-tbl .pf-gap{text-align:right}
.pf-req-tbl .c-ts{font-family:Consolas,monospace;font-size:11px;color:#4E5969}
/* 9 列在 830px 里偏挤：内边距收到 8px，把宽度让给时间和 URL */
.pf-req-tbl th,.pf-req-tbl td{padding-left:8px;padding-right:8px}

/* 抽屉底部操作条（学习抽屉、设置抽屉共用一个版式） */
.drawer .dft{display:flex;align-items:center;gap:10px;padding:12px 16px;border-top:1px solid #F0F2F5;background:#fff;flex-shrink:0}
.drawer .dft .cnt{margin-right:auto;font-size:12px;color:#86909C}
/* 学习时长批量设置 */
.pf-dayset{display:flex;align-items:center;gap:8px}
/* 表单行的 .frow .ctl input{width:100%} 会把这个小输入框撑满整行，这里提权收窄 */
.pf-sect .frow .ctl .pf-dayset input,.pf-dayset input{width:72px;flex:0 0 72px;height:32px;border:1px solid #E5E6EB;border-radius:6px;padding:0 8px;font-size:13px;text-align:center;outline:none}
.pf-dayset .u{font-size:13px;color:#4E5969}
.pf-dayset .btn-plain{white-space:nowrap;flex-shrink:0}
.pf-dayset input:focus{border-color:#2B5CE6}
/* 抽屉里的树形选择：面板跟着滚动，别用绝对定位被裁掉 */
.drawer .pf-selbox{border-radius:6px;border-color:#E5E6EB}
.drawer .pf-panel{border-radius:6px;border-color:#EBEDF0}
.drawer .pf-picked th{background:#F7F8FA;color:#86909C;font-weight:400}
.drawer .pf-picked td{border-bottom:1px solid #F2F3F5}
.drawer .pf-picked .rm{color:#2B5CE6}

/* 空白缺省页：垂直居中、大留白，按钮与「新建应用学习」同级同尺寸 */
.pf-init{padding:40px 20px}
.pf-init .t1{font-size:17px;color:#1D2129;font-weight:600;margin-top:16px}
.pf-init .t2{font-size:13px;color:#86909C;line-height:22px;max-width:460px;margin-top:10px}
.pf-init .pf-btn{margin-top:22px;height:32px;padding:0 18px}

/* 分析中页（2026-11-17）：插画 + 跑动进度条 + 一句"不用守着" */
.pf-load{display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:56px 20px 64px}
.pf-load .ill{width:240px;height:180px;animation:pfFloat 3.2s ease-in-out infinite}
.pf-load .an-ill{width:240px;height:180px;display:block}
@keyframes pfFloat{0%,100%{transform:translateY(0)}50%{transform:translateY(-7px)}}
.pf-load .t1{font-size:16px;font-weight:600;color:#1D2129;margin-top:6px}
.pf-load .t2{font-size:13px;color:#86909C;line-height:22px;max-width:430px;margin-top:8px}
.pf-load .bar{width:180px;height:4px;border-radius:3px;background:#EDF1F7;margin-top:20px;overflow:hidden}
.pf-load .bar i{display:block;width:42%;height:100%;border-radius:3px;
  background:linear-gradient(90deg,#8FBBFB,#2B5CE6);animation:pfRun 1.5s ease-in-out infinite}
@keyframes pfRun{0%{transform:translateX(-110%)}100%{transform:translateX(250%)}}
.pf-load .t3{font-size:12px;color:#B4B9C0;margin-top:14px}
.pf-init .lnk{color:#2B5CE6;cursor:pointer}
.pf-init .lnk:hover{text-decoration:underline}

/* 模块分析：主 API 集中度（100% 堆叠条，替代覆盖度散点） */
.pf-mshare{display:flex;flex-direction:column;gap:11px;padding:2px 0}
.pf-mshare .mrow{display:flex;align-items:center;gap:10px;font-size:12px}
.pf-mshare .mn{width:82px;flex-shrink:0;color:#4E5969;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pf-mshare .mt{flex:1;min-width:0;height:8px;border-radius:5px;background:#F2F3F5;display:flex;overflow:hidden}
.pf-mshare .mt i{display:block;height:100%}
.pf-mshare .mt i.a{background:#2B5CE6;border-radius:5px 0 0 5px}
.pf-mshare .mt i.b{background:#DCDFE6;border-radius:0 5px 5px 0}
.pf-mshare .mv{width:38px;flex-shrink:0;text-align:right;color:#1D2129;font-variant-numeric:tabular-nums}
.pf-mshare .mv.low{color:#E08A2E}

/* 敏感度空态（2026-11-17）：敏感度不是系统识别的，得人工标注后才出归纳结果 */
.pf-sensempty{display:flex;flex-direction:column;align-items:flex-start;gap:7px;padding:22px 4px 26px}
.pf-sensempty .t1{font-size:14px;color:#1D2129;font-weight:600}
.pf-sensempty .t2{font-size:12px;color:#86909C;line-height:20px;max-width:620px}
.pf-sensempty .btn-plain{margin-top:6px;height:30px}

/* 缺省页插画放大一档（2026-11-17）：文件夹 / 书本都要占住视觉中心 */
.pf-init .ill{width:320px;height:auto;margin-bottom:2px}

/* ==================================================================================
   设计规范对齐层 · 2026-11-18
   依据《竹云视觉设计规范》4.2.1 按钮 / 4.2.5 抽屉 / 4.3.5 分页 / 4.4.6 下拉菜单 / 4.5.1 表格
   只改视觉 token（尺寸、配色、圆角、状态），不动布局结构与间距关系
   ================================================================================== */
:root{
  --sp-blue:#0095E5;      /* 主色 */
  --sp-blue-h:#0086CE;    /* 悬停 */
  --sp-blue-a:#0077B8;    /* 按下 */
  --sp-blue-d:#B3DEF7;    /* 禁用 */
  --sp-danger:#F54141;
  --sp-success:#00B42A;
  --sp-warn:#FF7D00;
  --sp-bd:#C9CDD4;        /* 控件描边 */
  --sp-bd-l:#EBEEF5;      /* 分割线 */
  --sp-th:#F5F7FA;        /* 表头底 */
  --sp-hov:#F2F9FA;       /* 悬停底 */
  --sp-chev:url("data:image/svg+xml;charset=utf8,%3Csvg xmlns='http://www.w3.org/2000/svg' width='10' height='6' viewBox='0 0 10 6'%3E%3Cpath d='M1 1l4 4 4-4' fill='none' stroke='%2386909C' stroke-width='1.2' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E");
}

/* ---- 1 按钮：标准 32 / 字号 14 / 左右 16；小按钮 24 / 12；禁用与危险态 ---- */
.btn-pri,.btn-plain{height:32px;padding:0 16px;font-size:14px;border-radius:3px}
.btn-pri{background:var(--sp-blue);border:1px solid var(--sp-blue)}
.btn-pri:hover{background:var(--sp-blue-h);border-color:var(--sp-blue-h)}
.btn-pri:active{background:var(--sp-blue-a);border-color:var(--sp-blue-a)}
.btn-pri[disabled],.btn-pri.dis{background:var(--sp-blue-d);border-color:var(--sp-blue-d);color:#fff;cursor:not-allowed}
.btn-plain{border:1px solid var(--sp-bd);color:#4E5969}
.btn-plain:hover{color:var(--sp-blue);border-color:var(--sp-blue)}
.btn-plain:active{color:var(--sp-blue-a);border-color:var(--sp-blue-a)}
.btn-plain[disabled],.btn-plain.dis{color:#C9CDD4;border-color:#E5E6EB;background:#F7F8FA;cursor:not-allowed}
/* 表格行内 / 卡片里的小按钮 */
.pf-live .btn-plain,.pf-live .btn-pri{height:24px;padding:0 12px;font-size:12px}
/* 危险按钮（删除类） */
.btn-pri.danger{background:var(--sp-danger);border-color:var(--sp-danger)}
.btn-pri.danger:hover{background:#E03E32;border-color:#E03E32}

/* ---- 2 抽屉：标题 16/600、头 56、内容 24、底部操作区 16/24（宽度由 JS 传，标准 476） ---- */
.drawer .dh{height:56px;padding:0 24px;border-bottom:1px solid var(--sp-bd-l);background:#fff}
.drawer .dh b{font-size:16px;font-weight:600;color:#1D2129}
.drawer .dh .x{color:#86909C}
.drawer .dh .x:hover{background:#F2F3F5;color:#1D2129}
.drawer .db{padding:16px 24px 24px}
.drawer .dft{padding:16px 24px;border-top:1px solid var(--sp-bd-l);background:#fff;justify-content:flex-end}
.drawer .dft .btn-plain,.drawer .dft .btn-pri{min-width:76px;justify-content:center}

/* ---- 3 列表（表格）：表头 44 / #F5F7FA / 500 字重；行 48；分割线 #EBEEF5 ---- */
.lp-tbl th{background:var(--sp-th);color:#4E5969;font-weight:500;padding:0 12px;height:44px;border-bottom:1px solid var(--sp-bd-l)}
.lp-tbl td{padding:0 12px;height:48px;border-bottom:1px solid var(--sp-bd-l);color:#1D2129}
.lp-tbl tbody tr:hover td{background:var(--sp-hov)}
.lp-tbl .op,.lp-tbl a.op{color:var(--sp-blue);font-size:13px}

/* ---- 4 筛选：控件统一 32 高、描边 #C9CDD4、聚焦主色 ---- */
.fsel,.fin{border:1px solid var(--sp-bd);border-radius:3px;color:#4E5969}
.fsel:focus,.fin:focus{border-color:var(--sp-blue)}
.fsel:hover,.fin:hover{border-color:#A9AEB8}
/* 原生下拉的箭头统一成规范的细 chevron */
select.fsel,select.fin{
  appearance:none;-webkit-appearance:none;-moz-appearance:none;
  background-image:var(--sp-chev);background-repeat:no-repeat;background-position:right 9px center;
  padding-right:28px;
}

/* ---- 5 分页：页码 24×24 无边框；当前页蓝底白字；悬停浅蓝底蓝字 ---- */
.pager2 .pg span{min-width:24px;height:24px;line-height:24px;padding:0 4px;border:0;border-radius:2px;background:transparent;color:#4E5969}
.pager2 .pg span:hover{background:var(--sp-hov);color:var(--sp-blue);border:0}
.pager2 .pg span.on{background:var(--sp-blue);color:#fff}
.pager2 .pg span.on:hover{background:var(--sp-blue);color:#fff}
.pager2 .pg span.dis{color:#C9CDD4;background:transparent;cursor:default}
.pager2 .pg span.dis:hover{color:#C9CDD4;background:transparent}
.pager2 select{height:28px;border-color:var(--sp-bd);border-radius:3px;color:#4E5969;
  appearance:none;-webkit-appearance:none;background-image:var(--sp-chev);background-repeat:no-repeat;
  background-position:right 8px center;padding:0 26px 0 8px}
.pager2 .jump input{height:28px;border-color:var(--sp-bd);border-radius:3px}

/* ---- 6 下拉菜单（原生 select 的展开面板由系统绘制，只能统一闭合态与外框） ---- */
.fsel::placeholder,.fin::placeholder{color:#A9AEB8}
/* 抽屉 / 弹窗里的表单控件同样是同类下拉，一并对齐描边、聚焦、箭头与禁用态 */
.frow .ctl input,.frow .ctl select,.frow .ctl textarea,
.fm-row .fc input[type=text],.fm-row .fc input:not([type]),.fm-row .fc select,
.pg-item input[type=text]{border:1px solid var(--sp-bd);border-radius:3px;color:#4E5969;background:#fff}
.frow .ctl input:focus,.frow .ctl select:focus,.frow .ctl textarea:focus,
.fm-row .fc input:focus,.fm-row .fc select:focus{border-color:var(--sp-blue)}
.frow .ctl select,.fm-row .fc select{
  appearance:none;-webkit-appearance:none;-moz-appearance:none;
  background-image:var(--sp-chev);background-repeat:no-repeat;background-position:right 9px center;
  padding-right:28px;
}
.frow .ctl input[disabled],.frow .ctl select[disabled],.frow .ctl textarea[disabled],
.fm-row .fc input[disabled],.fm-row .fc select[disabled],
.fin[disabled],.fsel[disabled]{background:#F7F8FA;border-color:#E5E6EB;color:#C9CDD4;cursor:not-allowed}

/* ---- 7 遮罩：抽屉与弹窗统一 #000 / 40% ---- */
.mask{background:rgba(0,0,0,.4)}
/* 表单标签列加宽到 112（内容 104）：476 标准抽屉下 6~8 字标签不再折行，控件宽度相应少 20px */
.frow>label{width:112px;padding-right:8px}

/* ================= 画像对比（2026-11-18 新增） ================= */
.pf-cmpbar{display:flex;align-items:center;gap:10px;padding:14px 0 10px;flex-wrap:wrap}
.pf-cmpbar .back{color:#4E5969;font-size:13px;cursor:pointer;padding:2px 8px;border-radius:3px}
.pf-cmpbar .back:hover{color:var(--sp-blue);background:var(--sp-hov)}
.pf-cmpbar .dv{width:1px;height:14px;background:var(--sp-bd-l)}
.pf-cmpbar b{font-size:15px;color:#1D2129;font-weight:600}
.pf-cmpbar .vs{font-size:13px;color:#86909C}
.pf-cmpbar .arw{color:#C9CDD4}
.pf-cmpbar .cur{font-size:13px;color:#1D2129;font-weight:500}

.pf-cmp-sum{display:flex;align-items:center;gap:8px;padding:0 0 12px;flex-wrap:wrap}
.pf-cmp-sum .ct{display:inline-flex;align-items:center;gap:4px;height:28px;padding:0 10px;
  border:1px solid var(--sp-bd-l);border-radius:14px;font-size:12px;color:#4E5969;background:#fff;cursor:pointer}
.pf-cmp-sum .ct:hover{border-color:var(--sp-bd)}
.pf-cmp-sum .ct b{font-weight:600}
.pf-cmp-sum .ct.add b{color:var(--sp-blue)}
.pf-cmp-sum .ct.chg b{color:var(--sp-warn)}
.pf-cmp-sum .ct.del b{color:var(--sp-danger)}
.pf-cmp-sum .ct.same b{color:#86909C}
.pf-cmp-sum .ct.on{border-color:var(--sp-blue);background:var(--sp-hov)}
.pf-cmp-sum .hint{margin-left:auto;font-size:12px;color:#A8ABB2;line-height:18px;text-align:right}

.pf-ctag{display:inline-block;height:20px;line-height:20px;padding:0 6px;border-radius:3px;font-size:12px;white-space:nowrap}
.pf-ctag.add{color:var(--sp-blue);background:#EAF5FD}
.pf-ctag.chg{color:var(--sp-warn);background:#FFF6E8}
.pf-ctag.del{color:var(--sp-danger);background:#FEECEC}
.pf-ctag.same{color:#86909C;background:var(--sp-th)}
.pf-ctag.cal{color:#722ED1;background:#F5F0FF;margin-left:6px;height:18px;line-height:18px;padding:0 5px;font-size:11px}

.pf-crow{cursor:pointer}
.pf-crow:hover td{background:#F7FAFE}
.pf-crow.on td{background:#F2FAFE}
.pf-crow .nm{color:#1D2129}
.pf-crow .nm .to{color:#C9CDD4;font-style:normal;margin:0 2px}
.pf-crow .ch{font-size:12px;color:#86909C}
.pf-crow .nil{color:#C9CDD4;font-size:12px}
.pf-crow .ops .op{color:var(--sp-blue);font-size:12px;cursor:pointer}
.pf-crow .ops .op:hover{text-decoration:underline}
.pf-crow-detail td{background:#FAFCFE;padding:0 10px 14px}

.pf-cmpd .dft{color:var(--sp-warn);font-weight:500}
.pf-cmpd .nil{color:#C9CDD4;font-size:12px}
.pf-cmpd .row.apis{grid-template-columns:96px 1fr;gap:14px}
.pf-cmpd .apis-box{max-height:232px;overflow:auto;padding-right:4px}
.pf-cmpd .apirow{display:flex;align-items:center;gap:8px;padding:4px 0;font-size:12px;border-bottom:1px dashed #F5F7FA}
.pf-cmpd .apirow:last-child{border-bottom:0}
.pf-cmpd .apirow .u{flex:1;min-width:0;color:#4E5969;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  font-family:Consolas,Monaco,'Courier New',monospace;font-size:12px}
.pf-cmpd .apirow .ct{width:76px;text-align:right;color:#A8ABB2;font-size:12px;flex-shrink:0}
.pf-cmpd .tg{display:inline-block;height:18px;line-height:18px;padding:0 6px;border-radius:3px;font-size:11px;flex-shrink:0}
.pf-cmpd .tg.both{color:#86909C;background:var(--sp-th)}
.pf-cmpd .tg.only-b{color:var(--sp-danger);background:#FEECEC}
.pf-cmpd .tg.only-c{color:var(--sp-blue);background:#EAF5FD}

.btn-line.danger{color:var(--sp-danger);border-color:#FBB9B9}
