/* ================= 画像对比（2026-11-18 新增） =================
   场景：应用新增了模块，重新学习生成了新画像。管理员要快速确认「新画像 vs
   当前生效画像（或其他历史画像）」在模块结构上到底差在哪，并能把基线里已经
   校准好的模块直接回填到新画像，不用逐项重抄。
   对比口径：模块结构（名称 / 主 API / API 列表 / 敏感度），不含调用量与用户数
   —— 后者随学习窗口变化，比了没有决策价值。 */
var PF_CMP={on:false,base:'',sel:'',only:'',draft:{},chk:{},prev:true};

/* 能当基线的：当前批次之外，且已经有画像的批次（学习中、分析中没有画像可对） */
function pfCmpBaseList(cb){
  var out=[];
  pfSorted(pfCurApp()).forEach(function(b){
    if(b.id===cb.id) return;
    if(b.st==='lr'||b.st==='an') return;
    out.push(b);
  });
  return out;
}
function pfCmpOpen(){
  var cb=pfCurBatch(); if(!cb) return;
  var list=pfCmpBaseList(cb);
  if(!list.length){ lpTip('没有可对比的历史画像：先发布一版，或结束一次学习'); return; }
  var hit=null;
  list.forEach(function(b){ if(b.id===PF_CMP.base) hit=b; });
  if(!hit) list.forEach(function(b){ if(!hit && b.st==='pb') hit=b; });
  if(!hit) hit=list[0];
  PF_CMP.on=true; PF_CMP.base=hit.id; PF_CMP.sel=''; PF_CMP.only='';
  PF_CMP.draft={}; PF_CMP.chk={};
  lpRerender();
}
/* 有未保存的沿用改动时先确认，避免一路返回把草稿丢了 */
function pfCmpClose(){
  var n=pfCmpDraftN();
  if(n){
    var _L=pfCmpLab();
    lpConfirm('放弃未保存的改动？','有 '+n+' 项「采纳 '+_L.b+'」的改动还没保存，离开对比视图后会丢失。',function(){
      PF_CMP.draft={}; PF_CMP.chk={};
      PF_CMP.on=false; PF_CMP.sel=''; PF_CMP.only=''; lpRerender();
    },'warn');
    return;
  }
  PF_CMP.on=false; PF_CMP.sel=''; PF_CMP.only=''; lpRerender();
}
function pfCmpSetBase(id){ PF_CMP.base=id; PF_CMP.sel=''; PF_CMP.draft={}; PF_CMP.chk={}; lpRerender(); }
function pfCmpFilter(k){ PF_CMP.only=(PF_CMP.only===k?'':k); lpRerender(); }
/* onclick 里为了安全把 key 编码过，进函数先还原——否则中文模块名永远匹配不上（2026-11-18 修） */
function pfDK(k){ try{ return decodeURIComponent(k); }catch(e){ return k; } }
function pfCmpPick(k){ k=pfDK(k); PF_CMP.sel=(PF_CMP.sel===k?'':k); lpRerender(); }

/* 两个模块的 API 是否同一批（只比路径） */
function pfApiSet(m){
  var s={}; ((m&&m.apis)||[]).forEach(function(a){ s[a.u]=1; }); return s;
}

/* 算差异：先同名匹配，再用「主 API 相同」认出改名，再退到「API 重合度过半」 */
function pfCmpRows(cb, bb){
  var cm=pfMods(cb), bm=pfMods(bb);
  var usedB={}, usedC={}, rows=[];

  function pair(bi, ci, how){
    usedB[bi]=1; usedC[ci]=1;
    var b=bm[bi], c=cm[ci], ch=[];
    if(b.n!==c.n) ch.push({k:'名称',from:b.n,to:c.n});
    if((b.main||'')!==(c.main||'')) ch.push({k:'主 API',from:b.main,to:c.main});
    var bs=pfApiSet(b), cs=pfApiSet(c), addOnly=[], delOnly=[];
    Object.keys(cs).forEach(function(u){ if(!bs[u]) addOnly.push(u); });
    Object.keys(bs).forEach(function(u){ if(!cs[u]) delOnly.push(u); });
    if(addOnly.length||delOnly.length) ch.push({k:'API 列表',add:addOnly,del:delOnly});
    if((b.sens||'')!==(c.sens||'')) ch.push({k:'敏感度',from:b.sens||'',to:c.sens||''});
    rows.push({key:b.n,type:ch.length?'chg':'same',how:how,ch:ch,add:addOnly,
      del:delOnly,base:b,now:c,bi:bi,ci:ci});
  }

  cm.forEach(function(m,ci){
    if(usedC[ci]) return;
    for(var bi=0;bi<bm.length;bi++){ if(usedB[bi]) continue; if(bm[bi].n===m.n){ pair(bi,ci,'same'); return; } }
  });
  cm.forEach(function(m,ci){
    if(usedC[ci]) return;
    for(var bi=0;bi<bm.length;bi++){
      if(usedB[bi]) continue;
      if(m.main && bm[bi].main && bm[bi].main===m.main){ pair(bi,ci,'rename'); return; }
    }
  });
  cm.forEach(function(m,ci){
    if(usedC[ci]) return;
    var cs=pfApiSet(m), best=-1, bestN=0;
    for(var bi=0;bi<bm.length;bi++){
      if(usedB[bi]) continue;
      var bs=pfApiSet(bm[bi]), hit=0;
      Object.keys(bs).forEach(function(u){ if(cs[u]) hit++; });
      var denom=Math.max(Object.keys(bs).length, Object.keys(cs).length)||1;
      if(hit/denom>0.5 && hit>bestN){ bestN=hit; best=bi; }
    }
    if(best>=0) pair(best,ci,'overlap');
  });

  cm.forEach(function(m,ci){
    if(!usedC[ci]) rows.push({key:'new:'+m.n,type:'add',how:'',ch:[],add:[],del:[],base:null,now:m,bi:-1,ci:ci});
  });
  bm.forEach(function(m,bi){
    if(!usedB[bi]) rows.push({key:m.n,type:'del',how:'',ch:[],add:[],del:[],base:m,now:null,bi:bi,ci:-1});
  });
  return rows;
}

/* ---------- 沿用 V1：草稿 → 保存 ----------
   2026-11-18 沁：点一下就直接改数据，既不知道生效没有，也不能反悔、不能批量。
   现在「沿用 V1」是一个开关：先只改草稿 PF_CMP.draft（可随时关掉），点【保存修改】才写进画像，
   保存前还能在下面「保存后的 V2 画像」里看到结果。 */
function pfCmpRowByKey(key){
  var cb=pfCurBatch(), bb=pfCmpBase();
  if(!cb||!bb) return null;
  var hit=null;
  pfCmpRows(cb,bb).forEach(function(x){ if(x.key===key) hit=x; });
  return hit;
}
/* 这一项「是否应该沿用 V1」：草稿优先，否则看已保存状态 */
function pfCmpRowOn(r){
  if(!r) return false;
  if(PF_CMP.draft.hasOwnProperty(r.key)) return !!PF_CMP.draft[r.key];
  return !!(r.now&&r.now.__cal==='base');
}
function pfCmpSaved(r){ return !!(r&&r.now&&r.now.__cal==='base'); }
/* 能采纳的行：只有「还有差异」的修改行和消失行。
   一致行（包括已经采纳过、这次比对已经一致的）一律不可操作 ——
   采纳完再进来就是一轮新比对，不该还挂着上一轮的处理痕迹（沁 2026-11-18）。
   要反悔已经采纳的模块，去模块清单点「恢复识别」 */
function pfCmpSwitchable(r){
  if(!r) return false;
  if(r.type==='add'||r.type==='same') return false;
  return true;
}
function pfCmpToggle(key){
  key=pfDK(key);
  var r=pfCmpRowByKey(key); if(!r||!pfCmpSwitchable(r)) return;
  var want=!pfCmpRowOn(r), saved=pfCmpSaved(r);
  if(want===saved) delete PF_CMP.draft[key];
  else PF_CMP.draft[key]=want?1:0;
  lpRerender();
}
/* 未保存的改动数量（草稿与已保存状态不一致的项） */
function pfCmpDraftN(){
  return Object.keys(PF_CMP.draft||{}).filter(function(k){
    var r=pfCmpRowByKey(k); if(!r) return false;
    return !!PF_CMP.draft[k]!==pfCmpSaved(r);
  }).length;
}
/* 真正写进画像：不提示、不重绘，供保存时批量调用 */
function pfApplyAdopt(key, cb, bb){
  var r=null;
  pfCmpRows(cb,bb).forEach(function(x){ if(x.key===key) r=x; });
  if(!r||!r.base) return false;
  var cm=pfMods(cb), bak=pfClone(r.base);
  if(r.now){
    var i=cm.indexOf(r.now); if(i<0) return false;
    r.now.__bak=pfClone(r.now);
    r.now.__cal='base';
    cm[i]=Object.assign(r.now, {
      n:bak.n, main:bak.main, apis:bak.apis, api:bak.api, cnt:bak.cnt, usr:bak.usr,
      sens:bak.sens, __cal:'base', __bak:r.now.__bak
    });
    pfAudit(pfCurApp().n, bak.n, '沿用旧版模块',
      '用「'+bb.id+'」的「'+bak.n+'」覆盖当前画像同名模块');
  }else{
    bak.__cal='base';
    cm.push(bak);
    pfAudit(pfCurApp().n, bak.n, '补回旧版模块',
      '把「'+bb.id+'」独有模块「'+bak.n+'」补进当前画像');
  }
  return true;
}
function pfApplyUndo(key, cb, bb){
  var cm=pfMods(cb), hit=null;
  cm.forEach(function(x){ if(x.__cal==='base'&&x.n===key) hit=x; });
  if(!hit) cm.forEach(function(x){ if(x.__cal==='base'&&x.__bak&&x.__bak.n===key) hit=x; });
  if(!hit) return false;
  var name=hit.n;
  if(hit.__bak){ Object.assign(hit, hit.__bak); delete hit.__cal; delete hit.__bak; }
  else { var i=cm.indexOf(hit); if(i>=0) cm.splice(i,1); }
  pfAudit(pfCurApp().n, name, '撤销沿用旧版', '恢复为本次学习原始识别结果');
  return true;
}
function pfCmpSave(){
  var cb=pfCurBatch(), bb=pfCmpBase();
  if(!cb||!bb) return;
  if(cb.st==='pb'){ lpTip('已发布画像只读，请先取消发布'); return; }
  var keys=Object.keys(PF_CMP.draft||{}), n=0;
  keys.forEach(function(k){
    if(PF_CMP.draft[k]){ if(pfApplyAdopt(k,cb,bb)) n++; }
    else if(pfApplyUndo(k,cb,bb)) n++;
  });
  PF_CMP.draft={}; PF_CMP.chk={};
  if(!n){ lpTip('没有需要保存的改动'); lpRerender(); return; }
  lpTip('已保存 '+n+' 项改动，仍需点「发布」才对 TA 生效');
  lpRerender();
}
function pfCmpDiscard(){
  var n=pfCmpDraftN(); if(!n) return;
  PF_CMP.draft={}; PF_CMP.chk={};
  lpTip('已放弃 '+n+' 项未保存的改动');
  lpRerender();
}
/* 批量：对勾选的行统一开关 */
function pfCmpCheck(key){
  key=pfDK(key);
  if(PF_CMP.chk[key]) delete PF_CMP.chk[key]; else PF_CMP.chk[key]=1;
  lpRerender();
}
function pfCmpCheckAll(){
  var rs=pfCmpRows(pfCurBatch(),pfCmpBase()).filter(pfCmpSwitchable);
  var all=rs.length&&rs.every(function(r){ return PF_CMP.chk[r.key]; });
  PF_CMP.chk={};
  if(!all) rs.forEach(function(r){ PF_CMP.chk[r.key]=1; });
  lpRerender();
}
function pfCmpChkN(){ return Object.keys(PF_CMP.chk||{}).length; }
function pfCmpBatch(on){
  var n=0;
  Object.keys(PF_CMP.chk||{}).forEach(function(k){
    var r=pfCmpRowByKey(k); if(!r||!pfCmpSwitchable(r)) return;
    var want=on?1:0, saved=pfCmpSaved(r);
    if(want===saved) delete PF_CMP.draft[k]; else PF_CMP.draft[k]=want;
    n++;
  });
  if(!n){ lpTip('先勾选要处理的模块'); return; }
  var _L=pfCmpLab();
  lpTip('已'+(on?'采纳 '+_L.b:'撤销采纳')+' '+n+' 项，点【保存修改】后写入画像');
  lpRerender();
}

/* 兼容旧入口（自检仍在调用） */
function pfCmpAdopt(key){
  key=pfDK(key);
  var cb=pfCurBatch(), bb=pfCmpBase();

/* 模块清单里把「沿用旧版」的模块改回本次识别结果（对比视图不再提供撤销，入口挪到这里） */
function pfRestoreBase(ri){

function pfCmpUndo(key){

}

    var st='<span class="pf-ctag '+r.type+'">'+PF_CMP_T[r.type]+'</span>';

/* 全部采纳：一次性把整表回到基线。属于不可逆操作，必须二次确认。
   确定 = 直接写入画像（等同点一次【保存修改】），不再留草稿（沁 2026-11-18） */
function pfCmpAllV1(){
  var cb=pfCurBatch(), bb=pfCmpBase();
  if(!cb||!bb) return;
  if(cb.st==='pb'){ lpTip('已发布画像只读，请先取消发布'); return; }
  var L=pfCmpLab();
  var rows=pfCmpRows(cb,bb).filter(pfCmpSwitchable);
  var n=rows.filter(function(r){ return !pfCmpSaved(r); }).length;
  if(!rows.length||!n){ lpTip('当前没有可采纳的差异'); return; }
  lpConfirm('全部采纳 '+L.b+'？',
    '会把 '+L.c+' 里 <b>'+n+'</b> 处差异改成 '+L.b+'。<br>确定要全部采纳？操作不可逆。',
    function(){
      var ok=0;
      rows.forEach(function(r){
        if(pfCmpSaved(r)){ if(PF_CMP.draft.hasOwnProperty(r.key)) delete PF_CMP.draft[r.key]; return; }
        if(pfApplyAdopt(r.key,cb,bb)) ok++;
      });
      PF_CMP.draft={}; PF_CMP.chk={};
      lpTip('已采纳 '+ok+' 项并保存，点「发布」才对 TA 生效');
      lpRerender();
    },'warn');
}

/* 预览：不动数据，只看「保存后当前画像长什么样」——用抽屉，760 宽放得下 5 列。

/* 按当前草稿算出保存后的 V2 模块清单 */
function pfCmpFinalMods(cb, bb){
  var cm=pfMods(cb), rows=pfCmpRows(cb,bb), byKey={};
  rows.forEach(function(r){ byKey[r.key]=r; });
  var out=cm.map(function(m){ return {m:m,src:'V2'}; });
  Object.keys(PF_CMP.draft||{}).forEach(function(k){
    if(!PF_CMP.draft[k]) return;
    var r=byKey[k]; if(!r||!r.base) return;
    if(r.now){
      for(var i=0;i<out.length;i++){ if(out[i].m===r.now){ out[i]={m:r.base,src:'V1'}; break; } }
    }else out.push({m:r.base,src:'V1'});
  });
  /* 草稿里改回 V2 的（取消沿用），预览要回到本次识别结果 */
  Object.keys(PF_CMP.draft||{}).forEach(function(k){
    if(PF_CMP.draft[k]) return;
    var r=byKey[k]; if(!r||!r.now||!r.now.__bak) return;
    for(var i=0;i<out.length;i++){ if(out[i].m===r.now){ out[i]={m:r.now.__bak,src:'V2'}; break; } }
  });
  return out;
}

/* 模块列：当前版在上、基线版在下 —— 谁是谁写在标签上，不靠箭头猜。
   标签取 pfCmpLab()，跟着真实版本号走（V3 对 V2 时不会还写 V1/V2） */
function pfCmpNameCell(r, vB, vC){
  var b=r.base, c=r.now, L=pfCmpLab();
  function line(v, txt, mute){
    return '<div class="nmline'+(mute?' mute':'')+'"><i class="vbadge'+((v===L.b)?' old':'')+'">'+v+'</i>'
      +'<span title="'+txt+'">'+txt+'</span></div>';
  }
  if(r.type==='add') return line(L.c, c.n, 0)+line(L.b, '无此模块', 1);
  if(r.type==='del') return line(L.c, '已无此模块', 1)+line(L.b, b.n, 0);
  /* 两版同名时只写一行：写两遍一样的东西纯属噪音（沁 2026-11-18 说整列太花）。
     名字真变了才并列对照 ——「基线到底叫啥」只在有差异时才需要看 */
  if(b.n===c.n){
    return '<div class="nmline"><span title="'+L.c+' 与 '+L.b+' 同名：'+c.n+'">'+c.n+'</span></div>';
  }
  return line(L.c, c.n, 0)+line(L.b, b.n, 1);
}

/* 变更内容：主 API / API 列表 / 敏感度 三行说清，API 直接列出差异路径——
   只看名字改了没有不够，API 有可能变了但名字没变（沁 2026-11-18 提） */
/* 长 API 路径中间省略、保住尾巴：两个接口常常只有最后一段不同（…/device/check vs …/device/confirm），
   从尾部截断就正好把差异切掉了。完整路径放 title */
function pfShortPath(u){
  u=String(u||'');
  if(u.length<=34) return u;
  return u.slice(0,12)+'\u2026'+u.slice(-18);
}

/* 变更内容：只写变化项，全表统一 V2 在上 / V1 在下（和模块名称列同一顺序）。
   沁 2026-11-18 反馈：① 名称列 V2 在上、变更内容里 V1 在上，两处反着看很费劲；
   ② 整列太花，相同的项目不要在「修改」里再念一遍（原来每行都挂一句「未变项 … 与 V1 相同」），
   所以现在：一致的模块只给一个「—」，修改的只列真正变了的维度 */
function pfCmpChgCell(r){
  var b=r.base||{}, c=r.now||{}, L=pfCmpLab();

  if(r.type==='add') return '<div class="cl"><i class="k">来源</i><span class="dg">'+L.c+' 新识别，'+L.b+' 无此模块</span></div>';
  if(r.type==='del') return '<div class="cl"><i class="k">来源</i><span class="dg">'+L.c+' 未识别到，'+L.b+' 原有</span></div>';
  if(r.type==='same') return '<div class="cl"><i class="k"></i><span class="nil">&mdash;</span></div>';

  /* 同一维度：当前版值在上、基线版值在下，带版本徽标 */
  function two(k, t2, t1, mono, m2, m1){
    return '<div class="cl"><i class="k">'+k+'</i><div class="cvs col">'
      +'<span class="vv'+(mono?' mono':'')+'"'+(m2?' title="'+L.c+' '+m2+'"':'')+'>'
        +'<i class="vbadge">'+L.c+'</i><span class="tx">'+t2+'</span></span>'
      +'<span class="vv old'+(mono?' mono':'')+'"'+(m1?' title="'+L.b+' '+m1+'"':'')+'>'
        +'<i class="vbadge old">'+L.b+'</i><span class="tx">'+t1+'</span></span>'
      +'</div></div>';
  }

  var out=[];

  if(b.n!==c.n) out.push(two('模块名称', c.n, b.n));

  if((b.main||'')!==(c.main||'')){
    out.push(two('主 API', pfShortPath(c.main), pfShortPath(b.main), 1, c.main, b.main));
  }

  var bs=pfApiSet(b), cs=pfApiSet(c), add=[], del=[];
  Object.keys(cs).forEach(function(u){ if(!bs[u]) add.push(u); });
  Object.keys(bs).forEach(function(u){ if(!cs[u]) del.push(u); });
  if(add.length||del.length){
    var nb=(c.apis||[]).length||c.api||0, ob=(b.apis||[]).length||b.api||0;
    out.push('<div class="cl"><i class="k">API 数</i><span class="dg">'+L.c+' <b>'+nb+'</b> 个<i class="dv2">·</i>'+L.b+' '+ob+' 个</span></div>');
    add.slice(0,2).forEach(function(u){
      out.push('<div class="cl"><i class="k">新增 API</i><span class="dg apx" title="'+u+'">+ '+pfShortPath(u)+'</span></div>');
    });
    del.slice(0,2).forEach(function(u){
      out.push('<div class="cl"><i class="k">移除 API</i><span class="dg old apx" title="'+u+'">&minus; '+pfShortPath(u)+'</span></div>');
    });
    var rest=Math.max(0,add.length-2)+Math.max(0,del.length-2);
    if(rest) out.push('<div class="cl"><i class="k"></i><span class="nil">还有 '+rest+' 个接口变化</span></div>');
  }

  if((b.sens||'')!==(c.sens||'')){
    out.push('<div class="cl"><i class="k">敏感度</i><div class="cvs col">'
      +'<span class="vv"><i class="vbadge">'+L.c+'</i>'+(pfSensTag(c.sens)||'<span class="nil">未设置</span>')+'</span>'
      +'<span class="vv old"><i class="vbadge old">'+L.b+'</i>'+(pfSensTag(b.sens)||'<span class="nil">未设置</span>')+'</span>'
      +'</div></div>');
  }

  return out.join('')||'<div class="cl"><i class="k"></i><span class="nil">&mdash;</span></div>';
}

/* 「采纳基线」按钮：点一下把这一项换成基线版的内容（进草稿），再点一次撤销。
   按钮文字跟着版本走：基线是 V2 就写「采纳 V2」，是 V1 就写「采纳 V1」 */
function pfCmpOpsCell(r){
  var L=pfCmpLab();
  if(!pfCmpSwitchable(r)){
    return '<span class="nil" title="'+L.c+' 本次新增的模块，没有可采纳的 '+L.b+' 内容">&mdash;</span>';
  }
  var k=encodeURIComponent(r.key), on=pfCmpRowOn(r), saved=pfCmpSaved(r);
  var tip=on
    ? '点击取消：这一项改回 '+L.c+' 本次识别的结果（点【保存修改】后才写入画像）'
    : '点击采纳：这一项用 '+L.b+' 的名称 / 主 API / API 列表 / 敏感度（点【保存修改】后才写入画像）';
  return '<button class="pf-adopt'+(on?' on':'')+(saved?' done':'')+'" title="'+tip+'" '
    +'onclick="event.stopPropagation();pfCmpToggle(\''+k+'\')">'
    +(on?'<i class="ck">&#10003;</i>':'')+(on?'取消采纳':'采纳 '+L.b)+'</button>';
}

/* 选中模块的双栏明细：左边当前画像、右边对比基线，逐项对齐（与清单「当前在上」同一口径） */
function pfCmpDetail(r, bb, cb){
  var b=r.base, c=r.now, L=pfCmpLab();
  function cell(v, diff, empty){
    if(v===null||v===undefined||v==='') return '<span class="nil">'+(empty||'\u2014')+'</span>';
    return '<span class="'+(diff?'dft':'')+'">'+v+'</span>';
  }
  var h='<div class="pf-cmpd">';
  var app=pfCurApp();
  h+='<div class="rhd"><span><i class="vbadge">'+L.c+'</i>当前画像 <b>'+pfVerTx(app,cb)+'</b></span>'
    +'<span><i class="vbadge old">'+L.b+'</i>对比基线 <b>'+pfVerTx(app,bb)+'</b></span></div>';

  /* 模块名 */
  var nDiff=!!(b&&c&&b.n!==c.n);
  h+='<div class="row"><label>模块名称</label>'
    +'<div class="c1">'+(c?cell(c.n,nDiff,'\u2014'):'<span class="nil">'+L.c+' 无此模块</span>')+'</div>'
    +'<div class="c2">'+(b?cell(b.n,false):'<span class="nil">'+L.b+' 无此模块</span>')+'</div></div>';

  /* 主 API */
  var mDiff=!!(b&&c&&(b.main||'')!==(c.main||''));
  h+='<div class="row"><label>主 API</label>'
    +'<div class="c1">'+(c?cell(c.main,mDiff):'\u2014')+'</div>'
    +'<div class="c2">'+(b?cell(b.main,false):'\u2014')+'</div></div>';

  /* 敏感度 */
  var sDiff=!!(b&&c&&(b.sens||'')!==(c.sens||''));
  h+='<div class="row"><label>敏感度</label>'
    +'<div class="c1">'+(c?pfSensTag(c.sens):'\u2014')+'</div>'
    +'<div class="c2">'+(b?pfSensTag(b.sens):'\u2014')+'</div></div>';

  /* API 列表：并集对齐，标出只在哪一版 */
  var bset=pfApiSet(b), cset=pfApiSet(c);
  var all=[];
  ((b&&b.apis)||[]).forEach(function(a){ all.push({u:a.u,inB:1,inC:cset[a.u]?1:0,cntB:a.cnt}); });
  ((c&&c.apis)||[]).forEach(function(a){ if(!bset[a.u]) all.push({u:a.u,inB:0,inC:1,cntC:a.cnt}); });
  h+='<div class="row apis"><label>API 列表</label><div class="apis-box">';
  if(!all.length) h+='<div class="nil">两边都没有 API 记录</div>';
  all.forEach(function(x){
    var flag=x.inB&&x.inC?'<span class="tg both">共有</span>'
      :x.inB?'<span class="tg only-b">仅 '+L.b+'</span>'
      :'<span class="tg only-c">仅 '+L.c+'</span>';
    h+='<div class="apirow'+(x.inB&&x.inC?'':' diff')+'">'+flag
      +'<span class="u" title="'+x.u+'">'+x.u+'</span>'
      +'<span class="ct">'+(x.inB?pfNum(x.cntB)+' 次':'')+'</span></div>';
  });
  h+='</div></div>';
  h+='</div>';
  return h;
}

/* ---------- 模块分析 ---------- */
function pfDistSort(k){ PF_DIST_SORT=k; lpRerender(); }
/* 用户 × 模块 调用矩阵（演示数据，按模块热度与用户活跃度确定性生成） */
function pfUserMatrix(mods){
  var users=PF_USERS.slice(0,10), mx=0, mat=[];
  users.forEach(function(u,i){
    var row=[];
    mods.forEach(function(m,j){
      var hot=m.cnt/2300;                       /* 模块热度 0~1 */
      var w=0.35+((i*7+j*13)%11)/10;            /* 用户偏好 0.35~1.35 */
      var v=Math.round(hot*90*w);
      if(m.cnt<200 && (i+j)%3===0) v=0;         /* 冷门模块部分用户为 0 */
      if(v>mx) mx=v;
      row.push(v);
    });
    mat.push({u:u,row:row,total:row.reduce(function(a,c){return a+c;},0)});
  });
  return {users:users,mat:mat,mx:mx};
}
function pfAnalysis(b){
  var mods=pfMods(b), total=0;
  mods.forEach(function(m){ total+=m.cnt; });
  var ordList=(PF_DIST_SORT==='ord')?mods:mods.slice(0).sort(function(x,y){ return y.cnt-x.cnt; });
  var bars=ordList.slice(0,8);
  var M=pfUserMatrix(mods);

  var totalUsr=b.usr||1;
  mods.forEach(function(m){ if(m.usr>totalUsr) totalUsr=m.usr; });
  var common=mods.filter(function(m){ return m.usr/totalUsr>=0.5; }).length;
  var cold=mods.filter(function(m){ return m.usr/totalUsr<0.2; }).length;
  var single=mods.filter(function(m){ return m.api===1; }).length;
  var perCap=0;
  M.mat.forEach(function(r){ perCap+=r.row.filter(function(v){ return v>0; }).length; });
  perCap=M.mat.length?(perCap/M.mat.length).toFixed(1):'0.0';
  var pct=function(n){ return mods.length?Math.round(n/mods.length*100):0; };
  var sp=pct(single);

  var h='<div class="pf-viz">';

  /* 指标卡：圆形浅底图标 + 灰标题 + 大数字（2026-11-17 按参考图再改）
     辅助口径（单 API 占比 / 覆盖用户占比）并到标题右侧，数字行保持纯数字 */
  h+='<div class="pf-kpi">'
    +pfKpi('b1','M4 4h6v6H4zM14 4h6v6h-6zM4 14h6v6H4zM14 14h6v6h-6z','模块数',
        '本批共聚合出 '+mods.length+' 个模块，其中只抓到 1 个 API 的有 '+single+' 个（占 '+sp+'%），偏多说明聚类偏碎',mods.length)
    +pfKpi('b2','M5 19v-8M12 19V5M19 19v-5','人均访问模块',
        '每位用户平均用到几个模块，本批约 '+perCap+' 个（共 '+mods.length+' 个模块）。数字越小说明用户只用得到少数功能',perCap)
    +pfKpi('b3','M4 16l5-5 3 3 7-7','常用模块',
        '被 '+(Math.round(totalUsr*0.5))+' 人及以上访问过的模块（覆盖 ≥50% 用户），属核心链路，主 API 不能选错',common)
    +pfKpi('b4','M4 8l5 5 3-3 7 7','冷门模块',
        '少于 '+(Math.round(totalUsr*0.2))+' 人访问的模块（覆盖 <20% 用户），多为岗位专用或聚类碎片，可优先复核',cold)
    +'</div>';

  /* 第一行：模块调用量（条形）+ 模块规模分布（环形） */
  h+='<div class="pf-anrow">';
  h+='<div class="pf-dbox l"><div class="dh2">模块调用量<span class="sub">条长＝调用次数</span>'
    +'<span class="sel"><select onchange="pfDistSort(this.value)">'
    +'<option value="ord"'+(PF_DIST_SORT==='ord'?' selected':'')+'>按模块顺序</option>'
    +'<option value="cnt"'+(PF_DIST_SORT==='cnt'?' selected':'')+'>按调用量</option>'
    +'</select></span></div><div class="bd">';
  var bmax=1;
  bars.forEach(function(m){ if(m.cnt>bmax) bmax=m.cnt; });
  bars.forEach(function(m){
    var cover=Math.round(m.usr/totalUsr*100);
    h+='<div class="pf-hrow2"><span class="lb" title="'+pfN(m)+'">'+pfN(m)+'</span>'
      +'<div class="tr"><i style="width:'+(m.cnt/bmax*100).toFixed(1)+'%"></i></div>'
      +'<span class="vv">'+m.cnt.toLocaleString()+'</span>'
      +'<span class="cv" title="覆盖用户占比">'+cover+'% 用户</span></div>';
  });
  h+='</div></div>';

  var bk=[{l:'1 个 API',v:0,c:'#D5DBE5'},{l:'2 个 API',v:0,c:'#BCD3F7'},{l:'3 个 API',v:0,c:'#7FA9F0'},
          {l:'4 个 API',v:0,c:'#5B85EC'},{l:'5 个及以上',v:0,c:'#2B5CE6'}];
  mods.forEach(function(m){ var i=m.api>=5?4:m.api-1; if(i<0)i=0; bk[i].v++; });
  h+='<div class="pf-dbox r"><div class="dh2">模块规模分布<span class="sub">按 API 数 · 点色块切换</span></div><div class="bd">';
  h+=pfDonut(bk,mods.length);
  h+='<div class="pf-hint" style="margin-top:6px">'
    +(sp>=50?'单 API 模块占 '+sp+'%，聚类偏碎，建议合并或重新学习。':'单 API 模块占 '+sp+'%，分布正常。')
    +'</div>';
  h+='</div></div>';
  h+='</div>';

  /* 第二行：覆盖度散点（覆盖用户 × 调用量）+ 常用用户 */
  h+='<div class="pf-anrow" style="margin-top:12px">';
  h+=pfScatter(mods,totalUsr);
  h+=pfRank(mods,M,perCap);
  h+='</div>';

  /* 第三行：敏感度 × 访问用户（高敏模块被谁访问） */
  h+=pfSensPanel(mods,M);

  h+='</div>';
  return h;
}

/* 敏感度 × 访问用户（2026-11-17 新增）
   管理员在模块清单里给模块标了高敏/中敏，就该能在分析里回答"这些模块被谁在用"。
   这是 TA 做高危行为关注的入口，也是发布前自查：高敏模块是不是被一大票人访问（说明标错了或该拆） */
function pfSensPanel(mods,M){
  var cnt={high:0,mid:0,low:0,none:0};
  mods.forEach(function(m){ var k=(m.sens||'none'); if(!(k in cnt)) k='none'; cnt[k]++; });

  var rows=mods.filter(function(m){ return m.sens==='high'||m.sens==='mid'; })
    .sort(function(a,b){
      var rk=function(s){ return s==='high'?0:1; };
      if(rk(a.sens)!==rk(b.sens)) return rk(a.sens)-rk(b.sens);
      return b.cnt-a.cnt;
    });

  /* 2026-11-17 沁：原来的「敏感度与访问用户」看不懂——标题改成一句人话，
     副标把"这块表在回答什么"讲清楚；用户列改成按访问次数取前 10 位 */
  var h='<div class="pf-dbox" style="margin-top:12px"><div class="dh2">敏感模块访问列表'
    +'<span class="sub">标了高敏 / 中敏的模块，分别被哪些账号访问过</span>'
    +'<span class="senscnt">'
    +'<i style="color:'+PF_SENS.high.c+';background:'+PF_SENS.high.bg+'">高敏 '+cnt.high+'</i>'
    +'<i style="color:'+PF_SENS.mid.c+';background:'+PF_SENS.mid.bg+'">中敏 '+cnt.mid+'</i>'
    +'<i style="color:'+PF_SENS.low.c+';background:'+PF_SENS.low.bg+'">低敏 '+cnt.low+'</i>'
    +'<i style="color:'+PF_SENS.none.c+';background:'+PF_SENS.none.bg+'">未设置 '+cnt.none+'</i>'
    +'</span></div><div class="bd">';

  if(!rows.length){
    /* 2026-11-17 沁：敏感度初始为空，必须先到模块清单人工标注，这里才有归纳结果 */
    h+='<div class="pf-sensempty">'
      /* 2026-11-18 沁：改成管理员视角的话术——说清「去哪儿设、设哪类业务、设完这里才有数据」 */
      +'<div class="t1">敏感度还没有标记</div>'
      +'<div class="t2">敏感度由管理员人工标记，系统不会自动识别。请到「模块清单」给薪资、人事、设备控制这类业务模块标上高敏 / 中敏，'
        +'标记后这里才会列出哪些账号在访问它们。</div>'
      +'<button class="btn-plain" onclick="pfGoMods()">去「模块清单」标记</button>'
      +'</div>';
    return h+'</div></div>';
  }

  h+='<table class="pf-senstbl"><thead><tr><th>模块</th><th style="width:78px">敏感度</th>'
    +'<th class="r" style="width:78px">访问人数</th><th class="r" style="width:82px">请求数</th>'
    +'<th style="width:44%">访问次数最多的 10 个用户</th></tr></thead><tbody>';
  rows.forEach(function(m){
    var mi=mods.indexOf(m);
    /* 用户数取 m.usr，与模块清单同口径；矩阵只用来挑"谁排前面"，不用它算总数 */
    var us=M.mat.filter(function(r){ return r.row[mi]>0; })
      .sort(function(a,b){ return b.row[mi]-a.row[mi]; });
    /* 2026-11-17 沁：主要访问用户要看前 10 个，不再只给 3 个加省略号 */
    var top=us.slice(0,10);
    /* 用户名做成小标签：一整串顿号连着排，遇到长账号会被从中间断行（daishijin / g），很难看。
       title 里必须用纯文本——把带 class="uc" 的标签塞进属性会把引号截断，页面上会漏出一个 ">" */
    /* 2026-11-17 沁：默认一行放得下就一行，放不下省略号；完整 10 个人悬停气泡里看，移开就收 */
    var chips=top.map(function(r){ return '<span class="uc">'+r.u+'</span>'; }).join('')||'—';
    var tip='<b>访问次数前 '+top.length+' 的用户</b><div class="chips">'+chips+'</div>'
      +(us.length>top.length?'<div class="more">共 '+us.length+' 人访问过，这里按次数取前 '+top.length+' 位</div>':'');
    h+='<tr><td class="mn" title="'+pfN(m)+'">'+pfN(m)+'</td>'
      +'<td>'+pfSensTag(m.sens)+'</td>'
      +'<td class="r num">'+m.usr+'</td>'
      +'<td class="r num">'+m.cnt.toLocaleString()+'</td>'
      +'<td class="un"><span class="uline" onmouseenter="pfTipShow(this)" onmouseleave="pfTipHide()" '
        +'data-tip-html="'+encodeURIComponent(tip)+'">'+chips+'</span></td></tr>';
  });
  h+='</tbody></table>';
  h+='<div class="pf-hint" style="margin-top:8px">只看高敏 / 中敏模块，未标敏感度的模块不在这里出现。'
    +'如果某个高敏模块几乎全员都在访问，先回头看敏感度是不是标错了，或者这个模块本来就该拆成"看"和"改"两部分。</div>';
  h+='</div></div>';
  return h;
}

/* 指标卡（2026-11-17 按参考图再改）：左侧圆形浅底图标，右侧「灰小标题 / 大数字」两行。
   参考图标题行只有一个词，所以口径（单 API 43% / ≥50% 用户）挪到数字右侧做小注，
   标题行保持干净；口径不丢，但不再和标题串成一句话 */
/* 指标卡（2026-11-17 沁：只留数值和数值名称）
   口径说明不再跟着数字走，收进标题右侧的小问号里，悬停出气泡。
   卡片上只剩「名称 + 数字」两个信息，扫一眼就是四个数，要口径再 hover。 */
function pfKpi(cls,path,t,tip,v){
  return '<div class="k">'
    +'<span class="ic '+cls+'"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" '
    +'stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="'+path+'"/></svg></span>'
    +'<div class="kh"><span class="t">'+t
    +(tip?'<i class="qi" data-tip="'+tip+'">?</i>':'')
    +'</span><span class="kb"><b class="n">'+v+'</b></span></div></div>';
}

/* 环形图：替代原来的横条分档，一屏一眼看出"碎片占多少"。
   2026-11-17：色块可点，右侧数据卡跟着切到被点的那一档（原来固定只看单 API）。
   默认仍是第 0 档（单 API），因为碎片化是最常被问的问题 */
var PF_DONUT=0;
function pfDonutPick(i){ PF_DONUT=i; lpRerender(); }
function pfArcPath(cx,cy,r1,r2,a1,a2){
  var pt=function(a,r){ return [cx+r*Math.sin(a), cy-r*Math.cos(a)]; };
  var s1=pt(a1,r2), e1=pt(a2,r2), s2=pt(a2,r1), e2=pt(a1,r1);
  var big=((a2-a1)>Math.PI)?1:0;
  return 'M'+s1[0].toFixed(2)+' '+s1[1].toFixed(2)
    +'A'+r2+' '+r2+' 0 '+big+' 1 '+e1[0].toFixed(2)+' '+e1[1].toFixed(2)
    +'L'+s2[0].toFixed(2)+' '+s2[1].toFixed(2)
    +'A'+r1+' '+r1+' 0 '+big+' 0 '+e2[0].toFixed(2)+' '+e2[1].toFixed(2)+'Z';
}
function pfDonut(items,totalN){
  var W=168,H=168,cx=84,cy=84,r2=76,r1=52;
  var sum=0; items.forEach(function(x){ sum+=x.v; });
  var sel=Math.min(Math.max(PF_DONUT|0,0),items.length-1);
  if(sel<0) sel=0;
  var s='<svg class="pf-donut" viewBox="0 0 '+W+' '+H+'">';
  if(!sum){
    s+='<circle cx="'+cx+'" cy="'+cy+'" r="'+((r1+r2)/2)+'" fill="none" stroke="#EDEFF3" stroke-width="'+(r2-r1)+'"/>';
  }else{
    /* 两趟画：先画没被选中的，再把选中的那段半径 +5 叠上去（外凸 + 白描边）。
       一开始是靠"其余段压透明度"表示选中，结果选中的浅灰段反而显得最弱，看不出选了哪块 */
    var ang=[],acc=0;
    items.forEach(function(x){ var a1=acc/sum*Math.PI*2; acc+=x.v; ang.push([a1, acc/sum*Math.PI*2]); });
    items.forEach(function(x,i){
      if(!x.v||i===sel) return;
      s+='<path class="seg" d="'+pfArcPath(cx,cy,r1,r2,ang[i][0],ang[i][1])+'" fill="'+x.c+'"'
        +' onclick="pfDonutPick('+i+')">'
        +'<title>'+x.l+'：'+x.v+' 个模块（占 '+Math.round(x.v/sum*100)+'%），点击看这一档</title></path>';
    });

        +'<title>'+items[sel].l+'：'+items[sel].v+' 个模块（占 '+Math.round(items[sel].v/sum*100)+'%）</title></path>';

  s+='<text x="'+cx+'" y="'+(cy-2)+'" text-anchor="middle" class="dn">'+totalN+'</text>';
  s+='<text x="'+cx+'" y="'+(cy+15)+'" text-anchor="middle" class="dl">个模块</text>';

  });

/* 散点：横轴覆盖用户占比，纵轴调用次数，气泡＝API 数。
   和条形图看的是两件事：条形图看"谁被调得多"，散点看"多的是不是大家都要用"，
   四象限直接分出 全员高频 / 少数人重度 / 全员轻度 / 疑误聚 四类。
   （2026-11-17 复原：中途换成过「主 API 集中度」，沁说原来这张更好，改回来） */
/* 轴刻度的漂亮步长：1 / 2 / 5 × 10^n */
function pfNiceStep(v){
  if(!(v>0)) return 1;
  var e=Math.pow(10,Math.floor(Math.log(v)/Math.LN10)), f=v/e;
  return (f<=1?1:(f<=2?2:(f<=5?5:10)))*e;
}

function pfScatter(mods,totalUsr){
  var W=520,H=272,ml=36,mr=14,mt=22,mb=34;
  var pw=W-ml-mr, ph=H-mt-mb;
  var mx=0, maxU=1;
  mods.forEach(function(m){
    if(m.cnt>mx) mx=m.cnt;
    if(m.usr>maxU) maxU=m.usr;
  });
  /* 分母取「批次用户数」和「最大模块用户数」的较大者：
     模块用户是按模块分别去重的，同一个人可能让两个模块各记一次，
     直接除以批次用户数会算出 >100% 的覆盖率，点被夹到画布右边缘挤成一条线 */
  var base=Math.max(totalUsr||1,maxU);
  /* 刻度保持紧口径（0 / 500 / 1k），顶部靠 mt 留白 + 名字允许写到画布上沿来腾位置，
     不靠放大 yMax 硬拉空白——否则点全掉到底部，图会显得空 */
  var step=pfNiceStep((mx||10)/4), yMax=step*Math.max(1,Math.ceil((mx||10)*1.04/step));
  var fx=function(v){ return v>=1000?((v/1000)+'k'):v; };
  var px=function(v){ return ml+Math.max(0,Math.min(1,v))*pw; };
  var py=function(v){ return mt+ph-Math.max(0,Math.min(1,v/yMax))*ph; };

  var s='<svg class="pf-scat" viewBox="0 0 '+W+' '+H+'" preserveAspectRatio="xMidYMid meet">';
  for(var gv=0;gv<=yMax+1;gv+=step){
    if(gv>yMax) break;
    var gy=py(gv);
    s+='<line x1="'+ml+'" y1="'+gy.toFixed(1)+'" x2="'+(ml+pw)+'" y2="'+gy.toFixed(1)+'" stroke="#F0F2F5"/>';
    s+='<text x="'+(ml-8)+'" y="'+(gy+3.5).toFixed(1)+'" text-anchor="end" class="ax">'+fx(gv)+'</text>';
  }
  for(var g2=0;g2<=4;g2++){
    var gx=ml+pw*g2/4;
    s+='<line x1="'+gx.toFixed(1)+'" y1="'+mt+'" x2="'+gx.toFixed(1)+'" y2="'+(mt+ph)+'" stroke="#F7F8FA"/>';
  }
  s+='<text x="'+ml+'" y="'+(mt+ph+20)+'" class="ax">0</text>';
  s+='<text x="'+(ml+pw)+'" y="'+(mt+ph+20)+'" text-anchor="end" class="ax">100% 用户覆盖</text>';
  /* 四象限分割线：50% 覆盖处一条极淡虚线，把"人人用"和"少数人用"分开。
     角标文字改到图下方一行——画在角上会和右上角的气泡标签打架（第一版就叠在一起了） */
  s+='<line x1="'+px(0.5).toFixed(1)+'" y1="'+mt+'" x2="'+px(0.5).toFixed(1)+'" y2="'+(mt+ph)+'" stroke="#EDF0F4" stroke-dasharray="4 4"/>';

  var pts=mods.slice(0).sort(function(a,b){ return b.cnt-a.cnt; });
  /* 2026-11-17 沁：每个点都要带名字（原来只标"最大调用"和"最小覆盖"两个，其余点像没名字的云）。
     放法：下 → 上 → 右 → 左 → 更下 → 更上 依次试，挑第一个既不压别的气泡、
     也不压已放好的标签、又不出画布的位置；实在都放不下才退到正下方 */
  var circles=[], labs=[];
  var twOf=function(t){ var w=0; for(var i=0;i<t.length;i++){ w+=(/[\u4e00-\u9fa5]/.test(t.charAt(i))?10:5.8); } return w; };
  var over=function(a,b){ return !(a.x2<=b.x1||a.x1>=b.x2||a.y2<=b.y1||a.y1>=b.y2); };
  pts.forEach(function(m){
    var cover=base?m.usr/base:0;
    var cx=px(cover), cy=py(m.cnt);
    var r=5+Math.min(6,m.api||1)*1.7;
    var fill=cover>=0.5?'#2B5CE6':(cover>=0.2?'#7FA9F0':'#C9CFDA');
    s+='<circle cx="'+cx.toFixed(1)+'" cy="'+cy.toFixed(1)+'" r="'+r.toFixed(1)+'" fill="'+fill+'" fill-opacity="0.9">'
      +'<title>'+m.n+'：调用 '+m.cnt.toLocaleString()+' 次 · 覆盖 '+Math.round(cover*100)+'% 用户 · '+m.api+' 个 API</title></circle>';
    circles.push({x1:cx-r-2,y1:cy-r-2,x2:cx+r+2,y2:cy+r+2});
    labs.push({cx:cx,cy:cy,r:r,t:(m.n.length>10?m.n.slice(0,9)+'\u2026':m.n)});
  });
  var used=[];
  labs.forEach(function(l){
    var tw=twOf(l.t), th=10;
    /* 上下各三档 × 横向 0/±16/±32 错开：顶部三个点挨得近，
       只给"正上/正下"两个位置必然互压，多给几档才排得开 */
    var cand=[], lvs=[-(l.r+6),(l.r+13),-(l.r+19),(l.r+26),-(l.r+32),(l.r+39)];
    var dxs=[0,-16,16,-32,32];
    for(var li=0;li<lvs.length;li++){
      for(var di=0;di<dxs.length;di++) cand.push({a:'middle',x:l.cx+dxs[di],y:l.cy+lvs[li]});
    }
    cand.push({a:'start',x:l.cx+l.r+5,y:l.cy+3.5});
    cand.push({a:'end',x:l.cx-l.r-5,y:l.cy+3.5});
    /* 先试最近的位置：正上 / 正下 排最前 */
    cand.sort(function(p,q){
      var wp=Math.abs(p.x-l.cx)/10+Math.abs(p.y-l.cy)/6, wq=Math.abs(q.x-l.cx)/10+Math.abs(q.y-l.cy)/6;
      return wp-wq;
    });
    var pick=null;
    for(var i=0;i<cand.length;i++){
      var c=cand[i];
      var x1=c.a==='middle'?(c.x-tw/2):(c.a==='start'?c.x:c.x-tw);
      var box={x1:x1,x2:x1+tw,y1:c.y-th,y2:c.y+2};
      if(box.x1<ml+2||box.x2>ml+pw-2||box.y1<3||box.y2>mt+ph+4) continue;
      var bad=false;
      for(var k=0;k<circles.length;k++){ if(over(box,circles[k])){ bad=true; break; } }
      if(!bad){ for(var k2=0;k2<used.length;k2++){ if(over(box,used[k2])){ bad=true; break; } } }
      if(!bad){ pick={c:c,box:box}; break; }
    }
    if(!pick){
      var cx2=Math.min(Math.max(l.cx,ml+2+tw/2),ml+pw-2-tw/2);
      pick={c:{a:'middle',x:cx2,y:l.cy+l.r+13},box:{x1:cx2-tw/2,x2:cx2+tw/2,y1:l.cy+l.r+3,y2:l.cy+l.r+15}};
    }
    used.push(pick.box);
    s+='<text x="'+pick.c.x.toFixed(1)+'" y="'+pick.c.y.toFixed(1)+'" text-anchor="'+pick.c.a+'" class="bl">'+l.t+'</text>';
  });
  s+='</svg>';

  /* 图表类型：气泡图（bubble chart）——横轴覆盖率、纵轴调用次数、气泡面积＝API 数，
     三个变量一张图看完，比一张普通散点多一层信息。标题里点明"气泡图"，免得看着不知道是什么图 */
  var h='<div class="pf-dbox l"><div class="dh2">模块覆盖度气泡图'
    +'<span class="sub">横轴＝覆盖用户占比，纵轴＝调用次数，气泡大小＝API 数</span></div><div class="bd">'
    +s
    +'<div class="pf-legend">'
    +'<span><i style="background:#2B5CE6"></i>半数以上用户常用</span>'
    +'<span><i style="background:#7FA9F0"></i>两成到半数用户</span>'
    +'<span><i style="background:#C9CFDA"></i>不足两成，优先核是否误聚</span>'
    +'</div>'
    +'<div class="pf-hint" style="margin-top:8px">右上＝全员都在用，主 API 不能选错；左下＝少数人或疑误聚，优先核一核；气泡越大 API 越多，聚类越粗。</div>'
    +'</div></div>';
  return h;
}

}

function pfPad2(n){ return n<10?'0'+n:''+n; }
function pfTs(t){
  var d=new Date(t*1000);
  return d.getFullYear()+'-'+pfPad2(d.getMonth()+1)+'-'+pfPad2(d.getDate())+' '
    +pfPad2(d.getHours())+':'+pfPad2(d.getMinutes())+':'+pfPad2(d.getSeconds());

/* 一次学习批次 = 一批采集请求，按真实会话顺序生成 */
function pfReqData(b){
  var lr=(b.st==='lr');
  var key=(b.id||'')+'|'+(b.mod||0)+(lr?'|'+b.cnt:'');
  if(b._req && b._reqKey===key) return b._req;
  var mods=pfMods(b), apiMod={};
  mods.forEach(function(m){ (m.apis||[]).forEach(function(a){ apiMod[a.u]=m.n; }); if(m.main) apiMod[m.main]=m.n; });
  var seq=Object.keys(PF_API_META).filter(function(u){ return apiMod[u]; });
  if(!seq.length) seq=Object.keys(PF_API_META).slice(0,6);
  /* 学习中：样本条数随采集量增长（最多 60 行），时间锚定在"刚刚"，看起来是活的流 */
  var N=lr?Math.max(24,Math.min(60,Math.round((b.cnt||0)/600))):56;
  var t=lr?0:(new Date(2026,10,12,9,12,3).getTime()/1000), rows=[], sess=0, prevPk='';
  for(var k=0;k<N;k++){
    var u=seq[k%seq.length], meta=PF_API_META[u]||{pk:'/',gap:[1,5]};
    var isStart=(k%seq.length===0);
    var gap=0;
    if(k>0){
      if(isStart){ gap=600+((k*137)%2100); sess++; }
      else gap=meta.gap[0]+((k*7)%Math.max(1,meta.gap[1]-meta.gap[0]+1));
      t+=gap;
    }
    var sr='';
    if(isStart) sr=(k===0?'会话开始':PF_SR[sess%3]);
    rows.push({
      _t:t,
      user:PF_USERS[(Math.floor(k/seq.length)+k)%PF_USERS.length],
      ip:PF_IPS[(Math.floor(k/seq.length)*2+k)%PF_IPS.length],
      api:u, mod:apiMod[u]||'未归属', gap:gap,
      ref:prevPk?('https://spcconsole.example.com'+prevPk):'\u2014',
      pk:meta.pk, sr:sr, raw:PF_SR_RAW[sr]||'',
      flag:meta.flag||'', start:isStart
    });
    prevPk=meta.pk;
  }
  if(lr){
    var last=rows.length?rows[rows.length-1]._t:0;
    var shift=Date.now()/1000-25-last;
    rows.forEach(function(r){ r.ts=pfTs(r._t+shift); delete r._t; });
  }else{
    rows.forEach(function(r){ r.ts=pfTs(r._t); delete r._t; });
  }
  b._req=rows; b._reqKey=key;
  return rows;
}

}

function pfDtpMonthHtml(mm,side,rows){
  var first=new Date(mm.y,mm.m-1,1).getDay(), dn=new Date(mm.y,mm.m,0).getDate();
  var pd=new Date(mm.y,mm.m-1,0).getDate();
  var py=mm.m===1?mm.y-1:mm.y, pm=mm.m===1?12:mm.m-1;
  var ny=mm.m===12?mm.y+1:mm.y, nm=mm.m===12?1:mm.m+1;
  var cells=[], i;
  for(i=first-1;i>=0;i--) cells.push({y:py,m:pm,d:pd-i,ou:1});
  for(i=1;i<=dn;i++) cells.push({y:mm.y,m:mm.m,d:i});
  var total=(rows||6)*7, nx=0;
  while(cells.length<total){ nx++; cells.push({y:ny,m:nm,d:nx,ou:1}); }
  var s=PF_DTP.s, e=PF_DTP.e;
  var navL='<i class="pfd-pv pfd-yr" onclick="event.stopPropagation();pfDtpNav(-12)"></i>'
    +'<i class="pfd-pv pfd-mo" onclick="event.stopPropagation();pfDtpNav(-1)"></i>';
  var navR='<i class="pfd-nx pfd-mo" onclick="event.stopPropagation();pfDtpNav(1)"></i>'
    +'<i class="pfd-nx pfd-yr" onclick="event.stopPropagation();pfDtpNav(12)"></i>';
  var h='<div class="pfd-cal '+(side==='l'?'pfd-l':'pfd-r')+'"><div class="pfd-mh">'
    +(side==='l'?navL:'')+'<span class="pfd-tt">'+mm.y+' 年 '+mm.m+' 月</span>'+(side==='r'?navR:'')
    +'</div><div class="pfd-wk"><i>日</i><i>一</i><i>二</i><i>三</i><i>四</i><i>五</i><i>六</i></div><div class="pfd-dg">';
  cells.forEach(function(c){
    var ons=!!(s&&s.y===c.y&&s.m===c.m&&s.d===c.d);
    var one=!!(e&&e.y===c.y&&e.m===c.m&&e.d===c.d);
    var tod=(c.y===PF_DTP_NOW.y&&c.m===PF_DTP_NOW.m&&c.d===PF_DTP_NOW.d);
    h+='<i class="pfd-d'+(c.ou?' pfd-ou':'')+(tod?' pfd-tod':'')+(ons||one?' pfd-on':'')+'"'
      +' data-y="'+c.y+'" data-m="'+c.m+'" data-d="'+c.d+'"'
      +' onclick="event.stopPropagation();pfDtpDay(this)">'+c.d+'</i>';
  });
  return h+'</div></div>';
}
function pfDtpRender(){
  var cal=document.getElementById('pfDtCal'); if(!cal) return;
  var m2=PF_DTP.vm+1, y2=PF_DTP.vy;
  if(m2>12){ m2=1; y2++; }
  /* 两个月统一行数：只要有一个月需要 6 行，两边都撑到 6 行，底边对齐 */
  var rowN=function(y,m){
    var need=new Date(y,m-1,1).getDay()+new Date(y,m,0).getDate();
    return need>35?6:5;
  };
  var rows=Math.max(rowN(PF_DTP.vy,PF_DTP.vm),rowN(y2,m2));
  cal.innerHTML=pfDtpMonthHtml({y:PF_DTP.vy,m:PF_DTP.vm},'l',rows)
    +pfDtpMonthHtml({y:y2,m:m2},'r',rows);
  var s=PF_DTP.s, e=PF_DTP.e;
  var set=function(id,v){ var el=document.getElementById(id); if(el) el.value=v; };
  set('pfDtSd', s?pfDtpDate(s):'');
  set('pfDtSt', s?pfDtpTime(s):'');
  set('pfDtEd', e?pfDtpDate(e):'');
  set('pfDtEt', e?pfDtpTime(e):'');
}
function pfDtpOpen(){
  PF_DTP.s=pfDtpParse(PF_REQ_F.s);
  PF_DTP.e=pfDtpParse(PF_REQ_F.e);
  var base=PF_DTP.s||PF_DTP_NOW;
  PF_DTP.vy=base.y; PF_DTP.vm=base.m;
  PF_DTP.pick=(PF_DTP.s && !PF_DTP.e)?'e':'s';
  PF_DTP.open=true;
  var p=document.getElementById('pfDtp'), w=document.getElementById('pfDtr');
  if(p) p.classList.add('on');
  if(w) w.classList.add('on');
  pfDtpRender();
  /* 右侧放不下就往左挪，别被视口切掉 */
  if(p&&w){
    var r=w.getBoundingClientRect(), pw=p.offsetWidth||656, pad=12;
    var over=r.left+pw-(window.innerWidth-pad);
    p.style.left=(over>0?-over:0)+'px';
  }
}
function pfDtpClose(){
  PF_DTP.open=false;
  var p=document.getElementById('pfDtp'), w=document.getElementById('pfDtr');
  if(p) p.classList.remove('on');
  if(w) w.classList.remove('on');
}
/* 点日历：没有开始或两端都齐 → 重新开始；只差结束 → 补结束（倒序自动换位） */
function pfDtpDay(el){
  var y=+el.getAttribute('data-y'), m=+el.getAttribute('data-m'), d=+el.getAttribute('data-d');
  var st=function(hh,mm,ss){ return {y:y,m:m,d:d,hh:hh,mm:mm,ss:ss}; };
  if(!PF_DTP.s || (PF_DTP.s&&PF_DTP.e)){
    /* 第一击：定为开始日，时间取 00:00:00 */
    PF_DTP.s=st(0,0,0); PF_DTP.e=null; PF_DTP.pick='e';
  }else{
    /* 第二击：定为结束日，时间取 23:59:59；点早了就自动换位 */
    var q=st(23,59,59);
    if(pfDtpCmp(q,PF_DTP.s)<0){ PF_DTP.e=PF_DTP.s; PF_DTP.s=q; }
    else PF_DTP.e=q;
    PF_DTP.pick='s';
  }
  pfDtpRender();
}
/* 顶部四个输入框手填：日期 YYYY-MM-DD、时间 HH:mm:ss */
function pfDtpTyped(which,part,val){
  var st=PF_DTP[which];
  if(!st){
    st=which==='s'?pfDtpZero(PF_DTP.vy,PF_DTP.vm,1):{y:PF_DTP.vy,m:PF_DTP.vm,d:1,hh:23,mm:59,ss:59};
  }
  var v=String(val||'').trim();
  if(part==='d'){
    var m=/^(\d{4})[-\/](\d{1,2})[-\/](\d{1,2})$/.exec(v); if(!m) return pfDtpRender();
    st.y=+m[1]; st.m=+m[2]; st.d=+m[3];
  }else{
    var t=/^(\d{1,2}):(\d{1,2})(?::(\d{1,2}))?$/.exec(v); if(!t) return pfDtpRender();
    st.hh=Math.min(23,+t[1]); st.mm=Math.min(59,+t[2]); st.ss=Math.min(59,+(t[3]||0));
  }
  PF_DTP[which]=st;
  pfDtpRender();
}
function pfDtpNav(n){
  var m=PF_DTP.vm+n, y=PF_DTP.vy;
  while(m<1){ m+=12; y--; } while(m>12){ m-=12; y++; }
  PF_DTP.vm=m; PF_DTP.vy=y; pfDtpRender();
}
function pfDtpOk(){
  var s=PF_DTP.s, e=PF_DTP.e;
  if(!s||!e){ lpTip('请选择完整的开始和结束时间'); return; }
  if(pfDtpCmp(s,e)>0){ lpTip('开始时间不能晚于结束时间'); return; }
  PF_REQ_F.s=pfDtpFmt(s); PF_REQ_F.e=pfDtpFmt(e);
  pfDtpClose(); lpRerender();
}
function pfDtpClear(){
  PF_DTP.s=null; PF_DTP.e=null;
  PF_REQ_F.s=''; PF_REQ_F.e='';
  pfDtpClose(); lpRerender();
}
if(typeof document!=='undefined' && document.addEventListener){

function pfReqF(k,v){ PF_REQ_F[k]=v; lpRerender(); }
function pfReqReset(){
  PF_REQ_F={u:'',ip:'',kw:'',s:'',e:'',hideBg:true,hideTimed:true,hideChan:true};
  lpRerender();
}
function pfReqFiltered(b){
  var all=pfReqData(b), F=PF_REQ_F;
  var fs=pfTsNorm(F.s), fe=pfTsNorm(F.e);
  return all.filter(function(r){
    if(F.u && r.user!==F.u) return false;
    if(F.ip && r.ip!==F.ip) return false;
    if(F.kw && r.api.toLowerCase().indexOf(F.kw.toLowerCase())<0) return false;
    var ts=r.ts.replace(/-/g,'/');
    if(fs && ts<fs) return false;
    if(fe && ts>fe) return false;
    if(F.hideBg && r.flag==='bg') return false;
    if(F.hideTimed && r.flag==='timed') return false;
    if(F.hideChan && r.flag==='chan') return false;
    return true;
  });
}
function pfSpan(list){
  if(list.length<2) return '\u2014';
  var a=new Date(list[0].ts.replace(/-/g,'/')).getTime();
  var z=new Date(list[list.length-1].ts.replace(/-/g,'/')).getTime();
  var m=Math.round((z-a)/60000);
  return m<60?m+' 分钟':(m/60).toFixed(1)+' 小时';
}
/* 采集时间跨度按批次算：学习中到当前时刻，学完到结束时刻。
   不能用样例明细算——明细只是抽取的展示行，跨度会比真实学习期短一大截 */
function pfSpanB(b){
  if(!b||!b.ct) return '\u2014';
  var a=new Date(b.ct.replace(/-/g,'/')).getTime();
  var z=(b.st==='lr')?Date.now():new Date((b.et||b.ct).replace(/-/g,'/')).getTime();
  var m=Math.round((z-a)/60000);
  if(m<1) return '不足 1 分钟';
  if(m<60) return m+' 分钟';
  if(m<1440) return (m/60).toFixed(1)+' 小时';
  var d=m/1440;
  return (d<10?d.toFixed(1):Math.round(d))+' 天';
}
/* 四张卡口径：全部按批次采集总量折算，不随筛选跳动；
   明细只抽了最近若干条，用它算用户数/片段数会把量级说小 */
function pfReqStat(b, all){
  var sample=all.length||1;
  var total=b.cnt||sample;
  var k=total/sample;
  var segRaw=0; all.forEach(function(r){ if(r.start) segRaw++; });
  var seg=Math.max(1, Math.round(segRaw*(k>1?k:1)));
  var usr=b.usr||0;
  if(!usr){ var u={}; all.forEach(function(r){ u[r.user]=1; }); usr=Object.keys(u).length; }
  return { total:total, seg:seg, usr:usr, span:pfSpanB(b) };
}

/* ---------- 批次操作 ---------- */
function pfPublish(appId,batchId){
  var a=pfApp(appId), b=null;
  a.batches.forEach(function(x){ if(x.id===batchId) b=x; });
  if(!b) return;
  var cur=a.batches.filter(function(x){ return x.st==='pb'; })[0];
  var back=(b.st==='rp');
  /* 2026-11-18 沁给的文案：只问一句「发布后将立即生效，确定发布吗？」 */
  lpConfirm(back?'重新发布这份画像':'发布画像',
    '发布后将立即生效，确定发布吗？'
    +(cur?'<br>当前生效的「'+cur.id+'」将转为「已替换」。':'')
    , function(){
    a.batches.forEach(function(x){ if(x.st==='pb') x.st='rp'; });
    b.st='pb'; b.pt='2026-11-16 15:20';
    pfAudit(a.n,b.id,'发布画像',(back?'重新发布已替换批次 ':'发布批次 ')+b.id
      +(cur?'，替换原生效批次 '+cur.id:'')+'，采集 '+pfNum(b.cnt)+' 条');
    lpTip(back?'已重新发布，本批画像恢复生效':'已发布'); lpRerender();
  });
}
function pfUnpublish(appId,batchId){
  var a=pfApp(appId);
  lpConfirm('取消发布','取消后用户行为分析将无法获取模块标签，确定取消发布吗？',function(){
    a.batches.forEach(function(x){ if(x.id===batchId) x.st='pd'; });
    pfAudit(a.n,batchId,'取消发布','取消批次 '+batchId+' 的发布，该应用暂无生效画像');
    lpTip('已取消发布'); lpRerender();
  },'warn');
}

function pfDoStop(appId,batchId){
  var a=pfApp(appId), clear=document.querySelectorAll('input[name=pfstop]')[1], idx=-1;
  a.batches.forEach(function(x,i){ if(x.id===batchId) idx=i; });
  if(idx<0) return;
  var b=a.batches[idx];   /* 之前这里漏了定义，导致清除分支报 ReferenceError */
  if(clear && clear.checked){
    a.batches.splice(idx,1); PF_CUR.batch='';
    pfAudit(a.n,batchId,'结束学习','结束并清除采集数据 '+pfNum(b.cnt)+' 条，未生成画像');
    lpTip('已结束并清除采集数据');
  }else{
    a.batches[idx].st='an';
    pfAudit(a.n,batchId,'结束学习','基于已采集 '+pfNum(b.cnt)+' 条数据生成画像，进入分析中');

function pfDelBatch(appId,batchId){
  var a=pfApp(appId), b=null;
  a.batches.forEach(function(x){ if(x.id===batchId) b=x; });
  if(!b) return;
  if(b.st==='pb'){ lpTip('已发布画像不允许删除，请先取消发布'); return; }
  var busy=(b.st==='lr'||b.st==='an');
  lpConfirm('删除学习批次',
    (busy?'该批次正在'+(b.st==='lr'?'学习':'分析')+'，删除会中断任务。<br>':'')
    +'将同时删除该批次的采集数据（请求列表）共 '+pfNum(b.cnt)+' 条，不可恢复。', function(){
    for(var i=0;i<a.batches.length;i++) if(a.batches[i].id===batchId){ a.batches.splice(i,1); break; }
    PF_CUR.batch='';
    pfAudit(a.n,batchId,'删除批次','删除批次 '+batchId+' 及其采集数据 '+pfNum(b.cnt)+' 条');
    lpTip('已删除'); lpRerender();
  },'danger');
}

/* 删除应用：只要不存在已发布画像就能删；级联删除该应用全部批次与采集数据 */
function pfDelApp(){
  var a=pfCurApp();
  if(pfHas(a,'pb')){ lpTip('该应用存在已发布画像，需先取消发布才能删除'); return; }
  var total=0;
  a.batches.forEach(function(b){ total+=b.cnt||0; });
  /* 2026-11-18 沁：删掉「应用本身仍在数据中心纳管范围内，可随时重新发起学习」这句 */
  lpConfirm('删除应用',
    '将删除应用「'+a.n+'」及其全部 <b>'+a.batches.length+'</b> 个学习批次、<b>'+pfNum(total)+'</b> 条采集数据，不可恢复。', function(){
    var nm=a.n, n=a.batches.length;
    for(var i=0;i<PF_DATA.length;i++) if(PF_DATA[i].id===a.id){ PF_DATA.splice(i,1); break; }
    PF_CUR.app=PF_DATA[0]?PF_DATA[0].id:'';
    PF_CUR.batch=PF_DATA[0]&&PF_DATA[0].batches[0]?PF_DATA[0].batches[0].id:'';
    pfAudit(nm,'\u2014','删除应用','删除应用及其 '+n+' 个批次、'+pfNum(total)+' 条采集数据');
    lpTip('已删除应用「'+nm+'」'); lpRerender();
  },'danger');
}

/* 数字输入框（竹云 4.4.2 按钮式）：−  值  +，最小 1，不设上限时 max 传 0 */
function pfNumHtml(id,val,min,max,cb){
  return '<div class="pf-num" id="'+id+'_w">'
    +'<button type="button" tabindex="-1" onclick="pfNumStep(\''+id+'\',-1)">&#8722;</button>'
    +'<input id="'+id+'" type="number" min="'+min+'"'+(max?' max="'+max+'"':'')+' value="'+val+'"'
    +(cb?' oninput="'+cb+'"':'')
    +' onfocus="pfNumFocus(\''+id+'\',1)" onblur="pfNumFocus(\''+id+'\',0)">'
    +'<button type="button" tabindex="-1" onclick="pfNumStep(\''+id+'\',1)">+</button></div>';
}
function pfNumStep(id,d){
  var el=document.getElementById(id); if(!el) return;
  var min=parseInt(el.getAttribute('min'),10)||1, max=parseInt(el.getAttribute('max'),10)||0;
  var v=parseInt(el.value,10); if(isNaN(v)) v=min;
  v+=d; if(v<min) v=min; if(max && v>max) v=max;
  el.value=v;
  if(el.oninput) el.oninput();
}
function pfNumFocus(id,on){
  var w=document.getElementById(id+'_w');
  if(w && w.classList) w.classList[on?'add':'remove']('on');
}

function pfTogglePanel(e){

/* 点下拉框以外的任何地方都要收起（2026-11-17）：
   树形下拉一展开就是几百像素高，不收起的话下面学习时长区被盖住，用户以为自己点错了 */
if(typeof document!=='undefined' && document.addEventListener){
  document.addEventListener('click',function(e){
    var p=document.getElementById('pfPanel'), b=document.getElementById('pfSelBox');
    if(!p || !p.classList.contains('on')) return;
    if(p.contains(e.target) || (b && b.contains(e.target))) return;
    p.classList.remove('on');
    if(b) b.classList.remove('on');
  });
}
function pfRenderPanel(){
  var kw=((document.getElementById('pfKw')||{}).value||'').trim();
  var h='';
  PF_DC.forEach(function(dc){
    var hit=[];
    /* 从纳管应用全集取，删除过学习记录的应用也要能重新选回来 */
    PF_ALL.forEach(function(m){
      if(m.dc!==dc.n) return;
      if(kw && m.n.toLowerCase().indexOf(kw.toLowerCase())<0 && m.id.toLowerCase().indexOf(kw.toLowerCase())<0) return;
      hit.push(m);
    });
    if(!hit.length) return;
    h+='<div class="pf-pn lv0">'+dc.n+'</div>';
    dc.grps.forEach(function(g){
      var ga=hit.filter(function(a){return a.grp===g});
      if(!ga.length) return;
      h+='<div class="pf-pn lv1">'+g+'</div>';
      ga.forEach(function(m){
        var inList=!!pfApp(m.id);
        var st=inList?pfAppSt(pfApp(m.id)):'none', dis=(st==='lr'||st==='an');
        var ck=PF_SEL[m.id]!==undefined?'checked':'';
        var isOn=(PF_SEL[m.id]!==undefined);
        /* 必须 stopPropagation：点完会重绘列表，原节点已脱离文档，
           冒泡到 document 的「点空白收起」判断会认为点在了面板外，把下拉关掉（多选时尤为明显） */
        h+='<div class="pf-pn lv2'+(dis?' dis':'')+(isOn?' on':'')+'" onclick="event.stopPropagation();'+(dis?'lpTip(\'该应用正在学习中\')':'pfPick(\''+m.id+'\')')+'">'
          +'<input type="checkbox" '+(dis?'disabled':'')+' '+ck+' onclick="event.stopPropagation();'+(dis?'':'pfPick(\''+m.id+'\')')+'">'
          +'<span class="nm">'+m.n+'</span><span class="ft">'+(dis?'学习中':(inList?m.id:m.id+' · 未添加'))+'</span></div>';
      });
    });
  });
  document.getElementById('pfList').innerHTML=h||'<div class="pf-pn lv1" style="color:#A8ABB2">无匹配应用</div>';
  var pc=document.getElementById('pfPanelCnt');
  if(pc) pc.textContent='已选 '+Object.keys(PF_SEL).length+' 个';
}

function pfRenderLearnHint(){
  var box=document.getElementById('pfLearnHint');

}
function pfRenderPicked(){
  var ids=Object.keys(PF_SEL), h='';
  var box=document.getElementById('pfSelBox');
  if(box){
    var showN=ids.slice(0,2), rest=ids.length-showN.length;
    var chips=showN.map(function(id){
      var m=pfApp(id)||pfMeta(id);
      return '<span class="pf-chip">'+(m?m.n:id)+'<b onclick="event.stopPropagation();pfRemove(\''+id+'\')">&#10005;</b></span>';
    }).join('');
    if(rest>0) chips+='<span class="pf-chip more">+' + rest + '</span>';
    box.innerHTML=(chips||'<span class="ph">请选择应用（支持按数据中心、分组选择）</span>')+'<i class="arw"></i>';
  }
  if(!ids.length){
    h='<div class="pf-hint" style="padding:16px 0 4px">尚未选择应用。学习时长建议 7–30 天，需覆盖一个完整业务周期。</div>';
  }else{
    h='<table class="pf-picked"><thead><tr><th>应用名称</th><th>数据中心 / 分组</th>'
      +'<th style="width:152px">学习时长</th><th style="width:60px">操作</th></tr></thead><tbody>';
    ids.forEach(function(id){
      var a=pfApp(id)||pfMeta(id);
      h+='<tr><td>'+a.n+'</td><td style="color:#909399">'+a.dc+' / '+a.grp+'</td>'
        +'<td>'+pfNumHtml('pfDay_'+id,PF_SEL[id],1,0,'pfSetDays(\''+id+'\',this.value)')+' <span style="color:#4E5969">天</span></td>'
        +'<td><span class="rm" onclick="pfRemove(\''+id+'\')">移除</span></td></tr>';
    });
    h+='</tbody></table>';
    var bad=ids.filter(function(id){ var d=PF_SEL[id]; return d<7||d>30; });
    if(bad.length) h+='<div class="pf-hint warn" style="margin-top:8px">'+bad.length+' 个应用的学习时长不在 7–30 天建议区间，可能影响画像完整或增大采集量。</div>';
  }
  var box2=document.getElementById('pfPicked');
  if(box2) box2.innerHTML=h;
  var cnt=document.getElementById('pfCount');
  if(cnt) cnt.textContent='共选 '+ids.length+' 个应用';
  /* 一个应用都没选时「开始学习」不可点（不可点击就置灰，而不是点了再弹提示） */
  var sb=document.getElementById('pfStartBtn');
  if(sb) sb.disabled=!ids.length;
  pfRenderLearnHint();
}
function pfApplyBatch(){
  var v=parseInt((document.getElementById('pfBatch')||{}).value,10);
  if(isNaN(v)||v<1){ lpTip('学习时长至少 1 天'); return; }
  Object.keys(PF_SEL).forEach(function(id){ PF_SEL[id]=v; });
  pfRenderPicked(); lpTip('已统一设为 '+v+' 天');
}
function pfStartLearn(){
  var ids=Object.keys(PF_SEL);
  if(!ids.length){ lpTip('请先选择应用'); return; }
  var skip=[];
  ids=ids.filter(function(id){
    var a=pfApp(id);
    /* 不在列表里的应用（删除过学习记录）视为完全空闲，直接放行 */
    if(a && (pfAppSt(a)==='lr'||pfAppSt(a)==='an')){ skip.push(a.n); return false; }
    return true;
  });
  if(!ids.length){ lpTip('所选应用都在学习中，暂不可再次发起'); return; }
  ids.forEach(function(id){
    var a=pfApp(id);
    /* 删除过学习记录的应用：重新建回列表（应用本身仍在纳管范围内） */
    if(!a){
      var m=pfMeta(id);
      a={n:(m?m.n:id),id:id,dc:(m?m.dc:''),grp:(m?m.grp:''),at:(m&&m.at)||'2026-11-17',batches:[]};
      PF_DATA.push(a);
    }
    var d=PF_SEL[id], now='2026-11-16 15:40';
    a.batches.unshift({id:'PF-20261116-0'+(a.batches.length+1),days:d,cnt:186,usr:9,mod:0,
      st:'lr',pt:'',ct:now,et:now,left:d+' 天',pct:0});
    pfAudit(a.n,'\u2014','开始学习','学习时长 '+d+' 天，批次 PF-20261116-0'+(a.batches.length));
  });
  /* 2026-11-17 沁：开完学习就直接把这个应用选中、落到它的请求列表，
     不要再停在"选一个应用看画像"的缺省页——那样等于让用户再点一次才看到刚开的东西。
     同时开多个时选第一个，其余的从左列表点 */
  var first=null;
  PF_DATA.forEach(function(a){ if(!first && ids.indexOf(a.id)>=0) first=a; });
  if(first){
    PF_CUR.app=first.id;
    PF_CUR.batch=(first.batches[0]||{}).id||'';
    PF_CUR.tab=0;
  }

  PF_SEL={};
  pfCloseLearn();
  lpTip('已开启 '+ids.length+' 个应用的学习'+(skip.length?'，'+skip.length+' 个学习中已跳过':''));
  lpRerender();
}

/* ---------- 演示数据：让「新画像 vs 已发布画像」真的有差异可看 ----------
   spcconsole 的 PF-20261112-03（待发布，7 模块）对 PF-20261108-01（已发布，6 模块）：
   新增模块 / 模块改名 / 主 API 变更 / API 增减 / 模块消失，五种情形各一，
   这样对比页四态（新增 / 修改 / 消失 / 一致）都能点到。
   真实环境这些差异由两次学习的识别结果自然产生，原型里手工埋一份。 */
(function(){
  if(!PF_DEMO) return;
  var a=null, nb=null, pb=null;
  PF_DATA.forEach(function(x){ if(x.id==='spcconsole') a=x; });
  if(!a) return;
  (a.batches||[]).forEach(function(b){
    if(b.id==='PF-20261112-03') nb=b;
    if(b.id==='PF-20261108-01') pb=b;
  });
  if(!nb||!pb) return;

  pfMods(nb).forEach(function(m){
    if(m.n==='品牌定制查询') m.n='品牌配置查询';
    if(m.n==='设备卸载校验'){
      m.main='/blim-api/api/elogonconfig/v1/uninstall/device/confirm';
      m.apis.push({u:'/blim-api/api/elogonconfig/v1/uninstall/device/audit',cnt:24,usr:9});
      m.api=m.apis.length;
      m.cnt+=24;
    }
    if(m.n==='壁纸配置'){
      m.apis=m.apis.filter(function(x){ return x.u.indexOf('isallowedsetting')<0; });
      m.api=m.apis.length;
    }
  });

  var bm=pfMods(pb);
  if(!bm.some(function(m){ return m.n==='旧版权限校验'; })){
    bm.push({n:'旧版权限校验',api:1,main:'/blim-api/api/auth/v1/legacyPermit',cnt:42,usr:6,sens:'',
      apis:[{u:'/blim-api/api/auth/v1/legacyPermit',cnt:42,usr:6}]});
    pb.mod=bm.length; pb.__modsN=bm.length;   /* 两个一起改，否则下次 pfMods 会按模板重建把它冲掉 */
  }
})();

/* ---------- 0. 其他模块的列 / 按钮按现网修正（补丁层，不动原配置） ---------- */
(function(){
  function has(arr,name){ for(var i=0;i<arr.length;i++){ if((arr[i].t||arr[i].n||arr[i])===name) return true; } return false; }
  function renameToolbar(route,from,to){
    var c=LISTS[route]; if(!c||!c.toolbar) return;
    c.toolbar.forEach(function(x){ if(x && x.n===from) x.n=to; });
  }

  /* 终端设备：现网第 8 列是「终端平台」，另外有 4 个页签 */
  var dev=LISTS['/terminal/manage/device'];
  if(dev && dev.cols && !has(dev.cols,'终端平台')){
    var at=7;
    for(var i=0;i<dev.cols.length;i++){ if(dev.cols[i].t==='终端平台'){ at=i; break; } }
    if(dev.cols[at] && dev.cols[at].t!=='终端平台') dev.cols.splice(at,0,{t:'终端平台'});
    else dev.cols.push({t:'终端平台'});
    var pf=['Windows 10','Windows 11','macOS 14','统信 UOS','麒麟 V10','Windows 10','macOS 13','Windows 11'];
    (dev.rows||[]).forEach(function(row,ri){ if(row && row.length>6) row.splice(at,0,pf[ri%pf.length]); });
    if(!dev.tabs2) dev.tabs2=['终端管理','回收终端','终端分组','组织机构'];
  }

  /* Web应用：现网最后一列是「维护状态」，工具栏有 显示空组 / 维护 / 取消维护 */
  var web=LISTS['/resource/application/system'];
  if(web){
    if(web.cols && !has(web.cols,'维护状态')){
      web.cols.push({t:'维护状态'});
      (web.rows||[]).forEach(function(row,ri){ if(row) row.push(d(ri%7===0?'维护中':'正常', ri%7===0?'o':'g')); });
    }
    /* 现网工具栏就这 6 个，行内操作另有 详情/编辑/API服务/例外/染色 */
    web.toolbar=[{n:'显示空组'},{n:'新增',pri:true},{n:'更换分组'},{n:'维护'},{n:'取消维护'},{n:'删除'}];
    web.ops=[{n:'详情'},{n:'编辑'},{n:'API服务'},{n:'例外'},{n:'染色'}];
  }

  /* 操作员管理：现网工具栏有「启用」 */
  var op=LISTS['/system/operator/operator-manage'];
  if(op && op.toolbar && !op.toolbar.some(function(x){return x.n==='启用';})) op.toolbar.push({n:'启用'});

  /* 策略类页面：现网按钮叫「添加」不是「新增」 */
  ['/strategy/flow/cc','/strategy/flow/fusing','/strategy/flow/waf',
   '/strategy/identity/auth','/strategy/identity/agent','/strategy/network/ip'].forEach(function(r){
    renameToolbar(r,'新增','添加');
    renameToolbar(r,'添加','添加');   /* 幂等 */
  });

  /* 余下几处现网按钮补齐（2026-11-20 实采核对） */
  function addBtn(route,btn,pri){
    var c=LISTS[route]; if(!c) return;
    c.toolbar=c.toolbar||[];
    if(!c.toolbar.some(function(x){ return x.n===btn; })) c.toolbar.push({n:btn,pri:!!pri});
  }
  addBtn('/network/manage/agent_work','新增',true);
  addBtn('/resource/application/mail','隐藏空组');
  addBtn('/resource/application/net','隐藏空组');
  addBtn('/resource/datacenter/index','多语言');
  var sec1=LISTS['/system/setting/secret'];
  if(sec1){ sec1.toolbar=[{n:'新增',pri:true},{n:'删除'}]; sec1.ops=[{n:'编辑'},{n:'删除'},{n:'禁用'}]; }
  var aaa=LISTS['/audit/flow/application'];
  if(aaa && aaa.ops && !aaa.ops.some(function(x){return x.n==='查看';})) aaa.ops.unshift({n:'查看'});
})();

/* ================= 流量染色（师大需求，2026-11-20） =================
   入口：资源 › Web应用 › 行内「染色」
   抽屉「流量染色」：顶部规则表 + 响应内容区 + 规则置换区（右上角「智能学习 >>」）

   确定后把学习结果自动化核准并回填到「规则置换」明细。 */

var DYE={ url:'', resp:[], rep:[] };            /* resp=响应内容规则  rep=规则置换 */
var DYE_STORE={};                               /* 按应用名分开存，切换应用不串数据 */
var DYE_ML={ on:true, deadline:'', pos:'全部',

/* ---------- 区块骨架 ---------- */
function dyeSec(title,desc,extra,body){
  return '<div class="dye-sec"><div class="dye-sh"><span class="t">'+title+'</span>'
    + '<span class="r">'+(extra||'')+'</span></div>'
    + '<div class="dye-sd">'+desc+'</div>' + body + '</div>';
}
function dyeUrlBlock(mode){
  var chk = mode==='rep'
    ? '<span class="dye-ck on" onclick="dyeChk(this)"></span>' : '';
  return '<div class="dye-url"><span class="ar">&#9662;</span>'
    + '<span class="lb">请求URL:</span>' + chk
    + '<input type="text" class="dye-url-in" value="'+(DYE.url||'')+'" placeholder="请输入URL地址/路径">'
    + '<span class="del" title="删除该URL" onclick="lpTip(\'已删除该 URL 分组\')">'
    + '<svg width="14" height="14" viewBox="0 0 16 16" fill="none"><path d="M3 4.5h10M6.5 4.5V3h3v1.5M4.5 4.5l.6 8.2h5.8l.6-8.2" stroke="currentColor" stroke-width="1.1" stroke-linecap="round" stroke-linejoin="round"/></svg>'
    + '</span></div>';
}
function dyeChk(el){ el.classList.toggle('on'); }

/* ---------- 顶部规则表 ---------- */
function dyeTop(){
  return '<div class="dye-top-wrap"><table class="lp-tbl dye-top">'
    + '<thead><tr><th style="width:60px">序号</th><th>请求URL</th><th style="width:120px">响应内容</th>'
    + '<th style="width:120px">规则置换</th><th style="width:80px">操作</th></tr></thead>'
    + '<tbody><tr><td colspan="5"><div class="lp-empty">暂无数据</div></td></tr></tbody></table></div>';
}
function dyeRespTable(){
  var rows=DYE.resp.length? DYE.resp.map(function(x,i){
    return '<tr><td>'+(i+1)+'</td><td>'+x[0]+'</td><td>'+(x[1]||'--')+'</td>'
      + '<td><a class="lk red" onclick="dyeDel(\'resp\','+i+')">删除</a></td></tr>'; }).join('')
    : '<tr><td colspan="4"><div class="lp-empty">暂无数据</div></td></tr>';
  return '<table class="lp-tbl dye-tbl"><thead><tr><th style="width:60px">序号</th><th>目标数据</th>'
    + '<th>置换后数据</th><th style="width:90px">操作</th></tr></thead><tbody>'+rows+'</tbody></table>';
}
function dyeRepTable(){
  var rows=DYE.rep.length? DYE.rep.map(function(x,i){
    return '<tr><td>'+(i+1)+'</td><td>'+x[0]+'</td><td>'+x[1]+'</td><td>'+(x[2]||'--')+'</td>'
      + '<td><a class="lk red" onclick="dyeDel(\'rep\','+i+')">删除</a></td></tr>'; }).join('')
    : '<tr><td colspan="5"><div class="lp-empty">暂无数据</div></td></tr>';
  return '<table class="lp-tbl dye-tbl"><thead><tr><th style="width:60px">序号</th><th style="width:110px">置换位置</th>'
    + '<th>原数值</th><th>置换后数值</th><th style="width:80px">操作</th></tr></thead><tbody>'+rows+'</tbody></table>';
}
function dyeHtml(){
  var resp = dyeSec('响应内容','指定请求URL，并设置响应报文中需要修改内容的匹配规则和置换内容。',
      '<span class="plus" title="新增 URL 分组" onclick="lpTip(\'已新增一个 URL 分组\')">+</span>',
      dyeUrlBlock('resp')
      + '<div class="dye-in"><textarea rows="2" id="dyeR1" placeholder="请输入目标数据匹配规则"></textarea>'
      +   '<textarea rows="2" id="dyeR2" placeholder="请输入置换后数据"></textarea>'
      +   '<button class="btn-pri" onclick="dyeAdd(\'resp\')">添加</button></div>'
      + dyeRespTable());

  var rep = dyeSec('规则置换','指定请求URL，并设置需要修改内容的匹配规则和置换内容。',
      '<button class="btn-plain dye-mlbtn" onclick="dyeMlOpen()">智能学习 &gt;&gt;</button>',
      dyeUrlBlock('rep')
      + '<div class="dye-in"><select id="dyePos" class="dye-sel">'
      +   '<option value="">请选择置换位置</option>'
      +   DYE_POS.map(function(p){ return '<option>'+p+'</option>'; }).join('') + '</select>'
      +   '<input type="text" id="dyeRep1" placeholder="请输入置换前数值">'
      +   '<input type="text" id="dyeRep2" placeholder="请输入置换后数值">'
      +   '<button class="btn-pri" onclick="dyeAdd(\'rep\')">添加</button></div>'
      + dyeRepTable());

  return '<div class="dye">'+dyeTop()+resp+rep+'</div>';
}
function dyeAdd(kind){
  if(kind==='resp'){
    var a=document.getElementById('dyeR1'), b=document.getElementById('dyeR2');
    if(!a.value.trim()){ lpTip('请输入目标数据匹配规则'); return; }
    DYE.resp.push([a.value.trim(), b.value.trim()||'--']); a.value=''; b.value='';
  } else {
    var p=document.getElementById('dyePos'), c=document.getElementById('dyeRep1'), d=document.getElementById('dyeRep2');
    if(!p.value){ lpTip('请选择置换位置'); return; }
    if(!c.value.trim()){ lpTip('请输入置换前数值'); return; }
    DYE.rep.push([p.value, c.value.trim(), d.value.trim()||'--']);
    c.value=''; d.value='';
  }
  dyeRerender();
}
function dyeDel(kind,i){
  (kind==='resp'? DYE.resp : DYE.rep).splice(i,1);
  dyeRerender();
}
function dyeRerender(){
  var box=document.querySelector('#dBody .dye');
  if(box) box.outerHTML=dyeHtml();
}
/* 从 Web应用 行内「染色」打开 */
function dyeOpen(r,gi){

function dyeMlBody(){
  var rows=DYE_ML.rows.length? DYE_ML.rows.map(function(x,i){
    return '<tr><td>'+(i+1)+'</td><td>'+x[0]+'</td><td>'+x[1]+'</td><td>'+x[2]+'</td>'

    + '<div class="dyem-row"><label><em>*</em>截止时间</label>'
      + '<input type="text" id="dyeMlDl" value="'+DYE_ML.deadline+'" placeholder="请设置自学习截止时间"></div>'

      + '<div class="dyem-l1"><select id="dyeMlPos">'
        + ['全部'].concat(DYE_POS).map(function(p){
            return '<option'+(p===DYE_ML.pos?' selected':'')+'>'+p+'</option>'; }).join('') + '</select>'
        + '<input type="text" id="dyeMl1" placeholder="请输入置换前数值"></div>'
      + '<div class="dyem-l2"><input type="text" id="dyeMl2" placeholder="请输入置换后数值">'
        + '<button class="btn-pri" onclick="dyeMlAdd()">添加</button></div>'
      + '</div></div>'
    + '<table class="lp-tbl dyem-tbl"><thead><tr><th style="width:60px">序号</th><th style="width:100px">置换位置</th>'
      + '<th>原数值</th><th>置换后数值</th><th style="width:80px">操作</th></tr></thead><tbody>'+rows+'</tbody></table>'
    + '</div>';

function dyeMlOpen(){
  lpOpenModal('智能学习策略', dyeMlBody(),
    '<button class="btn-pri" onclick="dyeMlOk()">确定</button>');
  var m=document.getElementById('modal'); if(m) m.classList.add('dyem-box');
}
function dyeMlToggle(el){ el.classList.toggle('on'); DYE_ML.on=el.classList.contains('on'); }
function dyeMlAdd(){
  var p=document.getElementById('dyeMlPos'), a=document.getElementById('dyeMl1'), b=document.getElementById('dyeMl2');
  if(!p.value){ lpTip('请选择置换位置'); return; }
  if(!a.value.trim()){ lpTip('请输入置换前数值'); return; }
  DYE_ML.rows.push([p.value, a.value.trim(), b.value.trim()||'--']);
  a.value=''; b.value='';
  var bd=document.getElementById('mBody'); if(bd) bd.innerHTML=dyeMlBody();
}
function dyeMlDel(i){
  DYE_ML.rows.splice(i,1);
  var bd=document.getElementById('mBody'); if(bd) bd.innerHTML=dyeMlBody();
}
function dyeMlOk(){
  var dl=document.getElementById('dyeMlDl');
  DYE_ML.deadline=dl? dl.value : DYE_ML.deadline;
  if(!DYE_ML.rows.length){ lpTip('暂无学习到的置换规则'); return; }
  /* 学习结果自动化核准：直接回填「规则置换」明细 */
  DYE_ML.rows.forEach(function(x){ DYE.rep.push([x[0],x[1],x[2]]); });
  DYE_ML.rows=[];
  lpCloseModal();
  dyeRerender();
  lpTip('已按智能学习结果自动生成并核准 '+DYE.rep.length+' 条置换规则');
}

/* ================= 客户端隧道管控（中储粮需求，2026-11-20） =================
   入口：终端 › 客户端 › 客户端版本 › 左侧树「客户端隧道管控」
   页面：客户端隧道管控策略 —— 勾选组织，被勾选的移动端走零信任 SDK 隧道，未勾选走原有业务通道。 */

var TUN_TREE={n:'组织架构',c:[
  {n:'总裁办'},
  {n:'技术部',c:[{n:'研发一部'},{n:'研发二部'},{n:'测试部'}]},
  {n:'销售部',c:[{n:'华中区'},{n:'华南区'},{n:'华北区'}]},
  {n:'人事部'},
  {n:'财务部'},
  {n:'市场部'}
]};
var TUN_SEL={'销售部':1,'华中区':1,'华南区':1,'华北区':1,'人事部':1,'财务部':1};
var TUN_OPEN={'组织架构':1,'销售部':1};
var TUN_TOTAL=30;                /* 组织总数（演示口径，与现网截图 3/30 一致） */
var TUN_ACTIVE='销售部';          /* 已选列表里高亮的那一行 */

function tunPicked(c,r){
  var its=treeItems(c), it=its[lst(r).node||0];
  return !!(it && it.n==='客户端隧道管控');
}
function tunFind(name,node){
  node=node||TUN_TREE;
  if(node.n===name) return node;
  var kids=node.c||[];
  for(var i=0;i<kids.length;i++){ var f=tunFind(name,kids[i]); if(f) return f; }
  return null;
}
function tunState(o){
  if(!o.c || !o.c.length) return TUN_SEL[o.n]? 'on':'';
  var n=0;
  o.c.forEach(function(k){ if(tunState(k)==='on'||tunState(k)==='half') n+=1; });
  if(n===0) return TUN_SEL[o.n]? 'on':'';
  if(n===o.c.length && TUN_SEL[o.n]!==0) return 'on';
  return 'half';
}
function tunNode(o,lv,forceOpen){
  var st=tunState(o), hasKid=!!(o.c&&o.c.length), op=!!TUN_OPEN[o.n];
  var ar='<span class="ar'+(hasKid&&(op||forceOpen)?' open':'')+'"'
    + ' onclick="event.stopPropagation();tunExp(\''+o.n+'\')">&#9654;</span>';
  var h='<div class="tunn'+(st==='half'?' half':'')+'" style="padding-left:'+(lv*20+8)+'px" '
    + 'onclick="tunPick(\''+o.n+'\')">'
    + ar + '<span class="cb '+(st||'')+'"></span><span class="nm">'+o.n+'</span></div>';
  if(hasKid && (op||forceOpen)) h+=o.c.map(function(k){ return tunNode(k,lv+1,forceOpen); }).join('');
  return h;
}
function tunChips(){
  var out=[];
  (function walk(nodes,supp){
    nodes.forEach(function(o){
      var st=tunState(o);
      if(st==='on'){ if(!supp) out.push(o.n); }
      else if(st==='half'){ out.push(o.n); walk(o.c||[],true); }
    });
  })(TUN_TREE.c,false);
  return out;
}
function tunHtml(){
  var chips=tunChips();
  return '<div class="tun">'
    + '<div class="tun-hd">客户端隧道管控策略</div>'
    + '<div class="tun-tip"><span class="i">i</span><div>'
      + '此功能仅在「移动端」条件下生效，PC端应用不受此策略控制。<br>'
      + '勾选的组织，所属用户的移动设备流量将走零信任SDK隧道加密传输，未勾选的组织，所属用户的移动设备流量仍走原有业务通道，'
      + '业务访问不受影响，此策略用于灰度验证SDK稳定性，可随时取消勾选回退，不会阻断业务</div></div>'
    + '<div class="tun-bar"><span>选择组织机构</span>'
      + '<button class="btn-pri" onclick="lpTip(\'客户端隧道管控策略已保存\')">保存</button></div>'
    + '<div class="tun-wrap">'
      + '<div class="tun-l">'
        + '<div class="tun-search"><i class="iconfont icon-search"></i>'
        + '<input placeholder="输入部门名称" oninput="tunFilter(this.value)"></div>'
        + '<div class="tun-tree" id="tunTree"><div class="tun-root">'
          + '<span class="ar open" onclick="tunExp(\'组织架构\')">&#9654;</span>'
          + '<span class="nm">组织架构</span></div>'
          + TUN_TREE.c.map(function(o){ return tunNode(o,1); }).join('') + '</div>'
      + '</div>'
      + '<div class="tun-r">'
        + '<div class="tun-rhd"><span>已选 <b>'+chips.length+'</b>/'+TUN_TOTAL+'</span>'
        + '<a class="lk" onclick="tunClear()">清空</a></div>'
        + '<div class="tun-sel">'+(chips.length? chips.map(function(n){
            return '<div class="chip'+(n===TUN_ACTIVE?' on':'')+'" onclick="tunActive(\''+n+'\')">'+n
              + '<span class="x" onclick="event.stopPropagation();tunPick(\''+n+'\')">&times;</span></div>'; }).join('')
            : '<div class="lp-empty" style="padding:40px 0">暂未选择组织</div>')+'</div>'
      + '</div>'
    + '</div></div>';
}
function tunRerender(){
  var box=document.querySelector('.lp-body .tun');
  if(box) box.outerHTML=tunHtml();
}
function tunActive(name){ TUN_ACTIVE=name; tunRerender(); }
function tunPick(name){
  var o=tunFind(name);
  if(!o) return;
  var on = tunState(o)==='on'? 0:1;
  TUN_SEL[o.n]=on;
  (function setKids(x){ (x.c||[]).forEach(function(k){ TUN_SEL[k.n]=on; setKids(k); }); })(o);
  if(on) TUN_OPEN[o.n]=1;
  /* 回写父级：全选=1，全不选=0，部分=由 tunState 推 half */
  (function up(node){
    (node.c||[]).forEach(function(k){
      up(k);
      if(k.c && k.c.length){
        var n=0; k.c.forEach(function(g){ if(tunState(g)==='on'||tunState(g)==='half') n+=1; });
        TUN_SEL[k.n] = n===k.c.length? 1 : 0;
      }
    });
  })(TUN_TREE);
  if(on) TUN_ACTIVE=name;
  tunRerender();
}
function tunExp(name){
  TUN_OPEN[name]=TUN_OPEN[name]?0:1;
  tunRerender();
}
function tunClear(){
  Object.keys(TUN_SEL).forEach(function(k){ TUN_SEL[k]=0; });
  TUN_ACTIVE='';
  tunRerender();
}
function tunFilter(v){
  v=String(v||'').trim();
  var box=document.getElementById('tunTree'); if(!box) return;
  var all=box.querySelectorAll('.tunn');
  if(!v){
    for(var j=0;j<all.length;j++) all[j].classList.remove('hide');
    return;
  }
  for(var i=0;i<all.length;i++){
    var nm=all[i].querySelector('.nm').textContent;
    var hit=nm.indexOf(v)>=0;
    all[i].classList.toggle('hide',!hit);
    /* 命中的节点，把子级一起放出来 */
    if(hit){
      var nx=all[i].nextElementSibling;
      var lv=(all[i].style.paddingLeft||'0').replace('px','')|0;
      while(nx && nx.classList.contains('tunn')){
        var nlv=(nx.style.paddingLeft||'0').replace('px','')|0;
        if(nlv<=lv) break;
        nx.classList.remove('hide'); nx=nx.nextElementSibling;
      }
    }
  }
}

/* ================= 通用详情抽屉深挖（2026-11-20 沁：详情要点得开、层级要有） =================

/* ---------- 派生 ---------- */
function gdtSeed(s){
  var h=7;
  for(var i=0;i<s.length;i++) h=(h*31+s.charCodeAt(i))%9973;
  return h;
}
function gdtTime(seed,k){
  var dd=4+((seed+k*3)%9), hh=8+((seed+k*7)%10), mm=(seed*5+k*17)%60, ss=(seed*11+k*29)%60;
  return '2026-11-'+(dd<10?'0'+dd:dd)+' '+p2(hh)+':'+p2(mm)+':'+p2(ss);
}
function gdtName(row){
  var v=strip(String(row&&row[0]!=null?row[0]:''));
  if(v.length>14) v=v.slice(0,14)+'…';
  return v||'当前对象';
}

function gdtLogRows(c,row,gi,n){
